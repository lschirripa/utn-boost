## 1. La idea en criollo

Laplace es una **máquina de traducir**: le das una función del tiempo $f(t)$ (con $t>0$) y te devuelve una función de otra variable, $F(s)$. La traducción está definida por una integral:

$$
\mathcal{L}[f(t)]=F(s)=\int_0^\infty f(t)\,e^{-st}\,dt
$$

$t$ es una variable real positiva y $s$ una variable compleja (en los ejercicios siempre vas a evaluar $F$ en números reales). El viaje de vuelta se llama **antitransformada**: $\mathcal{L}^{-1}[F(s)]=f(t)$.

Tres cosas que hay que tener claras desde el arranque:

1. **La integral casi nunca se calcula.** Se usa la **tabla** (para ir y para volver) y las **propiedades**, que son atajos: "si en el tiempo multiplicás por $t$, en $s$ derivás", "si multiplicás por $e^{at}$, corrés la $s$", etc. Tabla y propiedades están en el ayudamemoria.
2. **La definición sí hay que saberla**, porque hay un tipo de ítem que sale directo de ella: como la definición *es* una integral de $0$ a $\infty$, cualquier integral $\int_0^\infty f(t)\,e^{-5t}dt$ es $F(5)$ (§4 y §5).
3. **Para qué sirve:** convierte derivadas en multiplicaciones por $s$, así que una ecuación diferencial se vuelve una ecuación algebraica (§12 y toda la guía `03`).

El PDF de clase lo muestra con el ejemplo más simple, $f(t)=1$:

$$
F(s)=\int_0^\infty e^{-st}\,dt=\left[\frac{e^{-st}}{-s}\right]_0^\infty=\frac1s
$$

> **En clase:** "nosotros no vamos a estar resolviendo estas integrales todo el tiempo […] vamos a trabajar con una tablita que te dice, che, si vos querés transformar esta función, su transformada es esta. Y que también nos sirve en el camino contrario" (teórica [05:13]).
>
> **En clase:** sobre las demostraciones de las propiedades (las manuscritas del PDF "Propiedades y funciones especiales"): "nadie se las va a pedir" (teórica [17:30]); "¿las demostraciones para el parcial? […] ni para final […] no son importantes" (teórica [1:27:45]). La única "demostración" que se tomó es la de $\mathcal{L}(2^t)$, que son dos renglones (§3).

**¿Toda función tiene transformada?** (PDF de clase y teórico, una sola lectura.) Alcanza con que $f$ sea **seccionalmente continua** (continua salvo en una cantidad finita de saltos finitos) y **de orden exponencial** (a partir de algún $t_0$ queda encerrada entre dos exponenciales: $\lvert f(t)\rvert\le Me^{\alpha t}$). Es una condición **suficiente, no necesaria**: $\frac{1}{\sqrt t}$ no es seccionalmente continua (se va a infinito en $0$) y sin embargo tiene transformada. Todas las funciones de la tabla la cumplen.

## 2. Qué tenés en el ayudamemoria y qué va de memoria

En el parcial se puede usar **solo el ayudamemoria oficial + una tabla de integrales**. Abrilo y ubicá cada cosa (págs. 1 y 2):

**Está en el ayudamemoria** (no se memoriza: se sabe encontrar y aplicar):

- 📄 La definición $\mathcal{L}[f(t)]=\int_0^\infty f(t)e^{-st}dt$.
- 📄 1ª traslación $\mathcal{L}[e^{at}f(t)]=F(s-a)$; 2ª traslación; cambio de escala.
- 📄 Derivada: $\mathcal{L}[f'(t)]=sF(s)-f(0)$. **Solo la primera.**
- 📄 Integral: $\mathcal{L}\left[\int_0^tf(u)\,du\right]=\frac{F(s)}{s}$.
- 📄 Multiplicación por $t^n$: $\mathcal{L}[t^nf(t)]=(-1)^nF^{(n)}(s)$.
- 📄 División por $t$: $\mathcal{L}\left[\frac{f(t)}{t}\right]=\int_s^\infty F(u)\,du$, "siempre que exista $\lim_{t\to0}\frac{f(t)}{t}$".
- 📄 Teoremas del valor inicial y final.
- 📄 Convolución: $\mathcal{L}^{-1}[F(s)\cdot G(s)]=\int_0^tf(u)\,g(t-u)\,du$.
- 📄 Tabla: $1\to\frac1s$, $t\to\frac1{s^2}$, $t^n\to\frac{n!}{s^{n+1}}$, $e^{at}\to\frac{1}{s-a}$, $\operatorname{sen}(at)\to\frac{a}{s^2+a^2}$, $\cos(at)\to\frac{s}{s^2+a^2}$, $\delta(t)\to1$.
- 📄 En "otras fórmulas útiles" (pág. 3): Euler $e^{jx}=\cos x+j\operatorname{sen}x$ y el binomio de Newton.
- 📄 En la **tabla de integrales**: primitivas ($\int\frac{du}{u^2+1}=\operatorname{arctg}u$, $\int e^{au}\operatorname{sen}(bu)\,du$, $\int e^{au}\cos(bu)\,du$) e identidades trigonométricas.

**No está: va de memoria.**

- 🧠 **Derivada segunda:** $\mathcal{L}[f''(t)]=s^2F(s)-s\,f(0)-f'(0)$.
- 🧠 **Seno y coseno con exponenciales** (salen de Euler, pero conviene tenerlas listas): $\operatorname{sen}x=\frac{e^{jx}-e^{-jx}}{2j}$, $\cos x=\frac{e^{jx}+e^{-jx}}{2}$.
- 🧠 **Producto → suma** (si tu tabla de integrales no las trae): $\operatorname{sen}A\operatorname{sen}B=\frac12[\cos(A-B)-\cos(A+B)]$ · $\cos A\cos B=\frac12[\cos(A-B)+\cos(A+B)]$ · $\operatorname{sen}A\cos B=\frac12[\operatorname{sen}(A+B)+\operatorname{sen}(A-B)]$.
- 🧠 **Derivada de un cociente:** $\left(\frac ND\right)'=\frac{N'D-ND'}{D^2}$.
- 🧠 **L'Hôpital** y logaritmos: $\ln a-\ln b=\ln\frac ab$, $\ln1=0$. Arcotangentes: $\operatorname{arctg}0=0$, $\operatorname{arctg}1=\frac\pi4$, $\operatorname{arctg}\sqrt3=\frac\pi3$, $\operatorname{arctg}u\to\frac\pi2$ si $u\to\infty$.
- 🧠 **Completar cuadrados:** $s^2+bs+c=\left(s+\frac b2\right)^2+\left(c-\frac{b^2}{4}\right)$.
- 🧠 **Fracciones simples:** los casos, el "tapado" y Ruffini (§9).
- 🧠 $a^t=e^{t\ln a}$ (§3) y la **receta de cada tipo de ítem** (esta guía).

> **En clase:** se puede llevar la "hoja de ayuda para el primer parcial" **sola**, sin apuntes propios (repaso [02:40]), más "tabla de integrales, derivadas e […] identidades trigonométricas […] con esto ya deberían andar" (repaso [03:11]).
>
> **En clase:** "las que traje son las que vamos a usar […] tanto la tablita esta […] y las propiedades están en los resúmenes que después ustedes van a poder utilizar en el parcial" (teórica [15:24]).

## 3. Transformar con la tabla, linealidad y 1ª traslación (y la "demostración" de $a^t$)

### 3.1 Receta

1. **Linealidad:** separá las sumas y sacá las constantes afuera.
2. Cada pedazo, a la **tabla**. Leé quién es $a$ o $n$ en tu función.
3. Si un pedazo está multiplicado por $e^{at}$: transformalo **sin** la exponencial y después cambiá **toda** $s$ por $s-a$ (1ª traslación).
4. Dejá el resultado separado en fracciones: no hace falta denominador común.

> **En clase:** "¿sacar un denominador común o algo así? No, esto no hace falta, es mejor dejarlo así separado, que es claro de dónde viene cada cosa" (teórica [23:49]).

### Ejemplo guiado 1: $\mathcal{L}[4t^2-3\cos(2t)+5e^{-t}]$ (teórico y PDF de propiedades)

**Paso 1 — linealidad:** $4\,\mathcal{L}[t^2]-3\,\mathcal{L}[\cos(2t)]+5\,\mathcal{L}[e^{-t}]$.

**Paso 2 — tabla** ($t^2\to\frac{2!}{s^3}$; coseno con $a=2$; exponencial con $a=-1$):

$$
F(s)=4\cdot\frac{2}{s^3}-3\cdot\frac{s}{s^2+4}+5\cdot\frac{1}{s+1}=\frac{8}{s^3}-\frac{3s}{s^2+4}+\frac{5}{s+1}
$$

### Ejemplo guiado 2: $\mathcal{L}[e^{-t}\cos(2t)]$ (teórico)

**Paso 1 — sin la exponencial:** $\mathcal{L}[\cos(2t)]=\dfrac{s}{s^2+4}$.

**Paso 2 — 1ª traslación con $a=-1$:** cada $s$ pasa a ser $s-(-1)=s+1$, **también la del numerador**:

$$
\mathcal{L}[e^{-t}\cos(2t)]=\frac{s+1}{(s+1)^2+4}
$$

### 3.2 La transformada de $a^t$ (el ítem de "demostrar")

La tabla solo tiene exponenciales de base $e$. Cualquier otra base se pasa a base $e$ aplicando logaritmo y volviendo a exponenciar (así lo hace el profesor en el OneNote, guía ej. 3d):

$$
a^t=e^{\ln(a^t)}=e^{t\ln a}\qquad(a>0)
$$

Y eso ya es una fila de la tabla, $e^{ct}\to\frac{1}{s-c}$, con el número $c=\ln a$:

$$
\mathcal{L}[a^t]=\mathcal{L}\left[e^{t\ln a}\right]=\frac{1}{s-\ln a}
$$

**Qué hay que dejar escrito** (resolución oficial 2025, Tema 1 c): los dos renglones. (1) $2^t=e^{\ln 2^t}=e^{t\ln2}$; (2) "por tabla, $\mathcal{L}[e^{at}]=\frac{1}{s-a}$ con $a=\ln2$".

## 4. Integral impropia = transformada evaluada. Multiplicación por $t^n$ (3/16; ítem a de 2025 Tema 1)

### 4.1 La idea

Compará lo que te dan con la definición:

$$
\int_0^\infty f(t)\,e^{-kt}\,dt=F(k)
$$

La integral es **la transformada de $f$ evaluada en $s=k$**. $f(t)$ es *todo lo que no es la exponencial*; el número que acompaña a $-t$ en el exponente es dónde se evalúa. Si no hay exponencial, es $e^{-0\cdot t}$ y se evalúa en $s=0$.

![A la izquierda t² y la exponencial por separado; a la derecha el producto, cuya área es F(2) = 1/4](../img/02-fig1-integral-impropia-es-F-evaluada.png)

Como en estos ítems $f(t)$ trae una $t$ (o $t^2$) multiplicando, hace falta la propiedad de **multiplicación por $t^n$**:

$$
\mathcal{L}[t^n f(t)]=(-1)^n\,F^{(n)}(s)
$$

En criollo: **derivo $n$ veces la transformada de $f$ y cambio el signo $n$ veces**.

> **En clase:** "derivo una vez, cambio el signo una vez; si fuera $t$ al cuadrado, derivo dos veces, cambio el signo dos veces" (repaso [1:13:30]). "Cambiar de signo un número par de veces es lo mismo que nada" (repaso [1:16:06]).

### 4.2 Receta

1. Separá la exponencial $e^{-kt}$: te da $s=k$. Lo que queda es $f(t)$.
2. Escribí: "la integral es $\mathcal{L}[f(t)]$ evaluada en $s=k$".
3. Calculá $F(s)$ **genérica**: tabla para la parte sin $t$, después derivar y cambiar el signo.
4. **Recién al final** reemplazá $s=k$.

**Cuándo falla:** si reemplazás $s$ por el número antes de derivar, derivás una constante y da $0$. Y la exponencial de la integral **no** es una 1ª traslación: es el $e^{-st}$ de la definición.

**Qué hay que dejar escrito** (resolución oficial 2025, Tema 1 a): (1) "$\int_0^\infty t\,e^{-st}\cos t\,dt=\mathcal{L}\{t\cos t\}(s)$ con $s=5$"; (2) el nombre de la propiedad y la derivada hecha; (3) $F(s)$ genérica; (4) el valor en $s=5$. La oficial deja $\frac{24}{676}$ sin simplificar.

### Ejemplo guiado 3: $\int_0^\infty t^2e^{-2t}\,dt$ (guía ej. 13c, OneNote, aplicaciones [58:44])

**Paso 1.** $e^{-2t}\Rightarrow s=2$; $f(t)=t^2$.

**Paso 2.** Tabla: $F(s)=\mathcal{L}[t^2]=\dfrac{2}{s^3}$.

**Paso 3.** Evalúo:

$$
\int_0^\infty t^2e^{-2t}\,dt=F(2)=\frac{2}{8}=\frac14
$$

Sin integrar por partes dos veces.

### Ejemplo guiado 4: $\int_0^\infty t\,e^{-2t}\cos t\,dt$ (teórico)

**Paso 1.** $e^{-2t}\Rightarrow s=2$; $f(t)=t\cos t$: hay una $t$ multiplicando ⇒ multiplicación por $t$ con $n=1$.

**Paso 2 — tabla, sin la $t$:** $\mathcal{L}[\cos t]=\dfrac{s}{s^2+1}$.

**Paso 3 — derivo** (regla del cociente: $N=s$, $D=s^2+1$):

$$
\frac{d}{ds}\left(\frac{s}{s^2+1}\right)=\frac{1\cdot(s^2+1)-s\cdot2s}{(s^2+1)^2}=\frac{1-s^2}{(s^2+1)^2}
$$

**Paso 4 — cambio el signo una vez:**

$$
\mathcal{L}[t\cos t]=\frac{s^2-1}{(s^2+1)^2}
$$

**Paso 5 — evalúo en $s=2$:**

$$
\int_0^\infty t\,e^{-2t}\cos t\,dt=\frac{4-1}{(4+1)^2}=\frac{3}{25}
$$

> **Guardate este resultado:** $\mathcal{L}[t\cos t]=\dfrac{s^2-1}{(s^2+1)^2}$ aparece en el parcial 2025 Tema 1 (ítem a) y adentro del recuperatorio 2025 (ítem b).

### Ejemplo guiado 5: $\int_0^\infty t^2e^{-5t}\operatorname{sen}t\,dt$ (ejemplos de clase "evaluación de integrales", ejemplo 1)

**Paso 1.** $s=5$; $f(t)=t^2\operatorname{sen}t$ ⇒ $n=2$: derivo dos veces y el signo no cambia.

**Paso 2.** $\mathcal{L}[\operatorname{sen}t]=\dfrac{1}{s^2+1}$.

**Paso 3 — primera derivada:**

$$
\left(\frac{1}{s^2+1}\right)'=\frac{-2s}{(s^2+1)^2}
$$

**Paso 4 — segunda derivada** (cociente, y simplifico un factor $s^2+1$):

$$
\left(\frac{-2s}{(s^2+1)^2}\right)'=\frac{-2(s^2+1)^2+2s\cdot2(s^2+1)\cdot2s}{(s^2+1)^4}=\frac{-2(s^2+1)+8s^2}{(s^2+1)^3}=\frac{6s^2-2}{(s^2+1)^3}
$$

**Paso 5.** $(-1)^2=1$, así que $F(s)=\dfrac{6s^2-2}{(s^2+1)^3}$. En $s=5$:

$$
F(5)=\frac{150-2}{26^3}=\frac{148}{17576}=\frac{37}{4394}\approx0{,}00842
$$

## 5. División por $t$: las integrales con $/t$ (5/16; ítem a del recuperatorio 2025)

### 5.1 La idea

Del ayudamemoria:

$$
\mathcal{L}\left[\frac{f(t)}{t}\right]=\int_s^\infty F(u)\,du\qquad\text{siempre que exista }\lim_{t\to0}\frac{f(t)}{t}
$$

$F$ es la transformada del **numerador**, escrita con la letra $u$. Las primitivas que aparecen son siempre directas: logaritmos o arcotangentes.

> **En clase:** "esta propiedad es importante, aparece en varios ejercicios y es siempre muy parecida" (teórica [46:37]). "Es una propiedad que en este tipo de ejercicios se toma bastante, o será por el seno de $t$ sobre $t$ o exponenciales sobre $t$" (aplicaciones [1:04:00]). "Es un ejercicio bastante típico, clásico, así que ténganlo en cuenta" (repaso [1:14:33]).

### 5.2 Receta

1. Si hay **dos exponenciales** sobre $t$, sacá factor común la de **menor** exponente: queda $e^{-kt}\cdot\dfrac{1-e^{-mt}}{t}$. La $e^{-kt}$ dice dónde evaluar ($s=k$). Si no hay exponencial suelta, $s=0$.
2. **Verificá el límite** $\lim_{t\to0}\dfrac{f(t)}{t}$ (da $\frac00$: L'Hôpital) y **escribilo**.
3. Transformá el numerador, pasalo a $u$ e integrá de $s$ a $\infty$.
4. Si en $\infty$ queda $\infty-\infty$ con logaritmos, **juntalos en uno solo**: el cociente tiende a $1$ y $\ln1=0$.
5. Evaluá en $s=k$.

**Cuándo falla:** si separás $\frac{e^{-3t}-e^{-6t}}{t}$ en dos integrales con $\frac{e^{-3t}}{t}$ y $\frac{e^{-6t}}{t}$, cada una sería "la transformada de $\frac1t$", y $\lim_{t\to0}\frac1t$ no existe: la propiedad no se puede usar.

**Qué hay que dejar escrito** (resolución oficial del recuperatorio 2025, ítem a): el factor común, **el límite verificado con L'Hôpital antes de aplicar la propiedad**, la integral en $u$, el paso de juntar logaritmos y la evaluación final.

> **En clase:** "ustedes pueden llegar a tener el impulso de dividir […] esta integral en dos integrales diferentes" (aplicaciones [1:10:15]): por ahí no se llega a nada, porque no existe el límite de $\frac1t$.
>
> **En clase:** "me termina quedando […] un infinito menos infinito, que obviamente es una indeterminación. Pero en este caso se salva muy fácil […] la resta de dos logaritmos es igual al logaritmo de la división" (aplicaciones [1:13:58]).
>
> **En clase:** "este es un ejercicio que se toma bastante. Si no se toma con 3 y 6, lo he visto con 4 y con 8 […] capaz no da logaritmo de 2 y da logaritmo de 3, pero que los pasos son los mismos […] es un ejercicio tomable" (aplicaciones [1:16:04]).

### Ejemplo guiado 6: $\int_0^\infty\dfrac{e^{-2t}-e^{-8t}}{t}\,dt$ (ejemplos de clase, y ejercicio c del teórico)

**Paso 1 — factor común $e^{-2t}$:**

$$
\int_0^\infty e^{-2t}\,\frac{1-e^{-6t}}{t}\,dt=\mathcal{L}\left[\frac{1-e^{-6t}}{t}\right]\Bigg|_{s=2}
$$

**Paso 2 — el límite** ($\frac00$, derivo arriba y abajo):

$$
\lim_{t\to0}\frac{1-e^{-6t}}{t}=\lim_{t\to0}\frac{6e^{-6t}}{1}=6\quad\text{(existe ⇒ puedo usar la propiedad)}
$$

**Paso 3 — división por $t$** ($\mathcal{L}[1]=\frac1s$, $\mathcal{L}[e^{-6t}]=\frac{1}{s+6}$, en $u$):

$$
\mathcal{L}\left[\frac{1-e^{-6t}}{t}\right]=\int_s^\infty\left(\frac1u-\frac{1}{u+6}\right)du=\Big[\ln u-\ln(u+6)\Big]_s^\infty
$$

**Paso 4 — juntar logaritmos** ($\frac{u}{u+6}\to1$ cuando $u\to\infty$):

$$
\left[\ln\frac{u}{u+6}\right]_s^\infty=\ln1-\ln\frac{s}{s+6}=\ln\frac{s+6}{s}
$$

**Paso 5 — evaluar en $s=2$:**

$$
\int_0^\infty\frac{e^{-2t}-e^{-8t}}{t}\,dt=\ln\frac{8}{2}=\ln4
$$

**Atajo para controlar (agregado mío):** con esta receta, $\int_0^\infty\frac{e^{-at}-e^{-bt}}{t}dt$ siempre da $\ln\frac ba$. En el examen hay que hacer los pasos igual.

### Ejemplo guiado 7: $\int_{-\infty}^{\infty}\dfrac{\operatorname{sen}t}{t}\,dt$ (ejemplos de clase, ejemplo 2; aplicaciones [1:00:18])

**Paso 1 — paridad.** $\frac{\operatorname{sen}t}{t}$ es par (impar sobre impar), así que la integral en toda la recta es el doble de la de $0$ a $\infty$.

**Paso 2.** $\int_0^\infty\frac{\operatorname{sen}t}{t}\,e^{-0t}dt$: no hay exponencial ⇒ $s=0$. El límite: $\lim_{t\to0}\frac{\operatorname{sen}t}{t}=1$, existe.

**Paso 3 — división por $t$** ($\mathcal{L}[\operatorname{sen}t]=\frac{1}{s^2+1}$):

$$
\mathcal{L}\left[\frac{\operatorname{sen}t}{t}\right]=\int_s^\infty\frac{du}{u^2+1}=\Big[\operatorname{arctg}u\Big]_s^\infty=\frac\pi2-\operatorname{arctg}s
$$

**Paso 4.** $F(0)=\frac\pi2-0=\frac\pi2$. Entonces:

$$
\int_0^\infty\frac{\operatorname{sen}t}{t}\,dt=\frac\pi2\qquad\Longrightarrow\qquad\int_{-\infty}^{\infty}\frac{\operatorname{sen}t}{t}\,dt=\pi
$$

$$

## 6. Potencias y productos de senos y cosenos (2/16 + repaso; ítem a de 2025 Tema 2)

### 6.1 La idea y la receta

La tabla no tiene $\cos^3t$ ni $\operatorname{sen}(5t)\cos(2t)$. Hay que **convertir el producto en una suma** de senos y cosenos simples. La cátedra lo hace con exponenciales complejas:

$$
\operatorname{sen}x=\frac{e^{jx}-e^{-jx}}{2j}\qquad\qquad\cos x=\frac{e^{jx}+e^{-jx}}{2}
$$

1. Reemplazá cada seno/coseno por su forma exponencial.
2. Desarrollá: binomio $1\ 3\ 3\ 1$ para un cubo (signos alternados si es una resta); distributiva para un producto. Sumá exponentes: $e^{2jt}e^{-jt}=e^{jt}$.
3. Reagrupá en parejas $e^{jkt}$, $e^{-jkt}$ y rearmá $\cos(kt)$ o $\operatorname{sen}(kt)$, multiplicando y dividiendo por lo que falte.
4. Tabla y linealidad.

Alternativa igual de válida (el profesor la anota en el OneNote): las identidades producto → suma de la tabla de integrales.

**Qué hay que dejar escrito** (resolución oficial 2025, Tema 2 a): la forma exponencial elevada al cubo, el binomio desarrollado, el reagrupamiento que muestra la función como suma ($\operatorname{sen}^3t=-\frac14\operatorname{sen}3t+\frac34\operatorname{sen}t$) y la transformada.

### Ejemplo guiado 8: $\mathcal{L}[\operatorname{sen}(5t)\cos(2t)]$ (guía ej. 3f, OneNote)

**Paso 1 — exponenciales:**

$$
\operatorname{sen}(5t)\cos(2t)=\frac{e^{5jt}-e^{-5jt}}{2j}\cdot\frac{e^{2jt}+e^{-2jt}}{2}
$$

**Paso 2 — distributiva** ($2j\cdot2=4j$; exponentes $5+2$, $5-2$, $-5+2$, $-5-2$):

$$
=\frac{1}{4j}\left(e^{7jt}+e^{3jt}-e^{-3jt}-e^{-7jt}\right)
$$

**Paso 3 — reagrupar** ($\frac{1}{4j}=\frac12\cdot\frac{1}{2j}$; cada pareja arma un seno):

$$
=\frac12\cdot\frac{e^{7jt}-e^{-7jt}}{2j}+\frac12\cdot\frac{e^{3jt}-e^{-3jt}}{2j}=\frac12\operatorname{sen}(7t)+\frac12\operatorname{sen}(3t)
$$

**Paso 4 — tabla:**

$$
F(s)=\frac12\cdot\frac{7}{s^2+49}+\frac12\cdot\frac{3}{s^2+9}
$$

(La guía lo da junto: $\frac{5s^2+105}{(s^2+49)(s^2+9)}$. Es lo mismo.)

## 7. Transformar una integral de convolución (ítem b del recuperatorio 2025)

### 7.1 La idea y la receta

El teorema de convolución (o de Borel), leído hacia la transformada:

$$
\mathcal{L}\left[\int_0^tf(u)\,g(t-u)\,du\right]=F(s)\cdot G(s)
$$

La transformada de esa integral rara es simplemente el **producto** de dos transformadas.

1. Mirá adentro de la integral: lo que depende **solo de $u$** es $f(u)$; lo que depende de **$t-u$** es $g(t-u)$.
2. Transformá cada una por separado, pensando $u$ y $t-u$ **como si fueran $t$**. Si $f(u)$ trae una $u$ multiplicando, es multiplicación por $t$ (§4).
3. Multiplicá y simplificá.

**Qué hay que dejar escrito** (resolución oficial del recuperatorio 2025, ítem b): el teorema, quién es $f(u)$ y quién $g(t-u)$, cómo sale cada transformada y el producto simplificado.

### Ejemplo guiado 9: $\mathcal{L}\left[\int_0^te^{u}\,e^{2(t-u)}\,du\right]$ (teórico; aplicaciones [29:02])

**Paso 1.** $f(u)=e^{u}$ (solo $u$) y $g(t-u)=e^{2(t-u)}$.

**Paso 2.** Pensadas como $e^{t}$ y $e^{2t}$: tabla con $a=1$ y $a=2$.

**Paso 3.**

$$
\mathcal{L}\left[\int_0^te^{u}\,e^{2(t-u)}\,du\right]=\frac{1}{s-1}\cdot\frac{1}{s-2}
$$

## 8. Antitransformar I: tabla, ajustar constantes y completar cuadrados

Sola no se toma, pero es el último paso de §9, §11 y §12.

> **En clase:** una antitransformada directa "no sé si es un ejercicio de examen […] nunca hacemos solo eso" (teórica [1:41:03]). "Las antitransformadas son […] un poquito más artesanales, hay como que ver a qué se parece la función" (teórica [1:40:33]).

### 8.1 Receta

1. Buscá a qué fila de la tabla **se parece**. Con denominador $s^2+a^2$: si arriba hay $s$ viene de un coseno; si hay una constante, de un seno (teórica [1:30:52]).
2. Si falta una constante, **multiplicá y dividí** por ella.
3. Si el denominador es un cuadrático sin raíces reales, **completá el cuadrado**: $(s-\alpha)^2+\beta^2$.
4. Si arriba hay $s$, **partí el numerador** para que aparezca el mismo $(s-\alpha)$ de abajo.
5. **1ª traslación al revés:** lo que está en función de $(s-\alpha)$ sale multiplicado por $e^{\alpha t}$.

$$
\mathcal{L}^{-1}\left[\frac{s-\alpha}{(s-\alpha)^2+\beta^2}\right]=e^{\alpha t}\cos(\beta t)\qquad\qquad\mathcal{L}^{-1}\left[\frac{\beta}{(s-\alpha)^2+\beta^2}\right]=e^{\alpha t}\operatorname{sen}(\beta t)
$$

> **En clase:** "hago aparecer lo que quiero hacer aparecer […] y así como lo hago aparecer lo tengo que compensar: multiplico y divido por 2" (teórica [1:35:15]). "Practiquen si no se acuerdan cómo completar el cuadrado, porque lo vamos a usar bastante" (teórica [1:37:29]).

### Ejemplo guiado 10: $\mathcal{L}^{-1}\left[\dfrac{1}{s^2-2s+5}\right]$ (teórico y PDF de propiedades; teórica [1:36:58])

**Paso 1 — completar el cuadrado** (mitad de $-2$ es $-1$; $5-1=4$): $s^2-2s+5=(s-1)^2+4$.

**Paso 2 — ajustar la constante.** Se parece a $\operatorname{sen}(2t)\to\frac{2}{s^2+4}$; falta un $2$ arriba:

$$
\frac{1}{(s-1)^2+4}=\frac12\cdot\frac{2}{(s-1)^2+4}
$$

**Paso 3 — traslación al revés** ($s-1\Rightarrow e^{t}$):

$$
\mathcal{L}^{-1}\left[\frac{1}{s^2-2s+5}\right]=\frac12\,e^{t}\operatorname{sen}(2t)
$$

### Ejemplo guiado 11: $\mathcal{L}^{-1}\left[\dfrac{s-1}{s^2+2s+2}\right]$ (guía ej. 5g, OneNote)

**Paso 1.** $s^2+2s+2=(s+1)^2+1$.

**Paso 2 — partir el numerador** para que aparezca $s+1$: $s-1=(s+1)-2$.

$$
\frac{s-1}{(s+1)^2+1}=\frac{s+1}{(s+1)^2+1}-\frac{2}{(s+1)^2+1}
$$

**Paso 3 — tabla + traslación** ($\beta=1$; $s+1\Rightarrow e^{-t}$):

$$
y(t)=e^{-t}\cos t-2e^{-t}\operatorname{sen}t
$$

## 9. Antitransformar II: fracciones simples

Cuando $F(s)$ es un cociente de polinomios que no se parece a nada de la tabla, se lo parte en **fracciones simples**, cada una antitransformable.

> **En clase:** "sepan cómo se resuelve, porque sí o sí va a haber […] alguna fracción simple en alguno de los ejercicios" (repaso [1:04:04]): en Laplace, en sistemas estables "siempre aparece", o en transformada Z. "Raíces complejas múltiples ya sería una banda […] eso no lo voy a tomar" (repaso [1:04:36]).
>
> **En clase:** "vamos a usar muchísimo, muchísimo el método de fracciones simples" (teórica [1:52:47]); "en el 99% de los casos voy a tener que usar fracciones simples" (aplicaciones [53:00]).

### 9.1 Los casos (PDF "Método de fracciones simples")

| Raíces del denominador | Qué fracción se propone | Antitransformada de cada una |
|---|---|---|
| Real simple $p$ | $\dfrac{A}{s-p}$ | $Ae^{pt}$ |
| Real doble $p$ | $\dfrac{A}{(s-p)^2}+\dfrac{B}{s-p}$ | $Ate^{pt}+Be^{pt}$ |
| Real triple $p$ | $\dfrac{A}{(s-p)^3}+\dfrac{B}{(s-p)^2}+\dfrac{C}{s-p}$ | $\dfrac A2t^2e^{pt}+Bte^{pt}+Ce^{pt}$ |
| Complejas conjugadas simples (cuadrático con $b^2-4ac<0$) | $\dfrac{Bs+C}{s^2+bs+c}$: **dos incógnitas arriba** | completar cuadrado ⇒ $e^{\alpha t}\cos(\beta t)$ y $e^{\alpha t}\operatorname{sen}(\beta t)$ (§8) |
| Complejas conjugadas múltiples | $\dfrac{As+B}{(\dots)^2}+\dfrac{Cs+D}{(\dots)}$ | no se toma: $\frac{1}{(s^2+1)^2}$ va por convolución (§10) |

### 9.2 Receta

0. **Grados.** Hace falta grado del numerador < grado del denominador. Si no, primero se divide: $\frac PQ=C+\frac RQ$ (caso raro; ver 9.D).
1. **Factorizá el denominador** (resolvente con calculadora; Ruffini si es cúbico) y **sacá afuera el coeficiente principal**: $2s^2+7s+3=2(s+3)\left(s+\frac12\right)$.
2. **Proponé** las fracciones según la tabla de 9.1.
3. **Tapado** ("el truquito"): para cada raíz real simple, y para la **mayor potencia** de una raíz repetida, tapá ese factor en la $F(s)$ original y evaluá lo que queda en la raíz. Ese número es el coeficiente.
4. **Lo que falte** (la $B$ de una doble, el $Bs+C$ de un cuadrático): sumá las fracciones, igualá el numerador al original y **compará coeficientes**, eligiendo los grados que despejan fácil (el mayor y el independiente suelen alcanzar).
5. **Antitransformá** cada fracción.

**Qué hay que dejar escrito** (resoluciones oficiales 2025 del Ej3, donde se usa): la propuesta de fracciones, el valor de tapado anotado sobre cada constante, las igualdades de coeficientes ("cuadráticos", "lineales", "independientes"), el cuadrado completado con el numerador partido y la $y(t)$.

> **En clase:** el coeficiente principal "hay que sacarla para afuera" (aplicaciones [10:36]); si no, las fracciones simples dan mal.
>
> **En clase:** "sacarme de encima todas las incógnitas que pueda antes de arrancar con el sistema" (aplicaciones [49:13]): con el tapado, lo que parecía un sistema de 3×3 queda en dos ecuaciones sueltas.
>
> **En clase:** con raíces complejas conjugadas "en el numerador hay […] dos incógnitas" (teórica [1:49:02]). Las raíces de una cuadrática que aparece "en el medio de un ejercicio de fracciones simples" se pueden sacar con la calculadora (repaso [14:50]).

### Ejemplo guiado 12 — raíces reales simples: $F(s)=\dfrac{s+7}{s^2-6s+5}$ (guía ej. 6a, OneNote)

**Paso 1 — factorizar.** Raíces $5$ y $1$: $s^2-6s+5=(s-5)(s-1)$.

**Paso 2 — proponer:** $\dfrac{s+7}{(s-5)(s-1)}=\dfrac{A}{s-5}+\dfrac{B}{s-1}$.

**Paso 3 — tapado.** Para $A$ tapo $(s-5)$ y evalúo el resto en $s=5$; para $B$ tapo $(s-1)$ y evalúo en $s=1$:

$$
A=\frac{5+7}{5-1}=\frac{12}{4}=3\qquad\qquad B=\frac{1+7}{1-5}=\frac{8}{-4}=-2
$$

**Paso 4 — antitransformar:**

$$
f(t)=3e^{5t}-2e^{t}
$$

(El profesor también lo resuelve con el sistema $A+B=1$, $-A-5B=7$ y anota "se puede resolver más fácil": el tapado.)

### Ejemplo guiado 13 — raíz doble: $F(s)=\dfrac{1}{(s+2)^2(s+1)}$ (guía ej. 6c, OneNote)

**Paso 1 — proponer:**

$$
F(s)=\frac{A}{(s+2)^2}+\frac{B}{s+2}+\frac{C}{s+1}
$$

**Paso 2 — tapado** para $A$ (tapo $(s+2)^2$, evalúo en $-2$) y para $C$ (tapo $(s+1)$, evalúo en $-1$):

$$
A=\frac{1}{-2+1}=-1\qquad\qquad C=\frac{1}{(-1+2)^2}=1
$$

**Paso 3 — $B$ comparando coeficientes.** Numerador común: $-1(s+1)+B(s+1)(s+2)+1(s+2)^2=1$. Miro solo los términos en $s^2$: $B+1=0\Rightarrow B=-1$.

**Paso 4 — antitransformar** ($\frac{1}{(s+2)^2}$ es $\frac{1}{s^2}$ trasladada: $te^{-2t}$):

$$
f(t)=-te^{-2t}-e^{-2t}+e^{-t}
$$

### Ejemplo guiado 14 — raíces complejas: $F(s)=\dfrac{7s^2-41s+84}{(s-1)(s^2-4s+13)}$ (guía ej. 6h, OneNote)

**Paso 1 — el cuadrático.** $b^2-4ac=16-52<0$: complejas, lleva $Bs+C$.

$$
F(s)=\frac{A}{s-1}+\frac{Bs+C}{s^2-4s+13}
$$

**Paso 2 — tapado para $A$** (evalúo en $s=1$): $A=\dfrac{7-41+84}{1-4+13}=\dfrac{50}{10}=5$.

**Paso 3 — comparar coeficientes:**

$$
5(s^2-4s+13)+(Bs+C)(s-1)=7s^2-41s+84
$$

Cuadráticos: $5+B=7\Rightarrow B=2$. Independientes: $65-C=84\Rightarrow C=-19$. (Control con los lineales: $-20-B+C=-20-2-19=-41$ ✓.)

**Paso 4 — completar el cuadrado y partir el numerador.** $s^2-4s+13=(s-2)^2+9$; $2s-19=2(s-2)+4-19=2(s-2)-15$:

$$
F(s)=\frac{5}{s-1}+\frac{2(s-2)}{(s-2)^2+9}-\frac{15}{(s-2)^2+9}
$$

**Paso 5 — antitransformar** ($\beta=3$ y $15=5\cdot3$; $s-2\Rightarrow e^{2t}$):

$$
f(t)=5e^{t}+2e^{2t}\cos(3t)-5e^{2t}\operatorname{sen}(3t)
$$

### 9.3 El atajo del teórico: acomodar antes de plantear

El teórico avisa que "muchas veces la descomposición en fracciones simples puede hacerse mediante algún paso algebraico sin necesidad de plantear un sistema". Su ejemplo:

$$
Y(s)=\frac{2s^2-4s+5}{s^2(s^2-4s+5)}=\frac{s^2+(s^2-4s+5)}{s^2(s^2-4s+5)}=\frac{1}{s^2-4s+5}+\frac{1}{s^2}
$$

y como $s^2-4s+5=(s-2)^2+1$: $y(t)=e^{2t}\operatorname{sen}t+t$. En la misma línea, el profesor insiste en **factorizar y cancelar antes** de las fracciones simples (aplicaciones [55:05]); lo vas a ver en el Ejemplo guiado 19.

## 10. Antitransformar III: por convolución (3/16 + repaso; ítem b de las dos hojas del parcial 2025)

### 10.1 La idea

El mismo teorema de §7, leído al revés:

$$
\mathcal{L}^{-1}[F(s)\cdot G(s)]=\int_0^tf(u)\,g(t-u)\,du
$$

Se usa cuando la consigna dice "utilizando convolución" o cuando el denominador tiene **complejas dobles**, como $(s^2+1)^2$, que por fracciones simples no se toman.

> **En clase:** para antitransformar "me parece a mí más fácil trabajar con fracciones simples […] aunque también valga usar convolución, porque […] ahora voy a tener que resolver esa integral" (aplicaciones [33:56]). Conclusión práctica: convolución **solo** si la piden o si hay complejas dobles.

### 10.2 Receta

1. **Partí** $Y(s)$ en dos factores que estén en la tabla. Las constantes se reparten como convenga.
2. **Antitransformá** cada uno: $f(t)$ y $g(t)$.
3. **Armá la integral:** a una le ponés $u$ y a la otra $t-u$. Si hay una exponencial, **dale el $t-u$ a la exponencial**: $e^{a(t-u)}=e^{at}e^{-au}$ y el $e^{at}$ sale afuera de la integral.
4. **Integrá en $u$** ($t$ es constante ahí adentro). Seno/coseno por seno/coseno: primero producto → suma. Exponencial por seno/coseno: primitiva de la tabla de integrales.
5. **Barrow** entre $0$ y $t$, usando $\operatorname{sen}(-t)=-\operatorname{sen}t$ y $\cos(-t)=\cos t$.

Las dos identidades que resuelven los ítems de examen, con $A=u$ y $B=t-u$ (entonces $A-B=2u-t$ y $A+B=t$):

$$
\operatorname{sen}u\,\operatorname{sen}(t-u)=\frac12\big[\cos(2u-t)-\cos t\big]\qquad\qquad\cos u\,\cos(t-u)=\frac12\big[\cos(2u-t)+\cos t\big]
$$

**Qué hay que dejar escrito** (resoluciones oficiales 2025, T1 b y T2 b): $F$ y $G$ con sus antitransformadas, la integral de convolución armada, la identidad producto → suma aplicada, la primitiva con Barrow y el paso $\operatorname{sen}t-\operatorname{sen}(-t)=2\operatorname{sen}t$.

> **En clase:** "tienen que tener el criterio […] a qué función yo le voy a dar el $t-u$, porque eso me puede ayudar o complicar con la dificultad de la integral" (aplicaciones [37:05]). En el OneNote lo anota así: "más fácil que el $(t-u)$ sea para la exponencial".

### Ejemplo guiado 15: $Y(s)=\dfrac{2s}{(s-3)(s^2+1)}$ por convolución (teórico y ejemplos de clase "Teorema de convolución")

**Paso 1 — partir:**

$$
F(s)=\frac{s}{s^2+1}\Rightarrow f(t)=\cos t\qquad\qquad G(s)=\frac{2}{s-3}\Rightarrow g(t)=2e^{3t}
$$

**Paso 2 — armar**, con el $t-u$ para la exponencial, y sacar $e^{3t}$ afuera:

$$
y(t)=\int_0^t\cos(u)\cdot2e^{3(t-u)}\,du=2e^{3t}\int_0^t\cos(u)\,e^{-3u}\,du
$$

**Paso 3 — primitiva de tabla** ($\int e^{au}\cos(bu)\,du=\frac{e^{au}}{a^2+b^2}\left(a\cos bu+b\operatorname{sen}bu\right)$ con $a=-3$, $b=1$):

$$
y(t)=2e^{3t}\cdot\frac{1}{10}\Big[e^{-3u}\big(-3\cos u+\operatorname{sen}u\big)\Big]_0^t=2e^{3t}\cdot\frac{1}{10}\Big[e^{-3t}\big(-3\cos t+\operatorname{sen}t\big)+3\Big]
$$

**Paso 4 — distributiva** ($e^{3t}e^{-3t}=1$):

$$
y(t)=-\frac35\cos t+\frac15\operatorname{sen}t+\frac35e^{3t}
$$

**Control por fracciones simples** (el teórico lo hace para mostrar que coincide): $\dfrac{A}{s-3}+\dfrac{Bs+C}{s^2+1}$ con tapado $A=\dfrac{6}{10}=\dfrac35$; cuadráticos $A+B=0\Rightarrow B=-\dfrac35$; independientes $A-3C=0\Rightarrow C=\dfrac15$. Da lo mismo ✓.

### Ejemplo guiado 16: $Y(s)=\dfrac{1}{(s^2+1)^2}$ (repaso 2026 ejercicio D, guía ej. 11b, OneNote)

**Paso 1 — partir:** $F(s)=G(s)=\dfrac{1}{s^2+1}\Rightarrow f(t)=g(t)=\operatorname{sen}t$.

**Paso 2 — convolución e identidad:**

$$
y(t)=\int_0^t\operatorname{sen}(u)\operatorname{sen}(t-u)\,du=\frac12\int_0^t\big[\cos(2u-t)-\cos t\big]\,du
$$

**Paso 3 — integrar en $u$.** $\cos t$ es constante respecto de $u$ (su integral es $u\cos t$); la primitiva de $\cos(2u-t)$ es $\frac{\operatorname{sen}(2u-t)}{2}$:

$$
y(t)=\frac12\left[\frac{\operatorname{sen}(2u-t)}{2}-u\cos t\right]_0^t=\frac12\left(\frac{\operatorname{sen}t-\operatorname{sen}(-t)}{2}-t\cos t\right)
$$

**Paso 4.** $\operatorname{sen}t-\operatorname{sen}(-t)=2\operatorname{sen}t$:

$$
y(t)=\frac12\operatorname{sen}t-\frac12\,t\cos t
$$

## 11. Ecuaciones integrales e integro-diferenciales (7/16: el Ej2 del formato anterior y de 2024-2C)

### 11.1 La idea y la receta

Una **ecuación integral de tipo convolutorio** tiene la incógnita adentro de una integral de convolución:

$$
y(t)=f(t)+\int_0^ty(u)\,k(t-u)\,du
$$

Si además aparece $y'(t)$ es **integro-diferencial** y trae una condición inicial.

1. **Laplace miembro a miembro.** La integral es una convolución: da $Y(s)\cdot K(s)$, con $K$ la transformada del otro factor pensado como función de $t$ ($\operatorname{sen}(t-u)\to\frac{1}{s^2+1}$, $\cos(t-u)\to\frac{s}{s^2+1}$, $(t-u)\to\frac{1}{s^2}$). Si hay $y'(t)$: $sY(s)-y(0)$.
2. **Factor común $Y(s)$** y despejar.
3. **Factorizar y cancelar** lo que se pueda.
4. **Antitransformar** (tabla o fracciones simples).

> **En clase:** "todos los ejercicios arrancan así […] transformada de Laplace miembro a miembro" (aplicaciones [03:41]). "La convolución en realidad la vamos a aplicar más que nada a […] ecuaciones integrales o íntegro diferenciales" (aplicaciones [41:51]).
>
> **En clase:** "era identificar las dos funciones que hay adentro de esa integral y era el producto de las transformadas […] ahí no deberían tener inconveniente tampoco si fuera una íntegro diferencial o una ecuación integral" (repaso [1:10:54]).

### Ejemplo guiado 17: $y(t)=t^2+\int_0^ty(u)\operatorname{sen}(t-u)\,du$ (teórico y ejemplos de clase)

**Paso 1 — miembro a miembro:**

$$
Y(s)=\frac{2}{s^3}+Y(s)\cdot\frac{1}{s^2+1}
$$

**Paso 2 — factor común** ($1-\frac{1}{s^2+1}=\frac{s^2}{s^2+1}$):

$$
Y(s)\,\frac{s^2}{s^2+1}=\frac{2}{s^3}\qquad\Rightarrow\qquad Y(s)=\frac{2(s^2+1)}{s^5}=\frac{2}{s^3}+\frac{2}{s^5}
$$

**Paso 3 — antitransformar.** $\frac{2}{s^3}\to t^2$. Para $\frac{2}{s^5}$ necesito $\frac{4!}{s^5}=\frac{24}{s^5}\to t^4$: multiplico y divido por $12$.

$$
y(t)=t^2+\frac{t^4}{12}
$$

### Ejemplo guiado 18: $y(t)+4\int_0^t(t-u)^2\,y(u)\,du=t^2$ (guía ej. 12a, OneNote; aplicaciones [42:25])

**Paso 1.** El núcleo $(t-u)^2$ se piensa como $t^2\to\frac{2}{s^3}$:

$$
Y(s)+4\cdot\frac{2}{s^3}\cdot Y(s)=\frac{2}{s^3}\qquad\Rightarrow\qquad Y(s)\,\frac{s^3+8}{s^3}=\frac{2}{s^3}\qquad\Rightarrow\qquad Y(s)=\frac{2}{s^3+8}
$$

**Paso 2 — Ruffini.** $s=-2$ anula $s^3+8$. Coeficientes $1\ \ 0\ \ 0\ \ 8$ con raíz $-2$:

| | 1 | 0 | 0 | 8 |
|---|---|---|---|---|
| $-2$ | | $-2$ | $4$ | $-8$ |
| | **1** | $\mathbf{-2}$ | **4** | 0 |

$s^3+8=(s+2)(s^2-2s+4)$, y el cuadrático tiene $4-16<0$: complejas.

**Paso 3 — fracciones simples.** $\dfrac{2}{(s+2)(s^2-2s+4)}=\dfrac{A}{s+2}+\dfrac{Bs+C}{s^2-2s+4}$. Tapado en $-2$: $A=\dfrac{2}{4+4+4}=\dfrac16$.

$\frac16(s^2-2s+4)+(Bs+C)(s+2)=2$. Cuadráticos: $\frac16+B=0\Rightarrow B=-\frac16$. Independientes: $\frac23+2C=2\Rightarrow C=\frac23$.

**Paso 4 — completar y partir.** $s^2-2s+4=(s-1)^2+3$; $-\frac16s+\frac23=-\frac16(s-1)+\frac12$:

$$
Y(s)=\frac16\cdot\frac{1}{s+2}-\frac16\cdot\frac{s-1}{(s-1)^2+3}+\frac12\cdot\frac{1}{(s-1)^2+3}
$$

**Paso 5 — antitransformar** ($\beta=\sqrt3$; al último le falta un $\sqrt3$ arriba):

$$
y(t)=\frac16e^{-2t}-\frac16e^{t}\cos(\sqrt3\,t)+\frac{1}{2\sqrt3}e^{t}\operatorname{sen}(\sqrt3\,t)
$$

> **En clase:** "otra herramienta que vamos a usar muchísimo en estas próximas clases, que es Ruffini" (aplicaciones [45:36]).

### Ejemplo guiado 19 (integro-diferencial): $\int_0^ty(u)(t-u)\,du+y'(t)=\dfrac{t^4}{12}+t+1$, $y(0)=-1$ (guía ej. 12e, ejemplos de clase y OneNote)

**Paso 1 — miembro a miembro** (núcleo $(t-u)\to\frac{1}{s^2}$; derivada con $y(0)=-1$; $\frac{t^4}{12}\to\frac{1}{12}\cdot\frac{24}{s^5}$):

$$
Y(s)\cdot\frac{1}{s^2}+sY(s)-(-1)=\frac{2}{s^5}+\frac{1}{s^2}+\frac1s
$$

**Paso 2 — despejar:**

$$
Y(s)\,\frac{1+s^3}{s^2}=\frac{2+s^3+s^4-s^5}{s^5}\qquad\Rightarrow\qquad Y(s)=\frac{2+s^3+s^4-s^5}{s^3(s^3+1)}
$$

**Paso 3 — factorizar y cancelar.** Ruffini con raíz $-1$: $s^3+1=(s+1)(s^2-s+1)$. Y el numerador **también** es divisible por $s^2-s+1$: $-s^5+s^4+s^3+2=(-s^3+2s+2)(s^2-s+1)$.

$$
Y(s)=\frac{-s^3+2s+2}{s^3(s+1)}
$$

**Paso 4 — fracciones simples** (raíz triple $0$, simple $-1$): $\dfrac{A}{s^3}+\dfrac{B}{s^2}+\dfrac Cs+\dfrac{D}{s+1}$. Tapado: $A=\dfrac{2}{1}=2$ (en $0$), $D=\dfrac{1-2+2}{-1}=-1$ (en $-1$).

$2(s+1)+Bs(s+1)+Cs^2(s+1)-s^3=-s^3+2s+2$. Cúbicos: $C-1=-1\Rightarrow C=0$. Cuadráticos: $B+C=0\Rightarrow B=0$.

**Paso 5:**

$$
Y(s)=\frac{2}{s^3}-\frac{1}{s+1}\qquad\Rightarrow\qquad y(t)=t^2-e^{-t}
$$

Sin la cancelación del Paso 3 quedaba un sistema de 6 incógnitas (aplicaciones [55:05]). El teórico llega a lo mismo acomodando el numerador: $2+s^3+s^4-s^5=2(1+s^3)-s^3(s^2-s+1)$.

$\dfrac{A}{s^2}+\dfrac Bs+\dfrac{C}{(s-1)^2}+\dfrac{D}{s-1}$. Tapado: $A=1$ (en $0$), $C=2$ (en $1$). Numerador: $A(s-1)^2+Bs(s-1)^2+Cs^2+Ds^2(s-1)=s^2+1$. Lineales: $-2A+B=0\Rightarrow B=2$. Cúbicos: $B+D=0\Rightarrow D=-2$.

$$
y(t)=t+2+2te^{t}-2e^{t}
$$

**d)** $Y=\dfrac Ys+\dfrac{s}{s^2+1}\Rightarrow Y\,\dfrac{s-1}{s}=\dfrac{s}{s^2+1}\Rightarrow Y(s)=\dfrac{s^2}{(s-1)(s^2+1)}$.

$\dfrac{A}{s-1}+\dfrac{Bs+C}{s^2+1}$: tapado $A=\dfrac12$; cuadráticos $A+B=1\Rightarrow B=\dfrac12$; independientes $A-C=0\Rightarrow C=\dfrac12$.

$$
y(t)=\frac12e^{t}+\frac12\cos t+\frac12\operatorname{sen}t

## 12. Ecuaciones diferenciales y sistemas (el 2do recuperatorio del 2025-02-13)

### 12.1 La idea y la receta

La propiedad que hace famoso a Laplace: transformar una derivada es multiplicar por $s$ y restar las condiciones iniciales.

$$
\mathcal{L}[y'(t)]=sY(s)-y(0)\qquad\qquad\mathcal{L}[y''(t)]=s^2Y(s)-s\,y(0)-y'(0)
$$

1. **Laplace miembro a miembro**, reemplazando las condiciones iniciales.
2. **Despejar $Y(s)$.**
3. **Antitransformar** (casi siempre con fracciones simples).

> **En clase:** "la derivada primera y la derivada segunda la vamos a usar muy seguido […] la derivada tercera, la verdad es que no" (teórica [37:08]). "¿Dónde va a venir la dificultad? Básicamente en la antitransformada. Todo lo demás va a ser muy parecido siempre" (aplicaciones [07:30]).

En el formato vigente la ecuación diferencial se toma dentro del **Ej3** (respuesta de un sistema): se practica a fondo en la guía `03`. Acá va un ejemplo completo y el caso que sí cayó en un Ej de Laplace: el **sistema**.

### Ejemplo guiado 20: $y''-2y'+5y=-8e^{-t}$, $y(0)=2$, $y'(0)=12$ (guía ej. 8g, ejemplos de clase)

**Paso 1 — miembro a miembro:**

$$
s^2Y-2s-12-2\,(sY-2)+5Y=\frac{-8}{s+1}
$$

**Paso 2 — despejar:**

$$
Y(s)\,(s^2-2s+5)=\frac{-8}{s+1}+2s+8=\frac{-8+(2s+8)(s+1)}{s+1}=\frac{2s^2+10s}{s+1}
$$

$$
Y(s)=\frac{2s^2+10s}{(s+1)(s^2-2s+5)}
$$

**Paso 3 — fracciones simples.** $s^2-2s+5$ tiene $4-20<0$. $\dfrac{A}{s+1}+\dfrac{Bs+C}{s^2-2s+5}$. Tapado en $-1$: $A=\dfrac{2-10}{1+2+5}=-1$.

$-1(s^2-2s+5)+(Bs+C)(s+1)=2s^2+10s$. Cuadráticos: $-1+B=2\Rightarrow B=3$. Independientes: $-5+C=0\Rightarrow C=5$.

**Paso 4 — completar y partir.** $s^2-2s+5=(s-1)^2+4$; $3s+5=3(s-1)+8$:

$$
Y(s)=\frac{-1}{s+1}+\frac{3(s-1)}{(s-1)^2+4}+\frac{8}{(s-1)^2+4}
$$

**Paso 5** ($\beta=2$ y $8=4\cdot2$):

$$
y(t)=-e^{-t}+3e^{t}\cos(2t)+4e^{t}\operatorname{sen}(2t)
$$

Coincide con la guía.

> ⚠ **Errata del PDF "Ecuaciones diferenciales ejemplos"** (pág. 8): un renglón escribe $Y(s)=\frac{1}{s+1}+\frac{3s+5}{(s-1)^2+4}$, con el primer término en positivo. Es $\frac{-1}{s+1}$ ($A=-1$), como figura en los renglones siguientes y en el resultado.

### 12.2 Sistemas de ecuaciones diferenciales: Cramer

Se transforma **cada** ecuación y queda un sistema algebraico de 2×2 con incógnitas $X(s)$ e $Y(s)$. Vale cualquier método; el teórico y el profesor recomiendan **Cramer**:

1. Laplace a las dos ecuaciones, con las condiciones iniciales.
2. Ordenar: $X(s)$ e $Y(s)$ a la izquierda, números a la derecha.
3. $\Delta$ = determinante de los coeficientes. $\Delta_X$ = el mismo con la columna de $X$ reemplazada por los términos independientes; $\Delta_Y$ igual con la columna de $Y$.
4. $X(s)=\dfrac{\Delta_X}{\Delta}$, $Y(s)=\dfrac{\Delta_Y}{\Delta}$. Fracciones simples y antitransformar cada una.

> **En clase:** el sistema es "otro tipo de ejercicio, que creo que lo tomaron hace poco en un final o en un recuperatorio" (aplicaciones [14:51]). Con Cramer "no tuve que operar con polinomios, con choclos muy grandes" (aplicaciones [25:24]).
>
> **En clase:** en ese examen lo escribieron sin el $(t)$, "y esto la gente lo volvió bastante loca […] pensaron que se trataban de incógnitas que son números en vez de ser incógnitas que son funciones" (aplicaciones [26:27]). Si ves $x'$ y $x$, es un sistema de ecuaciones diferenciales.

### Ejemplo guiado 21: $x'=x-y$, $y'=2x+4y$, $x(0)=-1$, $y(0)=0$ (guía ej. 9b; OneNote por sustitución, aplicaciones [20:45] por Cramer)

**Paso 1 — Laplace:**

$$
sX+1=X-Y\qquad\qquad sY-0=2X+4Y
$$

**Paso 2 — ordenar:**

$$
\begin{cases}(s-1)\,X+Y=-1\\-2X+(s-4)\,Y=0\end{cases}
$$

**Paso 3 — determinantes:**

$$
\Delta=\begin{vmatrix}s-1&1\\-2&s-4\end{vmatrix}=(s-1)(s-4)+2=s^2-5s+6=(s-2)(s-3)
$$

$$
\Delta_X=\begin{vmatrix}-1&1\\0&s-4\end{vmatrix}=-(s-4)=4-s\qquad\qquad\Delta_Y=\begin{vmatrix}s-1&-1\\-2&0\end{vmatrix}=-2
$$

**Paso 4 — $X(s)$.** $\dfrac{4-s}{(s-3)(s-2)}=\dfrac{A}{s-3}+\dfrac{B}{s-2}$, tapado: $A=\dfrac{1}{1}=1$, $B=\dfrac{2}{-1}=-2$.

$$
x(t)=e^{3t}-2e^{2t}
$$

**Paso 5 — $Y(s)$.** $\dfrac{-2}{(s-3)(s-2)}$, tapado: $A=\dfrac{-2}{1}=-2$, $B=\dfrac{-2}{-1}=2$.

$$
y(t)=-2e^{3t}+2e^{2t}
$$

Coincide con la guía. Control rápido: $x(0)=1-2=-1$ ✓, $y(0)=0$ ✓.

## 13. Lo que se toma poco: 2ª traslación y escalón, TVI/TVF, impulso

Nada de esto apareció en un Ej2 de las 16 hojas. Sí está en la guía y en los multiple choice "tomados en finales" (guía ej. 14). Los teoremas del valor inicial y final se usan en el Ej3 (guía `03`).

**Escalón unitario** $E(t-a)$: vale $0$ antes de $a$ y $1$ después. $\mathcal{L}[E(t-a)]=\dfrac{e^{-as}}{s}$.

**2ª traslación.** Si $g(t)=f(t-a)$ para $t>a$ y $0$ para $t<a$ (o sea $f(t-a)\,E(t-a)$): $\mathcal{L}[g(t)]=e^{-as}F(s)$. Condición para usarla: **todas las $t$ de la fórmula con el mismo corrimiento, y ese mismo corrimiento en el dominio**.

- $(t-1)^4$ con $t>1$ (guía 2d): sí ⇒ $\dfrac{24}{s^5}e^{-s}$.
- $(t-1)^4$ con $t>0$ (guía 3e): **no**; se desarrolla el binomio: $t^4-4t^3+6t^2-4t+1\to\dfrac{24}{s^5}-\dfrac{24}{s^4}+\dfrac{12}{s^3}-\dfrac{4}{s^2}+\dfrac1s$.

> **En clase:** "siempre es importante que vean que hay el mismo desplazamiento" en la fórmula y en el dominio (teórica [28:41]).

**Funciones partidas en un renglón** (PDF de propiedades, manuscrito): se "prende" y se "apaga" cada tramo con escalones. Ejemplo del profesor: $f(t)=t$ si $1<t<2$ y $0$ en el resto.

![La recta prendida en 1, lo que hay que restar desde 2 y la función que queda](../img/02-fig2-funcion-partida-con-escalones.png)

$f(t)=t\,E(t-1)-t\,E(t-2)$. Para que cada $t$ tenga el corrimiento de su escalón se suma y se resta: $t=(t-1)+1$ y $t=(t-2)+2$.

$$
f(t)=(t-1)\,E(t-1)+1\cdot E(t-1)-(t-2)\,E(t-2)-2\,E(t-2)
$$

$$
F(s)=\frac{e^{-s}}{s^2}+\frac{e^{-s}}{s}-\frac{e^{-2s}}{s^2}-\frac{2e^{-2s}}{s}
$$

**Teoremas del valor inicial y final** (si existen los límites):

$$
\lim_{t\to0}f(t)=\lim_{s\to\infty}s\,F(s)\qquad\qquad\lim_{t\to\infty}f(t)=\lim_{s\to0}s\,F(s)
$$

**Impulso** $\delta(t)$: $\mathcal{L}[\delta(t)]=1$ (está en la tabla). Aparece al antitransformar una constante (9.D).

**Las transformadas que conviene tener armadas:**

$$
\mathcal{L}[t\cos(at)]=\frac{s^2-a^2}{(s^2+a^2)^2}\qquad\mathcal{L}[t\operatorname{sen}(at)]=\frac{2as}{(s^2+a^2)^2}\qquad\mathcal{L}[a^t]=\frac{1}{s-\ln a}
$$

$$
\mathcal{L}\left[\frac{\operatorname{sen}t}{t}\right]=\frac\pi2-\operatorname{arctg}s\qquad\mathcal{L}\left[\frac{1-e^{-mt}}{t}\right]=\ln\frac{s+m}{s}
$$

**Potencias:** $\cos^3t=\frac14\cos3t+\frac34\cos t$ · $\operatorname{sen}^3t=-\frac14\operatorname{sen}3t+\frac34\operatorname{sen}t$. Ojo: $(2j)^3=-8j$.

**Convolución de examen:**

$$
\mathcal{L}^{-1}\left[\frac{1}{(s^2+1)^2}\right]=\frac12\operatorname{sen}t-\frac12t\cos t\qquad\qquad\mathcal{L}^{-1}\left[\frac{s^2}{(s^2+1)^2}\right]=\frac12\operatorname{sen}t+\frac12t\cos t
$$

con $\operatorname{sen}u\operatorname{sen}(t-u)=\frac12[\cos(2u-t)-\cos t]$ y $\cos u\cos(t-u)=\frac12[\cos(2u-t)+\cos t]$.

**Fracciones simples.** Sacar el coeficiente principal. Real simple $\frac{A}{s-p}$; doble $\frac{A}{(s-p)^2}+\frac{B}{s-p}$; complejas $\frac{Bs+C}{s^2+bs+c}$. Tapado para las simples y para la mayor potencia; el resto, comparando coeficientes. Complejas: completar cuadrado, partir numerador, $e^{\alpha t}\cos\beta t$ y $e^{\alpha t}\operatorname{sen}\beta t$.

**Ecuaciones.** Siempre "Laplace miembro a miembro". $\mathcal{L}[y']=sY-y(0)$; $\mathcal{L}[y'']=s^2Y-s\,y(0)-y'(0)$. Antes de las fracciones simples: factorizar (Ruffini) y cancelar.

## Errores típicos

1. **Evaluar antes de derivar** en una integral con $t$: derivás una constante y da $0$.
2. **Olvidarse el cambio de signo** de la multiplicación por $t$ (o cambiarlo con $n$ par).
3. **Tratar el $e^{-5t}$ de la integral como 1ª traslación.** En una integral de $0$ a $\infty$ es el $e^{-st}$ de la definición: dice dónde evaluar.
4. **Derivar mal el cociente:** $\left(\frac{s}{s^2+1}\right)'=\frac{1-s^2}{(s^2+1)^2}$, y recién después el signo.
5. **Separar $\frac{e^{-at}-e^{-bt}}{t}$ en dos integrales** con $\frac1t$.
6. **No escribir el límite** de la división por $t$: es parte de la resolución oficial.
7. **Dejar $\infty-\infty$** sin juntar los logaritmos, u olvidarse de evaluar en el número al final.
8. **$(2j)^3=8j$** (es $-8j$), o quedarse con $\frac{1}{4j}$ sin convertirlo en $\frac12\cdot\frac{1}{2j}$.
9. **Trasladar solo el denominador** y olvidarse de la $s$ del numerador.
10. **Transformar $g(t-u)$ con el corrimiento**: se piensa como $g(t)$.
11. **En la convolución, integrar $\cos t$ como si dependiera de $u$**: es constante, da $u\cos t$. Y olvidarse el $\frac12$ de la primitiva de $\cos(2u-t)$.
12. **Equivocarse con $\operatorname{sen}(-t)=-\operatorname{sen}t$** en Barrow.
13. **Darle el $t-u$ al seno** cuando había una exponencial.
14. **No sacar el coeficiente principal** al factorizar.
15. **Una sola constante arriba de un cuadrático** con raíces complejas (van dos: $Bs+C$).
16. **Completar el cuadrado y no partir el numerador.**
17. **Olvidarse las condiciones iniciales** al transformar $y'$ o $y''$, o equivocar el signo de $-y(0)$ cuando $y(0)$ es negativo.
18. **Leer $x'=x-y$ como un sistema de números**: son funciones de $t$.
