## ⚠️ No entra todo: se hace solo el núcleo de cada guía

Son **5 temas 🔴 desde cero en 4 días** (el quinto es de simulacro). Las 5 guías completas
suman ≈ 24 h según sus encabezados; con ≈ 32 h en 4 días entrarían justas y sin margen para
corregir errores. Por eso cada guía se hace **en modo núcleo**:

- **Núcleo (obligatorio):** las secciones de lo que cayó en 2025 o en el repaso 2026, con sus
  ejemplos guiados y **solo los "tu turno" que son ítems de parcial 2025**, más el checkpoint.
- **Reservado para el lunes:** los "tu turno" marcados **"repaso 2026"** no se hacen en la
  guía: son los mismos ejercicios de `08`, que el lunes 23 se rinde **a ciegas y con reloj**.
  No abras `08` antes.
- **Opcional:** el resto de la práctica (ejercicios de la guía de la cátedra y del teórico).
  Solo si terminaste el núcleo del día antes de tiempo, o como refuerzo si un checkpoint salió
  mal.
- **Cae sin culpa:** ajuste (`00–02`; `08` ej. 5 y 14), Lagrange y Newton-Gregory
  equiespaciado (`05` §5, §9, §10), tablas largas de Jacobi/Gauss-Seidel (`04` 4.A–4.C,
  6.B–6.E), `h` para Simpson como ejercicio propio (`06` §7), RK2 y sistemas de EDO (`07` §9),
  órdenes y raíces múltiples (`03` §9, salvo el recuadro).

### Los ejercicios "seguros" para el 6

| Orden | Ejercicio | Por qué es seguro | Qué asegurar |
|---|---|---|---|
| 1 | **Ej4 Integración** (2 pts) | En las 4 hojas 2025 fue **la misma consigna** (elegir `h` para Trapecios) y el repaso 2026 la repitió. Un solo ítem, una sola receta; el error está en el ayudamemoria. | `06` §6: `f''`, `f''' = 0`, extremos contra puntos críticos, despejar `h`, elegir un `h` "lindo". Y "¿se puede Simpson?" = `N` par. |
| 2 | **Ej5 Ecuaciones diferenciales** (2 pts) | En el parcial cayó 2/2 Lipschitz + Euler de 3 filas. Euler, Heun y RK4 **están en el ayudamemoria**: es armar la tabla sin errar la calculadora. | `07` §3 (Lipschitz por derivada parcial) y §4; una tabla de Heun y una fila de RK4. |
| 3 | **Ej3 Interpolación** (2 pts) | El ítem (a) cayó 4/4 con la misma mecánica (tabla de diferencias divididas → polinomio → evaluar en las `x` tapadas) y el (b) sale de una regla de tres líneas. | `05` §6–§8. |
| Colchón | **Ej1 Raíces** | Tres ítems independientes (0,5 + 0,75 + 0,75): separar raíces (4/4), iteraciones de bisección (cuenta fija) y Newton-Raphson (3/4). Aunque falle uno, suma. Con este se llega al 8. | `03` §3, §5, §8. |
| El variable | **Ej2 Sistemas** | En 4 hojas hubo 3 consignas distintas (radio espectral, `k`, número de condición + Gauss-Seidel) y el repaso sumó una cuarta. Se prepara, pero **no se cuenta con él** para el 6. | `04` §7 completa. |

**Regla de trabajo:** cada "tu turno" se hace **en papel, con calculadora y sin mirar**, y se
corrige contra la resolución plegada. El checkpoint de cada guía va **con reloj (25 min)** y
solo con la pág. 4 del ayudamemoria. Si un checkpoint sale mal, antes de seguir rehacé el
ítem de parcial gemelo. Terminá cada día con `/registrar`: lo que falló manda el domingo a la
tarde y el lunes.
