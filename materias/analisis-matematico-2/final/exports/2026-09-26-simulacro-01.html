# Simulacro 01 — Final (Análisis Matemático II) · estilo 2026

> **Duración:** 2 horas. **Estructura:** `T1`, `T2` (teóricos con incisos a/b) y `P1`–`P4`.
> **Aprobación:** tres ejercicios correctamente resueltos, **uno** de T1/T2 y **dos** de P1–P4.
> Justificá todos los pasos. En flujos y circulaciones, **indicá la orientación** elegida.
>
> Este simulacro copia el esqueleto de los seis finales de 2026: un teórico con Green/Stokes/Gauss,
> el otro con V/F de primer parcial, un flujo saliente por Gauss, una circulación por Green con
> función desconocida, una EDO de primer orden y un ítem de implícita + gradiente.

---

## T1)

**a)** Enunciá el **teorema de Green** con todas sus hipótesis y deducí a partir de él una fórmula para calcular el área de una región plana mediante una integral de línea.

**b)** Sea $f=(P,Q)\in C^1(\mathbb{R}^2)$ tal que $Q'_x-P'_y=4$ en todo el plano y $f(x,0)=(x^2,\,5x)$. Calculá la circulación de $f$ a lo largo de la semicircunferencia $x^2+y^2=9$, $y\ge 0$, recorrida desde $(3,0)$ hasta $(-3,0)$.

<details>
<summary><strong>Corrección T1</strong></summary>

<details>
<summary>Resolución completa</summary>

**a)** Ver machete §8, T-B: hipótesis ($f=(P,Q)\in C^1$ en un abierto que contiene a $D$; $D$ región regular del plano; $\partial D$ curva cerrada simple, regular a trozos, recorrida en sentido antihorario), tesis

$$\oint_{\partial D} P\,dx+Q\,dy=\iint_D\left(Q'_x-P'_y\right)dA .$$

Fórmula del área: elegir un campo con $Q'_x-P'_y\equiv 1$, por ejemplo $(0,x)$ o $(-y,0)$; entonces $\iint_D 1\,dA=\text{área}(D)$ y queda $\text{área}(D)=\oint_{\partial D}x\,dy=-\oint_{\partial D}y\,dx=\tfrac12\oint_{\partial D}x\,dy-y\,dx$.

**b)** La curva es abierta: se cierra con el segmento $S$ del eje $x$ desde $(-3,0)$ hasta $(3,0)$. Arco (de derecha a izquierda por arriba) más segmento (de izquierda a derecha por abajo) es la frontera del semidisco $D$ recorrida en sentido **antihorario**, así que Green se aplica tal cual:

$$\int_{\text{arco}}f\cdot d\lambda+\int_S f\cdot d\lambda=\iint_D 4\,dA=4\cdot\frac{9\pi}{2}=18\pi .$$

Sobre $S$: $y=0$, $\lambda(x)=(x,0)$, $\lambda'=(1,0)$, $x$ de $-3$ a $3$, y $f(x,0)=(x^2,5x)$:

$$\int_S f\cdot d\lambda=\int_{-3}^{3}x^2\,dx=18 .$$

**Resultado:**

$$\boxed{\;\int_{\text{arco}}f\cdot d\lambda=18\pi-18\;}$$

</details>

**Criterio de puntuación:** a) enunciado con las hipótesis completas (3 pts) + deducción del área con un campo explícito (2 pts). b) cerrar la curva y justificar la orientación (2 pts), Green con el dato $Q'_x-P'_y=4$ (1 pt), integral sobre el segmento con $f(x,0)$ (1 pt), resultado (1 pt).

</details>

---

## T2)

**a)** V/F, justificando: la función $f(x,y)=\dfrac{xy^2}{x^2+y^2}$ si $(x,y)\ne(0,0)$, $f(0,0)=0$, es diferenciable en $(0,0)$.

**b)** V/F, justificando: $f(x,y)=x^3+y^3-3xy$ no tiene máximos locales.

<details>
<summary><strong>Corrección T2</strong></summary>

<details>
<summary>Resolución completa</summary>

**a) Falso.** Derivadas parciales en el origen por definición: $f(h,0)=0$ y $f(0,h)=0$, así que $f'_x(0,0)=f'_y(0,0)=0$. Si fuera diferenciable, el límite

$$\lim_{(x,y)\to(0,0)}\frac{f(x,y)-f(0,0)-0\cdot x-0\cdot y}{\sqrt{x^2+y^2}}=\lim_{(x,y)\to(0,0)}\frac{xy^2}{(x^2+y^2)^{3/2}}$$

tendría que ser $0$. Por la recta $y=x$: $\dfrac{x^3}{(2x^2)^{3/2}}=\dfrac{x^3}{2\sqrt2\,|x|^3}=\pm\dfrac{1}{2\sqrt2}\ne 0$. No es diferenciable (sí es continua, porque $|f|\le|x|$, pero eso no alcanza).

**b) Verdadero.** Puntos críticos: $f'_x=3x^2-3y=0$, $f'_y=3y^2-3x=0$ ⇒ $y=x^2$, $x=y^2=x^4$ ⇒ $x=0$ o $x=1$: $(0,0)$ y $(1,1)$. Hessiano $H=\begin{pmatrix}6x&-3\\-3&6y\end{pmatrix}$.

- En $(0,0)$: $\det H=-9<0$ ⇒ punto silla.
- En $(1,1)$: $\det H=36-9=27>0$ y $f''_{xx}=6>0$ ⇒ mínimo local.

No hay máximos locales.

**Resultado:**

$$\boxed{\;\text{a) Falso}\qquad \text{b) Verdadero}\;}$$

</details>

**Criterio de puntuación:** a) parciales en el origen (1 pt), límite de diferenciabilidad planteado (2 pts), camino que lo rompe (2 pts). b) puntos críticos (2 pts), Hessiano en cada uno con conclusión (3 pts).

</details>

## P1)

Calculá el flujo **saliente** de $f(x,y,z)=\left(xz+y^7,\; yz-\cos x,\; e^{xy}-5\right)$ a través de la frontera del cuerpo $V:\ x^2+y^2\le z\le 4$ contenido en el primer octante.

<details>
<summary><strong>Corrección P1</strong></summary>

<details>
<summary>Resolución completa</summary>

**Paso 1:** $\partial V$ es cerrada (paraboloide + tapa $z=4$ + los planos $x=0$, $y=0$), $f\in C^1(\mathbb{R}^3)$ y la normal pedida es la saliente: Gauss.

**Paso 2:** $\operatorname{div}f=z+z+0=2z$. Los términos $y^7$, $-\cos x$, $e^{xy}-5$ no dependen de la variable que se deriva.

**Paso 3:** En cilíndricas, $V$: $0\le\theta\le\pi/2$, $0\le r\le 2$, $r^2\le z\le 4$.

$$\iiint_V 2z\,dV=\int_0^{\pi/2}\!\!\int_0^2\!\!\int_{r^2}^{4}2z\,r\,dz\,dr\,d\theta=\int_0^{\pi/2}\!\!\int_0^2\left(16-r^4\right)r\,dr\,d\theta=\frac{\pi}{2}\left[8r^2-\frac{r^6}{6}\right]_0^2=\frac{\pi}{2}\left(32-\frac{32}{3}\right).$$

**Resultado:**

$$\boxed{\;\Phi=\frac{32\pi}{3}\;}$$

</details>

**Criterio de puntuación:** justificar Gauss (cerrada, $C^1$, saliente) (2 pts), divergencia correcta (2 pts), límites en cilíndricas con el primer octante (3 pts), cálculo y resultado (3 pts).

</details>

## P2)

Sea $h\in C^1(\mathbb{R})$ y $f(x,y)=\left(x^2+y,\; h(y)+3x\right)$. Calculá la circulación de $f$ a lo largo de la curva $C:\ y=4-x^2$, $y\ge 0$, recorrida desde $(2,0)$ hasta $(-2,0)$.

<details>
<summary><strong>Corrección P2</strong></summary>

<details>
<summary>Resolución completa</summary>

**Paso 1:** ¿Conservativo? $P'_y=1$, $Q'_x=3$: no. Como $h$ es desconocida, hay que hacer que desaparezca: Green.

**Paso 2:** $Q'_x-P'_y=3-1=2$, sin $h$. Se cierra $C$ con el segmento $S$ del eje $x$ de $(-2,0)$ a $(2,0)$. Arco por arriba de derecha a izquierda más segmento por abajo de izquierda a derecha: sentido antihorario, frontera de $D:\ 0\le y\le 4-x^2$.

$$\text{área}(D)=\int_{-2}^{2}(4-x^2)\,dx=\frac{32}{3},\qquad \oint_{\partial D}f\cdot d\lambda=\iint_D 2\,dA=\frac{64}{3}.$$

**Paso 3:** Sobre $S$: $y=0$, $dy=0$, sólo cuenta $P(x,0)=x^2$ (acá $h$ tampoco aparece, porque va con $dy$):

$$\int_S f\cdot d\lambda=\int_{-2}^{2}x^2\,dx=\frac{16}{3}.$$

**Paso 4:** $\int_C=\oint_{\partial D}-\int_S=\dfrac{64}{3}-\dfrac{16}{3}$.

**Resultado:**

$$\boxed{\;\int_C f\cdot d\lambda=16\;}$$

</details>

**Criterio de puntuación:** descartar conservativo y elegir Green (2 pts), cierre y orientación justificada (2 pts), integral doble (2 pts), segmento con $h$ eliminada y $P(x,0)$ (2 pts), resultado (2 pts).

</details>

## P3)

**a)** Hallá la línea de campo de $F(x,y)=\left(x,\; x^2+2y\right)$ que pasa por el punto $(1,2)$.

**b)** Hallá $a\in\mathbb{R}$ para que las familias de curvas $y=kx^2$ y $x^2+ay^2=C$ sean ortogonales.

<details>
<summary><strong>Corrección P3</strong></summary>

<details>
<summary>Resolución completa</summary>

**a)** Líneas de campo: $\dfrac{dy}{dx}=\dfrac{Q}{P}=\dfrac{x^2+2y}{x}$, es decir $y'-\dfrac{2}{x}y=x$ (lineal, $x>0$ porque el punto tiene $x=1$).

Factor integrante $\mu=e^{\int-2/x\,dx}=x^{-2}$. Entonces $\left(x^{-2}y\right)'=x^{-2}\cdot x=\dfrac1x$, luego $x^{-2}y=\ln x+K$ y

$$y=x^2\left(\ln x+K\right).$$

Con $(1,2)$: $2=1\cdot(0+K)$ ⇒ $K=2$.

**b)** Pendiente de la primera familia eliminando $k$: $y'=2kx=\dfrac{2y}{x}$. Segunda familia: $2x+2ayy'=0$ ⇒ $y'=-\dfrac{x}{ay}$. Ortogonales si el producto es $-1$:

$$\frac{2y}{x}\cdot\left(-\frac{x}{ay}\right)=-\frac{2}{a}=-1\ \Rightarrow\ a=2.$$

**Resultado:**

$$\boxed{\;\text{a)}\ y=x^2(\ln x+2)\qquad \text{b)}\ a=2\;}$$

</details>

**Criterio de puntuación:** a) plantear $y'=Q/P$ (1 pt), reconocer lineal y factor integrante (2 pts), solución general (1 pt), constante (1 pt). b) pendiente de cada familia sin la constante (3 pts), condición y valor de $a$ (2 pts).

</details>

---

## P4)

La ecuación $x^2+yz+z^3=3$ define implícitamente $z=g(x,y)$ en un entorno de $(1,1,1)$.

**a)** Justificá que la define, y hallá la dirección y el sentido de **máximo decrecimiento** de $g$ en $(1,1)$ y el valor de la derivada direccional en esa dirección.

**b)** Escribí la ecuación del plano tangente a la superficie en $(1,1,1)$.

<details>
<summary><strong>Corrección P4</strong></summary>

<details>
<summary>Resolución completa</summary>

**Paso 1:** $F(x,y,z)=x^2+yz+z^3-3$ es $C^1$, $F(1,1,1)=0$ y $F'_z=y+3z^2=4\ne 0$ en el punto: por el teorema de la función implícita existe $z=g(x,y)$ en un entorno.

**Paso 2:** $g'_x=-\dfrac{F'_x}{F'_z}=-\dfrac{2x}{y+3z^2}=-\dfrac{1}{2}$, $g'_y=-\dfrac{F'_y}{F'_z}=-\dfrac{z}{y+3z^2}=-\dfrac14$. Luego $\nabla g(1,1)=\left(-\tfrac12,-\tfrac14\right)$, $|\nabla g|=\sqrt{\tfrac14+\tfrac1{16}}=\dfrac{\sqrt5}{4}$.

**Paso 3:** Máximo decrecimiento: sentido opuesto al gradiente, versor $\check u=-\dfrac{\nabla g}{|\nabla g|}=\dfrac{(2,1)}{\sqrt5}$, y la derivada direccional vale $-|\nabla g|=-\dfrac{\sqrt5}{4}$.

**Paso 4 (b):** normal $\nabla F(1,1,1)=(2x,\,z,\,y+3z^2)=(2,1,4)$. Plano: $2(x-1)+(y-1)+4(z-1)=0$.

**Resultado:**

$$\boxed{\;\text{a)}\ \check u=\tfrac{1}{\sqrt5}(2,1),\quad g'\big((1,1),\check u\big)=-\tfrac{\sqrt5}{4}\qquad \text{b)}\ 2x+y+4z=7\;}$$

</details>

**Criterio de puntuación:** a) hipótesis del teorema de la función implícita (2 pts), gradiente de $g$ por derivación implícita (3 pts), versor y valor (2 pts). b) normal y plano (3 pts).

</details>

## Cómo usar este simulacro

1. **2 horas con reloj**, sin machete ni apuntes, con las correcciones plegadas (usá el `.md` o el HTML; en el PDF salen abiertas).
2. En los primeros 10 minutos elegí los 3 que vas a hacer (uno de T1/T2, dos de P1–P4) con la tabla §0 del machete en la cabeza. Anotá en una línea el camino y la orientación antes de empezar cada uno. Si te sobra tiempo, recién ahí un cuarto.
3. Al terminar, abrí cada corrección y puntuá con el criterio. Aprobado = tres ítems con al menos 7/10.
4. `/registrar` con cada error concreto: tema, qué falló, cómo se corrige.
5. Si el teórico que cayó no fue el tuyo: en un final de 2026 el otro teórico probable es enunciar **Stokes** o **Gauss** con hipótesis (machete §8, T-C y T-D; `repaso/practica-flujo.md` Parte 1 para Gauss).
