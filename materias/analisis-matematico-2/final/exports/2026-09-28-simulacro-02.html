# Simulacro 02 — Final (Análisis Matemático II)

> **Duración:** 2 horas. **Estructura:** `T1`, `T2` (teóricos con incisos a/b) y `P1`–`P4`.
> **Aprobación:** tres ejercicios correctamente resueltos, **uno** de T1/T2 y **dos** de P1–P4.
> Justificá todos los pasos. En flujos y circulaciones, **indicá la orientación** elegida.
>
> Segundo simulacro con el esqueleto de los seis finales de 2026, rotando lo que cayó en el 01:
> teórico con **Stokes** (el de los dos finales de julio 2026), V/F de primer parcial, flujo saliente
> por Gauss en un cilindro acostado con función desconocida, Green en un cuarto de elipse, una EDO
> escondida en "hallar $g$ para que sea conservativo", y el implícita más reciclado del dataset.

---

## T1)

**a)** Enunciá el **teorema de Stokes** (o del rotor) con todas sus hipótesis.

**b)** Sea $f=(P,Q,R)\in C^1(\mathbb{R}^3)$ con matriz jacobiana

$$
Df(x,y,z)=\begin{pmatrix}P'_x&2&0\\ 1&Q'_y&1\\ 3&z&R'_z\end{pmatrix}.
$$

Calculá la circulación de $f$ a lo largo de la curva $C:\ x^2+y^2=1\ \cap\ z=3-x$, recorrida en sentido antihorario vista desde $z^+$.

<details>
<summary><strong>Corrección T1</strong></summary>

<details>
<summary>Resolución completa</summary>

**a)** Hipótesis: $S$ superficie regular, orientable, con borde $\partial S$ una curva cerrada simple, regular a trozos; $f\in C^1$ en un abierto que contiene a $S$; $\partial S$ orientada en forma coherente con la normal $\hat n$ de $S$ (regla de la mano derecha: pulgar $=\hat n$, dedos recorren $\partial S$). Tesis:

$$
\oint_{\partial S}f\cdot d\lambda=\iint_S\operatorname{rot}f\cdot\hat n\,dS.
$$

**b) Paso 1 — rotor desde $Df$.** $\operatorname{rot}f=(R'_y-Q'_z,\ P'_z-R'_x,\ Q'_x-P'_y)$. Leyendo la matriz (fila = componente, columna = variable): $R'_y=z$, $Q'_z=1$, $P'_z=0$, $R'_x=3$, $Q'_x=1$, $P'_y=2$. La diagonal no se usa.

$$
\operatorname{rot}f=(z-1,\;-3,\;-1)
$$

**Paso 2 — superficie con ese borde.** El trozo de plano $z=3-x$ sobre el disco $D:\ x^2+y^2\le1$. Como gráfica $z=g(x,y)=3-x$: $N=(-g_x,-g_y,1)=(1,0,1)$, con tercera componente positiva, que es la orientación coherente con "antihorario visto desde $z^+$".

**Paso 3 — producto escalar,** reemplazando $z=3-x$:

$$
\operatorname{rot}f\cdot N=(z-1)\cdot1+(-3)\cdot0+(-1)\cdot1=z-2=1-x
$$

**Paso 4 — integrar sobre el disco.** $\iint_D x\,dA=0$ por simetría (disco centrado en el origen), y $\iint_D 1\,dA=\pi$.

**Resultado:**

$$
\boxed{\;\oint_C f\cdot d\lambda=\pi\;}
$$

(con $C$ antihoraria vista desde arriba; en el otro sentido, $-\pi$).

</details>

**Criterio de puntuación:** a) enunciado con hipótesis completas y orientación coherente (4 pts). b) rotor bien leído de $Df$ sin usar la diagonal (2 pts), superficie plana y normal con la orientación pedida (2 pts), integral y resultado (2 pts).

</details>

---

## T2)

**a)** V/F, justificando: la integral

$$
\int_0^{2\pi}\!\!\int_0^{\sqrt8}\!\!\int_{\rho^2}^{8-\rho^2}\rho\,dz\,d\rho\,d\theta
$$

calcula el volumen del cuerpo $V:\ x^2+y^2\le z\le 8-x^2-y^2$.

**b)** V/F, justificando: $y=x^2+\dfrac1x$ es la solución de $x\,y'+y=3x^2$ que pasa por $(1,2)$.

<details>
<summary><strong>Corrección T2</strong></summary>

<details>
<summary>Resolución completa</summary>

**a) Falso.** El cuerpo está entre dos paraboloides que se cortan donde $\rho^2=8-\rho^2$, es decir en $\rho=2$ (a altura $z=4$). Para $\rho\in(2,\sqrt8]$ el "techo" $8-\rho^2$ queda **por debajo** del "piso" $\rho^2$: la integral interior da negativa y no representa volumen. El rango correcto es $\rho\in[0,2]$. El integrando $\rho$ (jacobiano) y los límites de $z$ y $\theta$ sí están bien. El volumen correcto es

$$
\int_0^{2\pi}\!\!\int_0^{2}(8-2\rho^2)\,\rho\,d\rho\,d\theta=2\pi\Big[4\rho^2-\tfrac{\rho^4}{2}\Big]_0^2=2\pi(16-8)=16\pi.
$$

**b) Verdadero.** Dos cosas que verificar. Que resuelve la ecuación: $y'=2x-\dfrac1{x^2}$, entonces

$$
x\,y'+y=2x^2-\frac1x+x^2+\frac1x=3x^2\ \checkmark
$$

Que pasa por el punto: $y(1)=1+1=2\ \checkmark$. (Y es *la* solución: la ecuación es lineal, $y'+\frac1x y=3x$, con $\mu=x$: $(xy)'=3x^2$ ⇒ $xy=x^3+C$ ⇒ $y=x^2+C/x$; con $y(1)=2$ sale $C=1$.)

**Resultado:**

$$
\boxed{\;\text{a) F: }\rho\text{ debe llegar hasta }2,\ V=16\pi.\qquad\text{b) V.}\;}
$$

</details>

**Criterio de puntuación:** a) detectar la intersección $\rho=2$ y explicar por qué falla el rango (4 pts), volumen correcto (1 pt). b) verificar la ecuación (3 pts) y el punto (1 pt); resolver la EDO no es obligatorio (1 pt extra si lo hace bien).

</details>

## P1)

Sea $h\in C^1(\mathbb{R}^2)$. Calculá el flujo **saliente** de

$$
f(x,y,z)=\big(x+h(y,z),\ \ y^3+e^{xz},\ \ z^3+x\operatorname{sen}y\big)
$$

a través de la frontera del cuerpo $\Omega:\ y^2+z^2\le4,\ 0\le x\le3$.

<details>
<summary><strong>Corrección P1</strong></summary>

<details>
<summary>Resolución completa</summary>

**Paso 1 — decidir.** Superficie cerrada (cilindro de eje $x$ con dos tapas) y campo con "basura" ($h$ desconocida, $e^{xz}$, $x\operatorname{sen}y$) que desaparece al derivar cada componente respecto de su propia variable. Es Gauss.

**Paso 2 — divergencia.**

$$
\operatorname{div}f=\underbrace{1}_{P'_x}+\underbrace{3y^2}_{Q'_y}+\underbrace{3z^2}_{R'_z}=1+3(y^2+z^2)
$$

Observación: $h(y,z)$ no depende de $x$, $e^{xz}$ no depende de $y$ y $x\operatorname{sen}y$ no depende de $z$, por eso ninguno aporta a la divergencia.

**Paso 3 — coordenadas.** El cilindro es de eje $x$: cilíndricas con $y=\rho\cos\varphi$, $z=\rho\operatorname{sen}\varphi$, $x=x$, $dV=\rho\,d\rho\,d\varphi\,dx$, con $\rho\in[0,2]$, $\varphi\in[0,2\pi]$, $x\in[0,3]$.

$$
\Phi=\int_0^3\!\!\int_0^{2\pi}\!\!\int_0^2\big(1+3\rho^2\big)\rho\,d\rho\,d\varphi\,dx
=3\cdot2\pi\cdot\Big[\frac{\rho^2}{2}+\frac{3\rho^4}{4}\Big]_0^2=6\pi\,(2+12)
$$

**Resultado:**

$$
\boxed{\;\Phi=84\pi\;}
$$

con la normal saliente, que es la que da Gauss.

</details>

**Criterio de puntuación:** reconocer Gauss y justificar que $h$ no interviene (2 pts), divergencia correcta (3 pts), coordenadas adaptadas al eje $x$ con el jacobiano (2 pts), integral y resultado con orientación indicada (3 pts).

</details>

## P2)

Calculá la circulación de $f(x,y)=\big(e^{x^2}-y^2,\ \ x^2+\ln(1+y^2)\big)$ a lo largo de la frontera de la región $D:\ 4x^2+9y^2\le36,\ x\ge0,\ y\ge0$, recorrida en sentido antihorario.

<details>
<summary><strong>Corrección P2</strong></summary>

<details>
<summary>Resolución completa</summary>

**Paso 1 — decidir.** Curva plana cerrada (frontera de $D$) y campo con $e^{x^2}$ y $\ln(1+y^2)$, que no se integran directo pero mueren en $Q'_x-P'_y$. Es Green; antihorario es la orientación positiva, así que el signo queda como está.

**Paso 2 — integrando.**

$$
Q'_x-P'_y=2x-(-2y)=2x+2y
$$

**Paso 3 — región.** $4x^2+9y^2\le36$ ⇔ $\dfrac{x^2}{9}+\dfrac{y^2}{4}\le1$: cuarto de elipse con $a=3$, $b=2$ en el primer cuadrante. Polares elípticas $x=3\rho\cos\varphi$, $y=2\rho\operatorname{sen}\varphi$, $\lvert J\rvert=6\rho$, $\rho\in[0,1]$, $\varphi\in[0,\pi/2]$.

**Paso 4 — integrar.**

$$
\iint_D 2x\,dA=\int_0^{\pi/2}\!\!\int_0^1 6\rho\cos\varphi\cdot6\rho\,d\rho\,d\varphi=36\cdot\Big[\operatorname{sen}\varphi\Big]_0^{\pi/2}\cdot\frac13=12
$$

$$
\iint_D 2y\,dA=\int_0^{\pi/2}\!\!\int_0^1 4\rho\operatorname{sen}\varphi\cdot6\rho\,d\rho\,d\varphi=24\cdot\Big[-\cos\varphi\Big]_0^{\pi/2}\cdot\frac13=8
$$

(Control por centroide: área $=\frac14\pi ab=\frac{3\pi}{2}$, $\bar x=\frac{4a}{3\pi}=\frac4\pi$, $\bar y=\frac{4b}{3\pi}=\frac8{3\pi}$; $2\bar x\cdot$área $=12$, $2\bar y\cdot$área $=8$.)

**Resultado:**

$$
\boxed{\;\oint_{\partial D^+}f\cdot d\lambda=20\;}
$$

</details>

**Criterio de puntuación:** elegir Green y justificar (2 pts), $Q'_x-P'_y$ correcto (2 pts), identificar la elipse y sus semiejes (2 pts), cambio de variables con jacobiano $ab\rho$ (2 pts), resultado con orientación (2 pts).

</details>

## P3)

Sea $g\in C^2(\mathbb{R})$ y $f(x,y)=\big(y^2+4y\,g(x),\ \ 2xy+12x+g'(x)\big)$.

**a)** Hallá $g$ para que $f$ sea conservativo y además $f(0,1)=(17,2)$.

**b)** Con esa $g$, calculá la circulación de $f$ desde $(0,0)$ hasta $(1,1)$ a lo largo de cualquier curva regular que los una, justificando por qué no depende de la curva.

<details>
<summary><strong>Corrección P3</strong></summary>

<details>
<summary>Resolución completa</summary>

**a) Paso 1 — condición de conservativo** en $\mathbb{R}^2$ (simplemente conexo, así que la condición es también suficiente): $P'_y=Q'_x$.

$$
P'_y=2y+4g(x),\qquad Q'_x=2y+12+g''(x)\quad\Rightarrow\quad g''-4g=-12
$$

**Paso 2 — EDO de 2º orden.** Característica $r^2-4=0$, $r=\pm2$: $g_H=C_1e^{2x}+C_2e^{-2x}$. Particular constante $g_p=A$: $-4A=-12$ ⇒ $A=3$.

$$
g(x)=C_1e^{2x}+C_2e^{-2x}+3
$$

**Paso 3 — condiciones desde $f(0,1)=(17,2)$.** $P(0,1)=1+4g(0)=17$ ⇒ $g(0)=4$ ⇒ $C_1+C_2=1$. $Q(0,1)=0+0+g'(0)=2$ ⇒ $2C_1-2C_2=2$ ⇒ $C_1-C_2=1$. Entonces $C_1=1$, $C_2=0$:

$$
g(x)=e^{2x}+3
$$

**b) Paso 4 — potencial.** Con $g$ conocida, $f=\big(y^2+4y(e^{2x}+3),\ 2xy+12x+2e^{2x}\big)$.

$\varphi=\int P\,dx=xy^2+2ye^{2x}+12xy+c(y)$. Derivando en $y$: $2xy+2e^{2x}+12x+c'(y)=Q$ ⇒ $c'(y)=0$.

$$
\varphi(x,y)=xy^2+2ye^{2x}+12xy
$$

**Paso 5 — independencia de la trayectoria.** Como $f=\nabla\varphi$, para cualquier curva $C^1$ a trozos de $A$ a $B$: $\int_C f\cdot d\lambda=\varphi(B)-\varphi(A)$.

$$
\varphi(1,1)-\varphi(0,0)=(1+2e^2+12)-0
$$

**Resultado:**

$$
\boxed{\;g(x)=e^{2x}+3,\qquad \int_C f\cdot d\lambda=13+2e^2\;}
$$

</details>

**Criterio de puntuación:** a) plantear $P'_y=Q'_x$ y llegar a la EDO (2 pts), resolverla con homogénea + particular (2 pts), fijar constantes con el dato (2 pts). b) potencial verificado (2 pts), justificar la independencia y el valor (2 pts).

</details>

## P4)

La ecuación $xz+z+y+\ln(z-xy)=10$ define $z=f(x,y)$ en un entorno del punto $(2,1)$.

**a)** Escribí la fórmula de aproximación lineal de $f$ en un entorno de $(2,1)$.

**b)** Hallá la recta normal a la gráfica de $f$ en $(2,1,f(2,1))$ y determiná si corta a la superficie $x+y^2=7$.

<details>
<summary><strong>Corrección P4</strong></summary>

<details>
<summary>Resolución completa</summary>

**Paso 1 — el punto.** Con $x=2$, $y=1$: $3z+1+\ln(z-2)=10$ ⇒ $3z+\ln(z-2)=9$. Probando $z=3$: $9+\ln1=9\ \checkmark$. Entonces $z_0=3$ y el punto es $(2,1,3)$.

**Paso 2 — derivadas de $F=xz+z+y+\ln(z-xy)-10$ en $(2,1,3)$** (ahí $z-xy=1$):

$$
F'_x=z-\frac{y}{z-xy}=3-1=2,\qquad F'_y=1-\frac{x}{z-xy}=1-2=-1
$$

$$
F'_z=x+1+\frac{1}{z-xy}=2+1+1=4
$$

$F\in C^1$ cerca del punto, $F(2,1,3)=0$ y $F'_z\ne0$: el teorema de la función implícita garantiza que $z=f(x,y)$ existe y es $C^1$.

$$
f'_x=-\frac{F'_x}{F'_z}=-\frac12,\qquad f'_y=-\frac{F'_y}{F'_z}=\frac14
$$

**a)**

$$
f(x,y)\approx3-\tfrac12(x-2)+\tfrac14(y-1)
$$

**b) Paso 3 — recta normal.** Dirección: $\nabla F(2,1,3)=(2,-1,4)$ (equivalente a $(f'_x,f'_y,-1)=(-\frac12,\frac14,-1)$, que es $-\frac14$ de aquélla).

$$
X=(2,1,3)+t\,(2,-1,4)\qquad\Leftrightarrow\qquad x=2+2t,\ y=1-t,\ z=3+4t
$$

**Paso 4 — intersección con $x+y^2=7$.** Reemplazando:

$$
2+2t+(1-t)^2=7\ \Rightarrow\ t^2-4=0\ \Rightarrow\ t=\pm2
$$

Sí la corta, en dos puntos: $t=2$ → $(6,-1,11)$ y $t=-2$ → $(-2,3,-5)$.

**Resultado:**

$$
\boxed{\;\begin{aligned}&f(x,y)\approx3-\tfrac12(x-2)+\tfrac14(y-1)\\&X=(2,1,3)+t\,(2,-1,4)\\&\text{corta a }x+y^2=7\text{ en }(6,-1,11)\text{ y }(-2,3,-5)\end{aligned}\;}
$$

</details>

**Criterio de puntuación:** hallar $z_0=3$ (1 pt), derivadas implícitas con justificación del teorema (3 pts), fórmula de aproximación (2 pts), recta normal (2 pts), intersección resuelta (2 pts).

</details>

## Cómo usar este simulacro

1. Rendilo **cronometrado, 2 horas**, sin apuntes y sin abrir ninguna corrección. Usá el PDF `-enunciados`.
2. En los primeros 10 minutos elegí los 3 que vas a hacer (uno de T1/T2, dos de P1–P4) con la tabla §0 del machete en la cabeza. Anotá en una línea el camino y la orientación antes de empezar cada uno. Si te sobra tiempo, recién ahí un cuarto.
3. Al terminar, abrí cada corrección y puntuá con el criterio. Aprobado = tres ítems con al menos 7/10.
4. `/registrar` con cada error concreto: tema, qué falló, cómo se corrige.
5. Si el teórico que cayó no fue el tuyo: el otro probable en 2026 es enunciar **Green** con la fórmula del área, o **Gauss** con hipótesis y un ítem corto de divergencia (machete §8, T-B y T-D; `repaso/practica-flujo.md` Parte 1 para Gauss).
