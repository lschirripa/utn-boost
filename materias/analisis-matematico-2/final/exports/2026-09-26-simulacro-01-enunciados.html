# Simulacro 01 — Final (Análisis Matemático II) · estilo 2026

> **Duración:** 2 horas. **Estructura:** `T1`, `T2` (teóricos con incisos a/b) y `P1`–`P4`.
> **Aprobación:** tres ejercicios correctamente resueltos, **uno** de T1/T2 y **dos** de P1–P4.
> Justificá todos los pasos. En flujos y circulaciones, **indicá la orientación** elegida.
>
> Este simulacro copia el esqueleto de los seis finales de 2026: un teórico con Green/Stokes/Gauss,
> el otro con V/F de primer parcial, un flujo saliente por Gauss, una circulación por Green con
> función desconocida, una EDO de primer orden y un ítem de implícita + gradiente.

---

## T1)

**a)** Enunciá el **teorema de Green** con todas sus hipótesis y deducí a partir de él una fórmula para calcular el área de una región plana mediante una integral de línea.

**b)** Sea $f=(P,Q)\in C^1(\mathbb{R}^2)$ tal que $Q'_x-P'_y=4$ en todo el plano y $f(x,0)=(x^2,\,5x)$. Calculá la circulación de $f$ a lo largo de la semicircunferencia $x^2+y^2=9$, $y\ge 0$, recorrida desde $(3,0)$ hasta $(-3,0)$.



---

## T2)

**a)** V/F, justificando: la función $f(x,y)=\dfrac{xy^2}{x^2+y^2}$ si $(x,y)\ne(0,0)$, $f(0,0)=0$, es diferenciable en $(0,0)$.

**b)** V/F, justificando: $f(x,y)=x^3+y^3-3xy$ no tiene máximos locales.



---

## P1)

Calculá el flujo **saliente** de $f(x,y,z)=\left(xz+y^7,\; yz-\cos x,\; e^{xy}-5\right)$ a través de la frontera del cuerpo $V:\ x^2+y^2\le z\le 4$ contenido en el primer octante.



---

## P2)

Sea $h\in C^1(\mathbb{R})$ y $f(x,y)=\left(x^2+y,\; h(y)+3x\right)$. Calculá la circulación de $f$ a lo largo de la curva $C:\ y=4-x^2$, $y\ge 0$, recorrida desde $(2,0)$ hasta $(-2,0)$.



---

## P3)

**a)** Hallá la línea de campo de $F(x,y)=\left(x,\; x^2+2y\right)$ que pasa por el punto $(1,2)$.

**b)** Hallá $a\in\mathbb{R}$ para que las familias de curvas $y=kx^2$ y $x^2+ay^2=C$ sean ortogonales.



---

## P4)

La ecuación $x^2+yz+z^3=3$ define implícitamente $z=g(x,y)$ en un entorno de $(1,1,1)$.

**a)** Justificá que la define, y hallá la dirección y el sentido de **máximo decrecimiento** de $g$ en $(1,1)$ y el valor de la derivada direccional en esa dirección.

**b)** Escribí la ecuación del plano tangente a la superficie en $(1,1,1)$.



---

## Cómo usar este simulacro

1. **2 horas con reloj**, sin machete ni apuntes. Para rendir usá **`exports/2026-09-26-simulacro-01-enunciados.pdf`** (solo los enunciados). Las correcciones están en `exports/2026-09-26-simulacro-01.pdf`: abrilo recién al terminar.
2. En los primeros 10 minutos elegí los 3 que vas a hacer (uno de T1/T2, dos de P1–P4) con la tabla §0 del machete en la cabeza. Anotá en una línea el camino y la orientación antes de empezar cada uno. Si te sobra tiempo, recién ahí un cuarto.
3. Al terminar, abrí cada corrección y puntuá con el criterio. Aprobado = tres ítems con al menos 7/10.
4. `/registrar` con cada error concreto: tema, qué falló, cómo se corrige.
5. Si el teórico que cayó no fue el tuyo: en un final de 2026 el otro teórico probable es enunciar **Stokes** o **Gauss** con hipótesis (machete §8, T-C y T-D; `repaso/practica-flujo.md` Parte 1 para Gauss).
