# Simulacro 03 — Final (Análisis Matemático II)

> **Duración:** 2 horas. **Estructura:** `T1`, `T2` (teóricos con incisos a/b) y `P1`–`P4`.
> **Aprobación:** tres ejercicios correctamente resueltos, **uno** de T1/T2 y **dos** de P1–P4.
> Justificá todos los pasos. En flujos y circulaciones, **indicá la orientación** elegida.
>
> Tercer simulacro: **seis ítems reales de los finales de 2026, casi textuales**, elegidos entre los
> que no aparecieron en los simulacros 01 y 02. Mismo esqueleto: un teórico con Gauss (el único
> de los tres teoremas que todavía no había caído en un simulacro), el otro con una demostración
> de primer parcial y un V/F, un flujo saliente por Gauss, una circulación por Stokes, la EDO de
> segundo orden del último final y un ítem de cadena + implícita + plano tangente.

---

## T1)

**a)** Enunciá el **teorema de Gauss** (o de la divergencia) con todas sus hipótesis. ¿Es aplicable en forma directa para calcular el flujo de $f=(xy,\ x^2,\ z-3)$ a través de la superficie $x^2-2x+y^2=0$, $-1\le z\le1$? Justificá.

**b)** ¿Es nulo el flujo de $f=(2x,\ z^2+y,\ z-8)$ a través de una esfera de radio $2$? Justificá.



---

## T2)

**a)** Demostrá que si $f:\mathbb{R}^2\to\mathbb{R}$ es diferenciable en $X_0$, entonces $f'(X_0,\check u)=\nabla f(X_0)\cdot\check u$ para todo versor $\check u$.

**b)** V/F, justificando: el plano tangente a $S:\ x^3z+xy-xz^2=-3$ en $(1,-1,2)$ y la recta tangente a $C:\ \lambda(t)=(t^2,\ 2t+1,\ 2t^2)$ en ese mismo punto son perpendiculares.



---

## P1)

Calculá el flujo de $f=(y^2+z^2,\ x^2+z^2,\ z^2)$ a través de la frontera de $V:\ x^2+y^2+z^2\le9$, $x\ge0$, $z\ge0$. Indicá la orientación elegida.



---

## P2)

Calculá la circulación de $g=\big(yz+\operatorname{sen}(x^2),\ 2xz^2+\cos(y^2),\ \operatorname{sen}(z^2)\big)$ a lo largo de la curva $C:\ z=\sqrt{x^2+y^2}\ \cap\ z=6-x^2-y^2$. Indicá la orientación elegida.



---

## P3)

Hallá la solución general de

$$
y''-4y'+4y=25\operatorname{sen}(x).
$$



---

## P4)

Sea $w=u^2\ln(2x-1)$, donde $u=f(x,y)$ está definida implícitamente por $uy+e^{u-x}=2$ en un entorno de $(1,1)$. Hallá la ecuación del plano tangente a la gráfica de $w=h(x,y)$ en el punto $(1,1,w_0)$.



---

## Cómo usar este simulacro

1. Rendilo **cronometrado, 2 horas**, sin apuntes y sin abrir ninguna corrección. Usá el PDF `-enunciados`.
2. En los primeros 10 minutos elegí los 3 que vas a hacer (uno de T1/T2, dos de P1–P4) con la tabla §0 del machete en la cabeza. Anotá en una línea el camino y la orientación antes de empezar cada uno. Si te sobra tiempo, recién ahí un cuarto.
3. Al terminar, abrí cada corrección y puntuá con el criterio. Aprobado = tres ítems con al menos 7/10.
4. `/registrar` con cada error concreto: tema, qué falló, cómo se corrige.
5. Este simulacro son ítems reales: si te quedan dudas, `2026-05-19 P1` y `P3` tienen resolución de cátedra en `examenes/resueltos/2026-05-19_resuelto-sylvina.pdf`, y `2026-02-10 T1` y `P4` en `examenes/resueltos/2026-02-10_resuelto-sylvina.pdf`. Esas resoluciones mandan sobre esta corrección si difieren.
