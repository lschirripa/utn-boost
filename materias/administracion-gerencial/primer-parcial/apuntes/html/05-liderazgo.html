## Generalidades — [p. 48]

### Qué es el liderazgo y por qué no es lo mismo que jefatura

- Definición de **Young**: el liderazgo "representa un dominio fundado en una **personalidad poderosa**, en la **aceptación del grupo** o en **conocimientos pertinentes** en una **situación dada**".
- Por tanto, el liderazgo se relaciona **específicamente con una determinada situación** y **no es lo mismo que jefatura**:
  - la **jefatura es poder formal**;
  - el **liderazgo es "informal"** (no está oficialmente establecido como la jefatura) y está **restringido a un tiempo y lugar**.
- Eso no impide que **a veces el liderazgo coincida con la autoridad formal**.

### Cómo se genera el liderazgo (Harris)

- Una **situación dada crea un imperativo en el grupo**.
- Un **individuo puede hacer conscientes a los demás** de ese imperativo, y así aquéllos **servirán voluntariamente** al imperativo.
- En la medida en que dicho individuo sea capaz de **liberar capacidades colectivas y aptitudes emocionales dirigidas a ese fin, se convertirá en líder**.

### El liderazgo es una función colectiva

- Luego, el liderazgo es una **función colectiva**: **no reside fundamentalmente en el individuo** (por dominante o eficaz que sea) sino **en la situación real**.
- Eso no excluye que el líder deba poseer **ciertas cualidades** (por ejemplo, determinado grado de inteligencia).
- **Ni el líder más poderoso puede extraer del grupo aquello que no se encuentre allí de antemano y que el grupo quiera ceder.**
- Que el líder sea **"elegido" por el grupo** (aunque sea tácitamente) **no asegura que sea el más indicado para dirigirlo**: **sólo significa que representa en la conciencia de los demás los sentimientos y aspiraciones del grupo**.

### Recomendación para las empresas

- Conviene promover para encabezar los departamentos a quienes demuestren **eficiencia funcional** y **aceptación por el grupo**, y no a los que consiguen "ponerse al frente" por su **afán de trepar** en ambientes crudamente competitivos.
- Bajo la apariencia de firmeza y energía, eso suele ser indicio de **inseguridad emotiva** e incluso de **ineptitud**.

## Tipología del liderazgo — [p. 48]

- Clasificación **elemental** de los estilos de liderazgo:
  - **Líderes autócratas:** concentran el **poder y la responsabilidad**, impidiendo de hecho el **desarrollo de los demás**.
  - **Líderes demócratas:** dan **participación**, **orientan**, **delegan** y tienden a obtener **soluciones colectivas**.
- Es una división **muy elemental y esquemática**: en la realidad hay **numerosas variantes**, combinación de ambos caracteres básicos. Ejemplo:
  - **Líderes paternalistas:** bajo su apariencia "democrática" y benevolente, terminan **decidiendo siempre todo por sí mismos**.
- Los distintos estilos de liderazgo se reflejan en los **sistemas de supervisión**, que son en gran medida expresiones de diferentes grados de liderazgo (se ve en detalle en la teoría conductual, más adelante).
- Igual que la motivación, el liderazgo es un tema del comportamiento organizacional investigado a fondo; casi toda la investigación busca responder **"¿qué es un líder efectivo?"**. Hubo una evolución en el abordaje a través de distintas teorías: rasgos → conductuales → contingentes → enfoques emergentes.

**Cómo se genera:**

- El liderazgo se relaciona con una determinada situación y no es lo mismo que una jefatura: la jefatura es poder formal, mientras que el liderazgo es informal y restringido a un tiempo y lugar.
- A veces el liderazgo puede coincidir con la autoridad formal.

**Dónde está en el libro:** p. 48 (Generalidades + Tipología del liderazgo).

## Teoría de los rasgos — [p. 49]

### La búsqueda de rasgos

- Si le preguntás a la persona promedio qué piensa cuando piensa en liderazgo, recibís una lista de cualidades: inteligencia, carisma, decisión, entusiasmo, fortaleza, valor, integridad, confianza en sí mismo. Esas respuestas son, en esencia, las **teorías de los rasgos**.
- La búsqueda de **características específicas que distingan a quienes son líderes de quienes no lo son** dominó los **primeros esfuerzos de investigación** del liderazgo.
- La pregunta: ¿es posible aislar rasgos en personas reconocidas como líderes (Martin Luther King Jr., Juana de Arco, Ted Turner, Nelson Mandela, Margaret Thatcher, Mahatma Gandhi) que no posean quienes no lo son? Aceptamos que son líderes, pero son individuos con **rasgos completamente diferentes**. Si el concepto es válido, debería haber rasgos presentes en **todos** los líderes.

### Los "callejones sin salida"

- Los esfuerzos por aislar esos rasgos dieron muchos **"callejones sin salida"**: los investigadores **no pudieron identificar una serie de rasgos que siempre distinguieran** a los líderes de los seguidores, ni a los líderes efectivos de los que no lo son.
- Tal vez era **demasiado optimista** creer que una serie de rasgos consistentes y únicos pudiera aplicar a todos los líderes efectivos, al mando de **cualquier tipo de organización** (comercial, administrativa del Estado, militar, religiosa, sin fines de lucro, etc.).
- Sin embargo, los intentos por identificar rasgos **consistentemente asociados** con el liderazgo tuvieron **más éxito**: seis rasgos en los que los líderes parecen distinguirse de los no líderes.

### Los 6 rasgos (según Kirkpatrick y Locke) — [p. 49–50]

"Seis características que distinguen a los líderes de quienes no lo son":

1. **Empuje.** Los líderes exhiben un **alto nivel de esfuerzo**: relativamente **alto deseo de logro**, son **ambiciosos**, tienen **mucha energía**, son **incansablemente persistentes** en sus actividades y **muestran iniciativa**.
2. **Deseo de dirigir.** Fuerte deseo de **influir y dirigir a otros**; demuestran **disposición a asumir responsabilidades**.
3. **Honestidad e integridad.** Construyen **relaciones de confianza** con sus subalternos al ser **sinceros o no engañar** y al mostrar **alta consistencia entre su palabra y los hechos**.
4. **Confianza en sí mismos.** Los subalternos ven a sus líderes como **carentes de dudas**; por eso los líderes deben mostrar confianza en sí mismos para **convencer a sus subalternos de lo correcto de las metas y decisiones**.
5. **Inteligencia.** Inteligencia suficiente para **reunir, resumir e interpretar grandes cantidades de información**, y para **generar iniciativas, resolver problemas y tomar las decisiones correctas**.
6. **Conocimiento relativo al trabajo.** Alto grado de conocimiento sobre la **compañía, la industria y cuestiones técnicas**; el conocimiento profundo permite **tomar decisiones bien informadas** y **comprender sus implicaciones**.

### Por qué los rasgos no alcanzan — [p. 50]

- Los **rasgos en sí mismos no son suficientes** para explicar el liderazgo.
- Las explicaciones basadas exclusivamente en rasgos **dejan de lado las interacciones del líder con sus colaboradores** y los **factores situacionales**.
- Poseer las características adecuadas **sólo facilita** que un individuo sea un líder efectivo: **tiene que tomar las acciones debidas**, y **lo que es correcto en una situación no necesariamente lo es en otra**.
- Cronología: aunque hubo un resurgimiento del interés en los rasgos a fines del siglo XX, el movimiento que se aparta de ellas empezó en la **década del '40**. De fines de los '40 hasta mediados de los '60 la investigación se concentró en los **estilos de comportamiento** preferidos por los líderes.

<details>
<summary>Ver respuesta (del compilado)</summary>

**Qué plantea:** características especiales que distinguen a los líderes. Se distinguieron 6 rasgos que los líderes parecen tener:

- **Empuje:** alto nivel de esfuerzo. Alto deseo de logro, son ambiciosos, tienen mucha energía, son persistentes y tienen mucha iniciativa.
- **Deseo de dirigir:** disposición a asumir responsabilidades.
- **Honestidad e integridad:** construyen relaciones de confianza entre ellos y sus subalternos al no engañarlos y mostrar consistencia entre sus palabras y los hechos.
- **Confianza en sí mismos:** convencer a los subalternos de lo correcto de las metas y decisiones.
- **Inteligencia:** inteligencia para reunir, resumir e interpretar mucha información, y ser capaces de generar iniciativas, resolver problemas y tomar decisiones correctas.
- **Conocimiento relativo al trabajo.**

**Por qué no alcanza:**

- No se encontraron los rasgos certeros que definen a un líder porque no todo aplica para los distintos tipos de organizaciones.
- Dejan de lado la interacción del líder con sus subordinados, así como los factores situacionales.

</details>

**Ojo (libro, p. 50):** el libro agrega que tener los rasgos **sólo facilita** ser líder efectivo: hay que **tomar las acciones debidas**, y lo correcto en una situación no lo es en otra. Los seis rasgos son de **Kirkpatrick y Locke**.

**Dónde está en el libro:** p. 49–50 (Teoría de los Rasgos).

</details>

## Teorías conductuales — [p. 50]

- La **imposibilidad de "encontrar oro en la mina de los rasgos"** llevó a los investigadores a buscar los **comportamientos** que exhiben líderes específicos: ¿hay algo único en lo que los líderes efectivos **hacen**?
- Se esperaba que las teorías del comportamiento dieran **respuestas más definitivas** y, de tener éxito, **implicaciones prácticas muy diferentes**:
  - si la investigación de los **rasgos** hubiera tenido éxito → base para **seleccionar** a las personas "correctas" para el liderazgo formal;
  - si los estudios del **comportamiento** encontraran determinantes decisivas → se podría **entrenar** a las personas para ser líderes.
- Uno de los primeros y más populares estudios sobre estilos de comportamiento: **Universidad de Iowa (EE. UU.), Kurt Lewin y colegas**.

### El continuo autocrático-democrático — [p. 50–51]

**El estudio de Lewin (Iowa):** tres comportamientos o estilos de liderazgo.

- **Autocrático:** líder que tiende a **centralizar la autoridad**, **dicta métodos de trabajo**, toma **decisiones unilaterales** y **limita la participación** de los colaboradores.
- **Democrático:** dirigente que tiende a **involucrar a los colaboradores en la toma de decisiones**, **delegar la autoridad**, **alentar la participación** en la decisión de métodos y metas de trabajo y **emplear la retroalimentación** como oportunidad para guiar a los colaboradores.
- **Laissez-faire:** otorga al grupo **libertad completa** para tomar sus decisiones y completar el trabajo como mejor le parezca; sus comportamientos se limitan a **proporcionar los materiales necesarios** o **contestar preguntas**.

**¿Cuál es el más efectivo?** Para contestarlo, entrenaron a adultos que dirigían grupos de jóvenes de clubes infantiles en cada estilo:

- El **laissez-faire fue inefectivo en todos los criterios** de desempeño frente al democrático y al autocrático.
- La **cantidad de trabajo** fue la **misma** en grupos autocráticos y democráticos.
- La **calidad del trabajo** y la **satisfacción del grupo** fueron **más altas en los democráticos**.
- Los resultados parecen indicar que el estilo democrático puede contribuir a la cantidad y calidad del trabajo... pero **no era tan simple**.

**Estudios posteriores:** resultados **variados**.

- El democrático a veces produjo **más desempeño** que el autocrático, pero otras veces un desempeño **inferior o apenas igual**.
- Resultados **más consistentes** al medir **satisfacción de los colaboradores**: normalmente **mayor bajo liderazgo democrático**.
- Preguntas que quedan: ¿los gerentes siempre deben ser democráticos? ¿Qué pasa con los gerentes no acostumbrados a que sus colaboradores decidan?

**El continuo de Tannenbaum y Schmidt:** Robert Tannenbaum y Warren H. Schmidt estudiaron ese dilema (básicamente respecto de la **toma de decisiones**) y desarrollaron un **continuo de comportamientos de líder** (Ilustración 9).

- **Ilustración 9 — El continuo autocrático-democrático (descripción):** un rectángulo cortado por una **diagonal** que sube de izquierda a derecha. El triángulo **superior-izquierdo** es el **"Empleo de la autoridad por el gerente"**; el triángulo **inferior-derecho** es el **"Área de libertad para los colaboradores"**. A la **izquierda** el gerente usa casi toda la autoridad y los colaboradores casi no tienen libertad (estilo **centrado en el jefe, autocrático**); a medida que uno se mueve hacia la **derecha**, la autoridad del gerente se achica y crece la libertad de los colaboradores (estilo **centrado en los colaboradores, democrático**). Debajo hay **cinco flechas verticales** que marcan posiciones intermedias posibles a lo largo del continuo: no hay dos estilos, hay un **rango** de comportamientos.
- Para decidir **qué comportamiento del continuo emplear**, los gerentes deben observar tres fuerzas:
  - sus **fuerzas internas** (p. ej., la comodidad con la alternativa elegida);
  - las **fuerzas internas del colaborador** (p. ej., la disposición a asumir responsabilidades);
  - las **fuerzas internas de la situación** (p. ej., presiones de tiempo).
- Sugieren, sin embargo, que los gerentes deben dirigirse **a la larga hacia estilos más centrados en los colaboradores**, por la influencia positiva sobre la **motivación de los empleados, la calidad de las decisiones, el trabajo en equipo, el clima y el desarrollo de los empleados**.

**Naturaleza dual del comportamiento del líder** [p. 52]: hacer énfasis **en el trabajo a realizar** y **en las personas del grupo**. Es también la característica clave de las otras dos teorías conductuales (Ohio y Michigan).

### Otros estudios — [p. 52]

- **Universidad Estatal de Ohio:** buscó identificar **dimensiones independientes** del comportamiento y definió como principales:
  - la **estructura**: grado en que el líder **estructura su papel y el de sus colaboradores**;
  - la **consideración**: grado de **confianza mutua** y de **respeto por las ideas y sentimientos** de los colaboradores.
  - Relacionando esas dimensiones sugirieron los estilos de liderazgo más convenientes.
- **Universidad de Michigan:** otras dimensiones según el énfasis del líder: **orientación a los empleados** u **orientación a la producción**.
- Esta visión es similar al famoso **"Grid (grilla) gerencial" de R.R. Blake y J.S. Mouton**: dos variables determinantes, la **preocupación por los empleados** y la **preocupación por la producción**, de cuyo cruce resultan **cinco estilos básicos** y numerosos estilos intermedios (el Grid se ve en profundidad en la electiva "Gestión del Cambio Organizacional").

## Teorías contingentes — [p. 52]

- Era evidente que **ni los rasgos personales del líder ni sus comportamientos permitían predecir su éxito**.
- Por eso los nuevos estudios se guiaron por la **Teoría de la Contingencia** (estudiada en capítulos anteriores del libro), intentando **relacionar el estilo de liderazgo con variables "independientes" de la situación de trabajo**.
- Consecuencia: la **efectividad del líder dependería de proceder adecuadamente a las condiciones reinantes**.
- Se desarrollaron varios enfoques; el libro explica los de mayor reconocimiento y aparente éxito: la **teoría situacional de Hersey y Blanchard** y la **"teoría de la ruta-meta"**.
- **Esquema para las preguntas "¿es contingente y por qué?":** una teoría de liderazgo es contingente cuando el **estilo de liderazgo a adoptar (variable dependiente)** se hace depender de **variables independientes de la situación de trabajo**; no hay un único mejor estilo, sino el que corresponde a las condiciones reinantes. En la situacional, la variable independiente es el **grado de desarrollo (motivación y capacidad) del colaborador** [p. 54]; en la ruta-meta, los **factores ambientales** y los **factores del colaborador** [p. 54].

### La teoría situacional (Hersey y Blanchard) — [p. 52–53]

**Qué plantea**

- El liderazgo situacional es una **teoría de contingencia que hace énfasis en los subalternos**.
- El liderazgo de éxito se alcanza al **seleccionar el estilo de liderazgo adecuado**, que Hersey y Blanchard sostienen **es contingente a la conjunción de**:
  - la **capacidad para desempeñar las tareas específicas del puesto**, y
  - la **disposición de los colaboradores para cumplirlas**.
- La teoría **no se ha sometido a evaluaciones extensas** para probar su validez, pero se la incluye por su **amplia aceptación**.

**Por qué el énfasis en los subalternos**

- Refleja que **son ellos quienes aceptan o rechazan al líder**.
- **Sin tomar en cuenta lo que el líder haga, la efectividad depende de las acciones de sus subalternos.**
- Esta dimensión fue **sobrevaluada** por algunas teorías del liderazgo y **subestimada** por otras.
- **Disposición** = la **capacidad y propensión de las personas para asumir la responsabilidad de dirigir su propio comportamiento**.

**Las dos dimensiones del comportamiento del líder**

1. Hacia el **eficaz cumplimiento de las tareas**: **capacitando y entrenando**.
2. Hacia la **intensidad del apoyo** que brinde al colaborador a través de sus **relaciones interpersonales**: **estimulando y motivando**.

- Varios autores plasmaron esta concepción en clasificaciones, tablas y gráficos sobre la **madurez de los colaboradores** y los **comportamientos adecuados del líder**: los de **Hersey y Blanchard** se explican en la obra de **Robbins y Coulter**; la visión de **Blanchard, Zigarmi y Zigarmi** es muy similar.

**Ilustración 10 — La teoría situacional (descripción)**

- Bloque superior, **"Acción del líder"**: un gráfico con **eje vertical "Comportamiento de relación"** (apoyo) y **eje horizontal "Comportamiento rector"** (dirección/tareas). Sobre él va una **curva con forma de campana** (arranca abajo a la izquierda, sube hasta un máximo en el centro y vuelve a bajar a la derecha). Líneas punteadas dividen el gráfico en **cuatro columnas** y en la curva hay **cuatro puntos**, uno por columna, de izquierda a derecha: **DELEGAR** (abajo a la izquierda: poca relación, poca dirección), **APOYAR** (alto: mucha relación, dirección baja-media), **INSTRUIR** (alto: mucha relación, dirección media-alta) y **DIRIGIR** (abajo a la derecha: poca relación, mucha dirección).
- Bloque inferior, **"Situación del colaborador"**: una tabla alineada con las mismas cuatro columnas.
  - Fila "Respuesta hacia las tareas": ALTA · ALTA · BAJA · BAJA.
  - Fila "Respuesta hacia las relaciones": ALTA · BAJA · BAJA · ALTA.
  - Filas de madurez: CAPACITADO + DISPUESTO (bajo DELEGAR) · CAPACITADO + NO DISPUESTO (bajo APOYAR) · NO CAPACITADO + NO DISPUESTO (bajo INSTRUIR) · NO CAPACITADO + DISPUESTO (bajo DIRIGIR).
- Lectura: la **situación del colaborador** (capacidad × disposición) determina la **acción del líder**; a medida que el colaborador madura, el líder recorre la curva de derecha a izquierda: dirigir → instruir → apoyar → delegar.

### Los 4 estilos situacionales: dirigir / instruir / apoyar / delegar — [p. 53]

Para el autor de la teoría, los términos dispuestos respecto de la acción que debe tomar el líder en cada situación tienen un significado bien determinado:

- **DIRIGIR:** implica **estructurar, controlar y supervisar**.
  - Vale para las personas que **carecen de competencia, pero tienen interés y entusiasmo**.
  - Necesitan **directivas y supervisión** para iniciarse en su cometido.
- **INSTRUIR:** **orientar y ayudar**.
  - Sirve para las personas que **poseen alguna competencia, pero les falta interés**.
  - Necesitan **dirección y supervisión** porque todavía son relativamente novatas, y también **apoyo y elogios** para forjarse su autoestima, así como **intervenir en las decisiones** para restaurar su interés.
- **APOYAR:** **elogiar, escuchar y dar facilidades**.
  - Es lo que se debe hacer con quienes **poseen competencia, pero carecen de seguridad en sí mismos o de motivación**.
  - No necesitan que se les ordenen muchas cosas (ya saben lo que deben hacer), pero conviene **ayudarles a reforzar su seguridad y su motivación**.
- **DELEGAR:** **traspasar la responsabilidad de las decisiones cotidianas**.
  - Es lo que procede con el personal que **tiene competencia, así como interés**.
  - Son capaces de **trabajar por cuenta propia** en un proyecto, bajo **escasa supervisión** y sin pedir ayuda, y están dispuestos a hacerlo.

Resumen estilo ↔ colaborador:

| Estilo | Qué hace el líder | Competencia del colaborador | Interés / motivación del colaborador |
|---|---|---|---|
| Dirigir | estructurar, controlar, supervisar | carece | tiene interés y entusiasmo |
| Instruir | orientar y ayudar | alguna | le falta interés |
| Apoyar | elogiar, escuchar, dar facilidades | tiene | le falta seguridad o motivación |
| Delegar | traspasar las decisiones cotidianas | tiene | tiene interés |

### Opinión del autor: por qué la situacional es contingente — [p. 54]

- El autor coincide en general con los autores citados, a partir de su adhesión al **"enfoque de contingencias"**: **"No existe una única manera de mejor organizar..."**.
- En la Teoría Situacional del liderazgo:
  - la **variable contingente independiente** es el **grado de desarrollo (motivación y capacidad) del colaborador**;
  - la **variable dependiente** es el **comportamiento del superior**.
- **Discrepancia del autor:** la **forma de la curva** con que se grafica el "proceso de desarrollo" (Ilustración 10) puede llevar a confusiones. Al tomar la forma de la **"campana de Gauss"** (distribución normal), podría sugerir que **la mayoría del personal está en un nivel mediano de desarrollo**, con una minoría en el extremo de **baja madurez** y otra minoría en el de **alto desarrollo**, cosa que no tiene por qué ser así.

### Teoría de la ruta-meta (House) — [p. 54]

**Qué es**

- En la actualidad es **uno de los enfoques más respetables** para comprender el liderazgo.
- Es un **modelo de contingencia del liderazgo** que utiliza, entre otros elementos, la **teoría motivacional de las expectativas**.
- Según su creador, **Robert House**, la teoría es principalmente sobre el **comportamiento de un supervisor sobre una persona en base a una tarea**.
- **Lo que NO abarca:** el liderazgo de toda la organización, los líderes emergentes o informales, el efecto de los líderes en distintos niveles de la organización, ni el comportamiento de los líderes en relación con los cambios.

**Esencia y origen del nombre**

- La esencia: el **rol del líder es apoyar a sus subalternos para alcanzar sus metas**, y **proporcionar la dirección necesaria y/o el apoyo** para asegurarse de que **sus metas sean compatibles con los objetivos generales del grupo o de la organización** (en el capítulo "Cultura de la Organización" el libro llama a esto **"implicación" o "involucración"**).
- El término **"ruta-meta"** deriva de la creencia de que los **líderes efectivos esclarecen el camino** para ayudar a sus subalternos a ir **desde donde se encuentran hasta la consecución de las metas de su trabajo**, y a que **la jornada por el camino sea más fácil al reducir obstáculos y dificultades**.

**Por qué es contingente: variable dependiente y factores contingentes**

- Como es una teoría de la contingencia, hay **uno o varios factores contingentes** en base a los cuales tenemos una **variable dependiente**.
- **Variable dependiente** (la que se adapta): el **tipo de liderazgo a implementar en cada situación**.
- **Variables contingentes (independientes)**, en dos grupos:
  - **Factores ambientales:** estructura de las tareas · sistema de autoridad formal · grupo de trabajo.
  - **Factores del colaborador:** autocontrol · experiencia · habilidad.

**Cuándo el comportamiento del líder es aceptable y motivante**

- El comportamiento del líder es **aceptable** para sus colaboradores en la medida en que lo vean como **fuente inmediata de satisfacción** o como **medio para satisfacción futura**.
- Es **motivante** en la medida en que:
  1. hace que la **satisfacción-necesidad del colaborador sea contingente a un desempeño efectivo**, y
  2. proporciona la **asesoría, guía, apoyo y recompensas** necesarias para un desempeño efectivo.

### Los 4 comportamientos de liderazgo e Ilustración 11 — [p. 54–55]

Para poner a prueba esas afirmaciones, se identificaron **cuatro comportamientos de liderazgo**:

- **Líder director:** permite que sus colaboradores **sepan qué se espera de ellos**, **programa el trabajo** a realizar y proporciona una **guía específica de cómo cumplir las tareas**.
- **Líder apoyador:** es **amistoso** y muestra su **interés por las necesidades** de los colaboradores.
- **Líder participativo:** **consulta** con sus colaboradores y **considera sus sugerencias** antes de tomar una decisión.
- **Líder orientado a logros:** establece **metas desafiantes** y espera que los colaboradores se desempeñen a su **más alto nivel**.

**Ilustración 11 — Teoría de la ruta-meta (descripción):** un diagrama de cuatro cajas.

- A la **izquierda**, la caja **"Líder"** con los cuatro comportamientos: Director · Apoyador · Participativo · Orientado a logros.
- A la **derecha**, la caja **"Objetivos"**.
- Una **flecha horizontal grande** va del Líder a los Objetivos (el líder esclarece la ruta hacia la meta).
- **Arriba**, la caja **"Factores ambientales"** (Estructura de las tareas · Sistema de autoridad formal · Grupo de trabajo) con una **flecha hacia abajo** que incide sobre la flecha Líder → Objetivos.
- **Abajo**, la caja **"Factores del colaborador"** (Autocontrol · Experiencia · Habilidad) con una **flecha hacia arriba** que incide sobre la misma flecha.
- Lectura en términos de contingencia: las dos cajas laterales (ambiente y colaborador) son las **variables contingentes independientes**; el estilo que el líder elige para llegar a los objetivos es la **variable dependiente**.

### Flexibilidad del líder y cuándo su comportamiento es ineficaz — [p. 55]

- La ruta-meta supone que **los líderes son flexibles**: **el mismo líder puede manifestar cualquiera de los cuatro estilos**, dependiendo de la situación.
- El comportamiento del líder será **ineficaz**:
  - cuando resulta **redundante con las fuentes de estructura ambiental** (estructura de la tarea, sistema formal de autoridad, grupo de trabajo), o
  - cuando es **incongruente con las características del colaborador** (control de sí mismo, experiencia, habilidad percibida).

## Enfoques emergentes sobre liderazgo — [p. 55]

### Teoría del liderazgo carismático — [p. 55–56]

- Afirma que los colaboradores **atribuyen capacidades de liderazgo heroicas o extraordinarias** cuando observan **ciertos comportamientos**.
- Los estudiosos tratan de identificar **qué comportamientos diferencian** a los líderes carismáticos de los no carismáticos.
- **Robert House** (el mismo de la ruta-meta) identificó **tres características**:
  - **confianza elevada extrema**;
  - **carácter dominante**; y
  - **fuerte convicción en sus creencias**.
- **Efecto sobre los subalternos:** un grupo creciente de investigaciones muestra **correlaciones impresionantes** entre liderazgo carismático y **alto desempeño y satisfacción**. Quienes trabajan para líderes carismáticos están motivados a hacer un **esfuerzo adicional** y, como tienen agrado por sus líderes, expresan **mayor satisfacción**.
- **Límites:** no siempre da ese resultado. Tal vez sea más apropiado cuando la tarea tiene un **alto componente de adhesión ideológica** (p. ej., las organizaciones que **A. Etzioni** tipifica como **"normativas"**). Eso explica por qué los líderes carismáticos surgen más en **política, religión o empresas en crisis** que amenaza su existencia.
- **Desaparecida la crisis**, el líder carismático puede convertirse en una **carga** para la organización: su confianza en sí mismo exagerada o abrumadora le **impide escuchar a los demás**, se siente **incómodo cuando lo desafían** y desarrolla una **creencia injustificada y empedernida** en su visión "correcta" de los problemas.

### Liderazgo transaccional y transformacional — [p. 56]

- La rama final: el interés reciente por **diferenciar a los líderes transformacionales de los transaccionales**. Como los transformacionales **también son carismáticos**, hay cierta superposición con el liderazgo carismático.
- **Líderes transaccionales:** la mayor parte de las teorías presentadas hasta acá se refieren a ellos. **Guían o motivan a sus subalternos hacia las metas establecidas al esclarecer los requerimientos de roles y tareas**.
- **Líderes transformacionales:** **inspiran a sus seguidores a trascender sus intereses personales por el bien de la organización** y tienen un **efecto profundo y extraordinario** en sus subalternos (ejemplos del libro: Leslie Wexner de The Limited, Herb Kelleher de Southwest Airlines, Bill Gates de Microsoft). Ellos:
  - prestan atención a las **inquietudes y necesidades de desarrollo** de sus seguidores **en lo individual**;
  - **cambian la percepción de los problemas** de sus subalternos, ayudándolos a ver los antiguos problemas de una nueva forma;
  - son capaces de **emocionar, despertar e inspirar** a sus seguidores para un **esfuerzo adicional** que permita alcanzar las metas del grupo.
- **No son enfoques opuestos:** el transformacional **se levanta por encima** del transaccional y produce **niveles de esfuerzo y desempeño que van más allá** de lo que daría un enfoque transaccional exclusivamente.
- **Transformacional > carisma:** el líder puramente carismático puede querer que sus subalternos adopten su visión del mundo y no vayan más allá; el transformacional intenta infundir en sus seguidores la **capacidad de cuestionar** no sólo los puntos de vista establecidos, sino eventualmente **los establecidos por el propio líder**.
- **Evidencia (abrumadora) a favor del transformacional:**
  - estudios entre **oficiales militares** estadounidenses, canadienses y alemanes: los transformacionales son evaluados como **más efectivos** a todo nivel;
  - los gerentes de **Federal Express** con más liderazgo transformacional (según sus subalternos) fueron evaluados por sus superiores como de **alto desempeño** y con **mayor probabilidad de ser promocionados**;
  - en suma: el transformacional está más correlacionado con **índices de rotación más bajos, mayor productividad y más alta satisfacción** de los empleados.
