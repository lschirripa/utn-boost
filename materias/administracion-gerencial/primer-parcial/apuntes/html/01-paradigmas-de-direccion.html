## Origen y evolución de las organizaciones a partir de la 2da. fase de la Revolución Industrial — [p. 7]

### Dos factores: tecnología y cultura — [p. 7]

- La Administración, en sentido amplio, acompañó siempre a la sociedad humana; acá se
  la toma como **disciplina científica que provee la herramienta para manejar
  organizaciones complejas**. En esa acepción restringida, empieza a tomar importancia
  y las características actuales **a partir del último tercio del siglo XIX**.
- Su evolución fue determinada principalmente por **dos factores de influencia
  recíproca: la tecnología y la cultura**.
- Nuestros modos de pensar y valores sociales derivan en gran parte de la dependencia y
  preocupación por la ciencia y la tecnología → «el predominio de… la **racionalidad**
  como forma de pensamiento» (S. Cotgrove). «Las organizaciones modernas se sostienen
  por sistemas de creencias que realzan la importancia de la racionalidad» (Gareth
  Morgan).
- Pero la «racionalidad técnica» presupone que la racionalidad de una línea de acción
  sólo puede probarse por medios científicos, y omite que **la racionalidad también
  puede juzgarse con criterios basados en los valores** (Elliot, David y Ruth).
- Tesis del capítulo: los **valores vigentes en las organizaciones fueron influidos
  históricamente por las técnicas y sistemas de producción**, y éstos a su vez se
  modificaron por el influjo de nuevas creencias y valores de la sociedad.

### La Segunda Revolución Industrial (1880–1920) y los rasgos de la gran empresa — [p. 7]

- Entre **1880 y 1920** se da la «Segunda Revolución Industrial»: cambios fundamentales
  en el sistema económico. El **capital financiero** se expande y crea concentraciones
  de gran magnitud en combinación con el **capital industrial**; a la vez, progresos
  tecnológicos importantes crean un marco propicio para la expansión continua de esas
  concentraciones.
- La nueva estructura de producción, **la gran empresa**, se usa como instrumento para
  **eliminar la competencia e implantar control monopólico** en los mercados y obtener
  las máximas utilidades.
- La gran empresa se caracterizó en su comportamiento productivo por estos rasgos:
  - El **imperio de la planificación detallada del trabajo y del sistema de puestos**
    sobre la iniciativa y habilidades del operario individual.
  - La promoción de la **máxima división del trabajo** como medio, entre otros
    objetivos, de **bajar el nivel de calificación** de los operarios y aumentar así la
    oferta potencial de mano de obra.
  - El **uso masivo de fuerzas de trabajo no desarrolladas** (mujeres y niños), en
    concordancia con lo anterior.
  - El empleo de **sistemas de incentivos** para promover una respuesta adecuada del
    operario al aumento del ritmo e intensidad de la tarea, **sin costos adicionales**
    para la empresa.
  - La **selección de las innovaciones técnicas** y la orientación de la investigación
    tecnológica según la lógica económica de una empresa que actúa en condiciones
    **monopólicas u oligopólicas**.

### La respuesta de la dirección científica a la gran empresa — [p. 8]

La gran empresa necesitaba una tecnología renovada y adecuada a su naturaleza y
objetivos; la respuesta tecnológica global se la dio en ese momento la **dirección
científica**, cuyas formulaciones fueron respondiendo a sus problemas principales:

- **La concepción mecanicista del operario** (creada arbitrariamente) para responder a
  la programación detallada de la gran empresa, transformándola en un **sistema estable
  de funciones donde el elemento humano no fuera un factor insustituible**. El hombre es
  un **recurso de producción cuya actividad puede programarse por anticipado** hasta en
  sus mínimos detalles; su comportamiento se explica en un esquema simple de
  **acción-reacción** (acciones = planes fijados y órdenes específicas; reacciones = sus
  respuestas en trabajo, ajustadas estrictamente a lo ordenado). Así la administración
  científica creó una estructura con **certeza total sobre el comportamiento del
  hombre**, que al ser una constante es **fácilmente intercambiable** y cumple la
  función de llenar las descripciones de puestos preparadas por los programadores.
- **La división del trabajo** (Pfiffner y Sherwood): el movimiento pro-administración
  científica inspirado por Taylor tuvo como principal objetivo dividir el trabajo en
  sus partes; **desmenuzamiento del trabajo en labores tan pequeñas** que los obreros
  pasaban toda la jornada ejecutando una sola operación repetida. Llegaron incluso a
  una **concepción naturalista de la división del trabajo, físico y mental**.
- **La concepción formalista de la empresa** (administración tradicional): la
  **estructura formal es la única existente**; la autoridad tiene como única fuente esa
  estructura, y las líneas de autoridad y comunicación están rígidamente jerarquizadas.
- **La concepción hedonista de la motivación** (tradicionalismo): el operario es un
  ***homo economicus*** cuya base motivacional es el dinero, con relación directa entre
  remuneración y productividad. Para aumentar la productividad sin aumentar costos,
  crea los **sistemas de incentivos**.

La gran empresa integró rápidamente estas conclusiones del tradicionalismo, que
conformaban (G. Friedmann) «un sistema que aumenta la eficiencia del utillaje y de la
mano de obra, que tiende al rendimiento máximo e inmediato de una y otra, y prefiere el
éxito económico al bienestar físico y mental del obrero»: eran las respuestas adecuadas
a las necesidades de la gran empresa de la época.

## Evolución de los paradigmas en la dirección — [p. 8]

- **Paradigma** (Edgar Morin, nota al pie): «está constituido por un cierto tipo de
  relación lógica extremadamente fuerte entre nociones maestras, nociones clave,
  principios clave. Esa relación y esos principios van a gobernar todos los discursos
  que obedecen, inconscientemente, a su gobierno».
- En el cuerpo del texto (p. 7) se los define como **relaciones fuertes entre nociones y
  principios, que dominan nuestros actos**.
- El capítulo recorre tres paradigmas: **mecanicismo**, **organicismo** y **teoría de
  la contingencia**, y cierra con las **nuevas tendencias**.

---

## Mecanicismo — [p. 8]

### De la mecanización a la organización como máquina — [p. 8]

- Los dispositivos mecánicos se desarrollaron para ayudar a realizar actividades con un
  fin y para aplicar más a fondo el principio de **división del trabajo**, que supone
  **mayor especialización** en la ejecución de las tareas y, por lo tanto, **mayor
  velocidad, mayor precisión y menor costo**.
- Con la Revolución Industrial aparece la **mecanización**: traslada a la máquina los
  movimientos repetitivos del hombre, aumentando su productividad.
- Muchas organizaciones modernas se diseñaron **como máquinas**, esperando que sus
  empleados se comporten como **piezas de la máquina**: componentes aceitados, precisos,
  absolutamente coordinados y eficientes.
- Raíces en la **organización militar prusiana**: ejército altamente especializado,
  **verticalista, estandarizado, con elementos fácilmente reemplazables**; rangos,
  uniforme, **lenguaje de órdenes** y especialización de tareas. Del terreno militar
  sale también la **separación entre funciones de mando y de asistencia**.
- La nueva tecnología vino acompañada por la **mecanización del pensamiento y de la
  acción humana**. Con las máquinas en la producción, las viejas maneras de distribuir
  el trabajo quedaron ineficientes: hacia fines del siglo XIX y comienzos del XX se
  buscó elevar el rendimiento de los operarios con nuevos principios y métodos para
  aumentar la producción y las ganancias.
- **Característica de estas organizaciones:** trabajar **tan exactamente como sea
  posible a través de patrones de autoridad**, es decir, en términos de responsabilidad
  de los trabajos y del **derecho a dar órdenes y exigir una exacta obediencia**. Esos
  patrones actúan como «puentes de resistencia» que limitan las actividades en una
  dirección y las potencian en otra.
- El nombre **«Mecanicismo»** se lo dieron años después los investigadores del
  **Instituto Tavistock (Londres)**: alude metafóricamente a que sus propulsores **ven a
  la organización como a una máquina**.

### El «Taylorismo»: supuestos, principios y medidas — [p. 9]

- Primer exponente notable: **Frederick W. Taylor**, ingeniero de una de las mayores
  empresas industriales de EE. UU. a fines del siglo XIX, que implantó una concepción
  entonces totalmente nueva de la organización del trabajo fabril: la
  **«Administración científica»**.
- **Supuesto de base:** las empresas sufrían «enormes pérdidas» causadas por la
  **ineficiencia del trabajo humano**, cuyas razones serían:
  - La **deliberada lentitud** del personal.
  - El **carácter de los obreros** (holgazanes e ineptos).
  - La **falta de métodos racionales de trabajo**, por culpa de los propios empresarios.
  - El **error de los empresarios** al creer en la capacidad e iniciativa de los
    trabajadores, que no están bien dotados para ello.
  - El **desaprovechamiento de la ambición personal** de los trabajadores, que debería
    estimularse con **incentivos económicos** (rechazaba, por lo tanto, los acuerdos o
    regulaciones de salarios).
- **Principios, fiel expresión del paradigma mecanicista:**
  - Se concibe el **comportamiento de la empresa** como totalmente ajustado a lo
    previsto en su **organización formal** (la oficialmente establecida).
  - Se concibe el **trabajo de los operarios** como una **ejecución mecánica y sin
    desvíos** de las instrucciones y programas que se les indique.
  - Se plantea la **división del trabajo** en rotundos términos de separación entre el
    **trabajo intelectual y el trabajo manual**.
  - Se concibe al **trabajador guiado por su interés económico**, con exclusión de
    cualquier otra motivación.
- **Medidas que creó, recomendó y llevó a la práctica** (básicamente):
  - La **organización del trabajo del obrero es exclusiva facultad y responsabilidad
    del directivo**: un sector de la empresa programa hasta el menor detalle; el otro
    ejecuta sin desvío alguno, y los «ejecutores» deben llegar a la **máxima
    fragmentación y especialización repetitiva**.
  - Utilizar **métodos científicos** para determinar el modo más eficiente de realizar
    el trabajo.
  - **Seleccionar al personal más adecuado** a cada trabajo, diferenciando a los
    «intelectuales» de los «ejecutores mecánicos».
  - **Instruir al trabajador** para hacer el trabajo eficientemente, conforme a
    **estudios de movimientos y tiempos, fichas de instrucciones precisas, estudios de
    costos, planeamiento**; todo tendía a mecanizar el trabajo humano para lograr «la
    máxima cantidad de trabajo propia de un operario de primera». Taylor afirmaba que
    para cada tarea había que determinar ***«the one best way»*** (la única y mejor
    forma).
  - **Controlar el rendimiento** de los trabajadores para asegurar que siguieron los
    procedimientos y se lograron los resultados esperados.
  - **Aplicar incentivos económicos:** el estímulo económico es el medio principal de
    la política de personal; su objeto es **generar competencia entre los obreros**
    aprovechando su supuesta «ambición». Pero el sistema evitaba que el monto se elevase
    mucho, y recomendaba **«usar el trato duro»** cuando fuese necesario.

### Resistencia, éxito y las dos etapas del taylorismo — [p. 10]

- Encontró **gran resistencia** de obreros y científicos, y hasta del **Congreso de
  EE. UU.**, que en un momento **prohibió su aplicación** (aunque las empresas, más o
  menos encubiertamente, lo apoyaban). También se aplicó en **Inglaterra, Francia y
  Alemania**.
- Pese a las críticas, **tuvo éxito** porque era la tecnología que necesitaban las
  **grandes corporaciones monopolistas en ascenso** (comienzos del siglo XX).
- Ejemplo actual: los **comercios de comida rápida**, donde los empleados tienen
  aprendido hasta el último detalle. Directivos y analistas **«piensan»**; los empleados
  **«hacen»**.
- **Dos etapas** luego de su creación:
  1. Alrededor de **1910**, con la **«producción en cadena» en la fábrica Ford**, se
     fusiona en el **«Taylorismo-Fordismo»**, que lo puso en el centro de los modelos de
     administración de la producción, influyó decisivamente en la cultura empresarial
     mundial y **maximizó la tasa de ganancia** de las empresas.
  2. Su **profunda crisis a fines de los '70**, superado por otras técnicas de
     dirección ante la **caída mundial de la tasa de ganancia**.

### La burocracia (Max Weber) y la Teoría Clásica (Fayol) — [p. 10]

- El trabajo organizado con estos principios se vuelve **tan rutinario como la precisión
  de un reloj**: llegar a una hora, cumplir un conjunto de funciones, descansar en las
  horas señaladas, resumir las tareas y listo.
- A las organizaciones **diseñadas y operadas como máquinas** (sea cual sea su
  actividad) se las llama **burocracias**. El nombre viene del sociólogo alemán **Max
  Weber**, que observó el paralelismo entre la **mecanización de la industria** y la
  **proliferación de formas burocráticas**: la burocracia vuelve rutinarios los
  **procesos de administración**, como la mecanización lo hace con los de producción.
- **Primera definición concreta de burocracia** (Weber): forma de organización que
  realza la **precisión, la velocidad, la claridad, la regularidad, la exactitud y la
  eficiencia**, conseguidas a través de la **división prefijada de las tareas, la
  supervisión jerárquica y detalladas reglas y regulaciones**.
- Muchas organizaciones se burocratizan en algún grado por el **factor cultural**: el
  modo mecanicista de pensamiento que conforma nuestro concepto básico de organización.
- **Morgan:** los principios burocráticos son básicos tanto para las **burocracias
  centralizadas** como para la **organización fraccionada** (varias unidades
  semiautónomas bajo una autoridad superior). Esa descentralización sigue siendo
  ineficiente para tomar decisiones apresuradas, así que hubo que **conciliar
  centralización y descentralización**: de ahí técnicas como la **administración por
  objetivos** y sofisticados sistemas de gestión para el control «de arriba hacia
  abajo». Así, «las teorías clásicas de la organización se refuerzan con la apariencia
  de una invención moderna».
- **Para Weber**, la burocracia es una forma de organización **completamente racional**
  y con la mayor posibilidad de eficiencia administrativa en cualquier sistema
  económico: la **configuración óptima para toda organización**. Pero también reconoció
  sus **consecuencias sociales**: el potencial de **mecanizar y convertir en rutina cada
  aspecto de la vida humana**, erosionando el espíritu y la capacidad de acción
  espontánea.
- La **«Teoría Clásica de la Organización»**, donde se inscriben los principios
  generales de administración de **Henry Fayol**, también responde a este paradigma:
  «la característica de la organización estructurada es trabajar tan exactamente como
  sea posible, a través de patrones de autoridad». Esto **no invalida la importancia
  que tuvieron, y aún tienen,** esos principios en la construcción formal de las
  organizaciones modernas.

### Crítica del mecanicismo: cuándo funciona y limitaciones — [p. 11]

- La esencia de la mecanización: **reducir los procesos complejos a un conjunto de
  movimientos separados** que pueden reproducirse mecánicamente. Llegará a su máxima
  expresión cuando los **robots** sean la principal fuerza productiva y las
  organizaciones puedan, literalmente, ser máquinas.
- Las ventajas y limitaciones se distinguen ni bien pensamos a las organizaciones como
  máquinas. Según **Gareth Morgan**, las organizaciones mecanicistas **funcionan bien
  cuando**:
  - Existe una **tarea lineal** para realizar.
  - El **entorno asegura** que el producto realizado será el esperado.
  - Se desea producir **exactamente el mismo producto una y otra vez** (en el sentido
    de no introducir innovaciones).
  - La **precisión** es una premisa.
  - La **parte humana de la máquina es obediente** y se comporta como se le ha asignado.
- Aunque hoy hay organizaciones que aplican exitosamente el modelo, tiene **severas
  limitaciones**:
  - Pueden crear formas organizacionales con **dificultades para adaptarse a cambios en
    el contexto**.
  - Pueden dar lugar a una **burocracia sin límites**.
  - Pueden tener **consecuencias no previstas y no deseables**; por ejemplo, los
    intereses de algunos miembros pueden tomar preferencia sobre los objetivos de la
    organización.
  - Pueden traer **efectos deshumanizadores** sobre los empleados, especialmente los de
    niveles jerárquicos bajos.
- **Por qué se adaptan mal a los cambios** [p. 12]: se crearon **para alcanzar
  determinados objetivos y no para las innovaciones**. La flexibilidad y la capacidad
  de acciones creativas (más importantes que la mera eficacia) se ven socavadas por la
  **rigidez** y la tendencia a la **segmentación y diferenciación entre niveles
  jerárquicos, funciones, roles y personas**, que crean barreras y escollos → ineficiencia
  y retrasos ante situaciones no previstas; problemas de **inactividad y falta de
  control** frecuentes; la **información llega distorsionada** porque las comunicaciones
  entre departamentos son pobres y el personal **oculta sus errores por temor a ser
  castigado**.
- **Desde el punto de vista de las personas** [p. 12]: tiende a **limitar el desarrollo
  de la capacidad humana**, moldeando al hombre como complemento de los requerimientos
  de la organización en lugar de estructurar la organización según sus fuerzas y
  potencialidad. Empleados y empresa pierden su disposición, y la organización pierde
  la **contribución inteligente y creativa** que muchos trabajadores podrían aportar.
  Los trabajadores no se hacen cargo de lo que escapa a su alcance → **actitudes
  negligentes** («éste no es mi trabajo», «la responsabilidad es de otro»).
- **Objetivos no formales** [p. 12]: la intención es que las partes contribuyan a las
  metas del todo, pero la estructura jerárquica es también un **sistema de promoción**
  donde los individuos **compiten por las limitadas plazas altas** y por los **recursos
  limitados** asignados a áreas específicas. Resultado: comportamiento **irracional para
  el conjunto** aunque parezca racional para el área afectada; las organizaciones
  formales terminan persiguiendo **objetivos no formales**, incluso contrarios al diseño
  original.
- **Por qué siguen siendo populares** [p. 12]: por su **eficacia** en numerosas tareas y
  por su capacidad de **reforzar y sustentar modelos específicos de poder y control**.

<details>
<summary>📝 Pregunta de parcial — 2014-05-06 (Tema 2, P1): taylorismo</summary>

Taylorismo. En qué se basó. Cuáles eran sus principales características, etc.

<details>
<summary>Ver respuesta (del compilado)</summary>

**En qué se basó.** Nace la administración científica y se basa en el supuesto de que
las empresas sufrían enormes pérdidas causadas por la ineficiencia del trabajo humano,
cuyas razones serían:

- La deliberada lentitud del personal.
- El carácter de los obreros (holgazanes e ineptos).
- La falta de métodos racionales de trabajo, por culpa de los propios empresarios.
- El error de éstos en cuanto a creer en la capacidad e iniciativa de los trabajadores,
  quienes no están bien dotados para ello.
- El desaprovechamiento de la ambición personal de aquéllos, que deberían ser
  estimulados con incentivos económicos.

**Nace el paradigma mecanicista:**

- Se concibe el comportamiento de la empresa como totalmente ajustado a lo que se haya
  previsto en su organización formal.
- Se concibe el trabajo de los operarios como una ejecución mecánica y sin desvíos de
  las instrucciones programadas que se les indiquen.
- Se plantea la división del trabajo en rotundos términos de separación entre el
  trabajo intelectual y el trabajo manual.
- Se concibe al trabajador como guiado por sus intereses económicos, con exclusión de
  cualquier otra motivación.

**Medidas que puso en práctica:**

- La organización del trabajo de los obreros es facultad y responsabilidad del
  directivo.
- Utilizar métodos científicos para determinar el modo más eficiente de realizar el
  trabajo: estudio de los movimientos y del tiempo.
- Seleccionar el personal más adecuado para cada trabajo, diferenciar los intelectuales
  de los ejecutores.
- Controlar el rendimiento de los trabajadores.
- Aplicar incentivos económicos.

</details>

**Dónde está en el libro:** p. 9–10 (sección «El "Taylorismo"», dentro de Mecanicismo).

**Ojo (libro, p. 10):** el libro lista **seis** medidas, no cinco: falta «instruir al
trabajador» conforme a estudios de movimientos y tiempos, fichas de instrucciones,
estudios de costos y planeamiento («the one best way»). Además, para los incentivos
agrega que buscan generar competencia entre obreros, que el monto no se dejaba subir
mucho y que Taylor recomendaba «usar el trato duro» cuando hiciera falta. Sumá también
las dos etapas (Taylorismo-Fordismo desde 1910; crisis a fines de los '70).

</details>

<details>
<summary>📝 Pregunta de parcial — 201?-09-26 (P4): críticas al mecanicismo</summary>

Entre los paradigmas conocidos para la dirección de las organizaciones aparece el
"Mecanicismo". ¿Cuáles son las críticas que se le hacen a dicho paradigma?

<details>
<summary>Ver respuesta (del compilado)</summary>

**Qué es el mecanicismo:**

- Se aplica el principio de la división del trabajo, que supone mayor especialización
  en la ejecución de las tareas y, por lo tanto, mayor velocidad, mayor precisión y
  menor costo.
- Se piensa en la organización como una máquina con componentes aceitados, precisos y
  absolutamente coordinados y eficientes.
- Lenguaje de órdenes: consiste en trabajar tan exactamente como sea posible a través
  de patrones de autoridad (derecho de dar órdenes y exigir obediencia).

**Las organizaciones mecanicistas funcionan bien cuando:**

- Existe una tarea lineal para realizar.
- El entorno asegura que el producto realizado será el esperado.
- Se desea producir exactamente el mismo producto, sin innovaciones.
- La precisión es una premisa.
- La parte humana de la máquina es obediente y se comporta como se le ha asignado.

**Limitaciones (las críticas):**

- Pueden crear formas organizacionales que tengan dificultades para adaptarse a cambios
  en el contexto, porque fueron hechas para un fin y el de las jerarquías superiores
  debe decidir todo de nuevo.
- Pueden dar lugar a una burocracia sin límites.
- Pueden tener consecuencias no previstas y no deseables.
- Pueden traer efectos deshumanizadores sobre el empleado.
- La información a menudo llega distorsionada.
- Tiende a limitar el desarrollo de las capacidades humanas.

</details>

**Dónde está en el libro:** p. 11–12 (sección «Crítica del mecanicismo»).

**Ojo (libro, p. 12):** la razón de la mala adaptación que da el libro es que se
crearon para alcanzar objetivos y no para innovar (rigidez y segmentación entre
niveles, funciones, roles y personas), no que «la jerarquía deba decidir todo de nuevo».
Y suma dos críticas que el compilado no menciona: la competencia por plazas y recursos
produce un comportamiento irracional para el conjunto (objetivos no formales), y las
fórmulas mecanicistas persisten por su eficacia y por sustentar modelos de poder y
control.

</details>

## Organicismo — [p. 12]

### Elton Mayo y las experiencias de Hawthorne — [p. 12]

- Bajo la metáfora de la máquina, las concepciones sobre la dirección quedaron ceñidas
  a una maquinaria preocupada por **objetivos, estructuras y eficiencia**; el diseño era
  sumamente técnico y las tareas de alentar al personal se limitaban a **«pagar lo justo
  por el trabajo realizado»**.
- A pocos años de echadas esas bases, otros acontecimientos generaron visiones
  diferentes. Antecedentes: **inicios de la década del '20**, cuando el ingeniero
  australiano **Elton Mayo** realiza sus experiencias en la planta de **Western Electric
  en Hawthorne (EE. UU.)**.
- Los estudios estaban destinados a relacionar las **condiciones laborales con la
  productividad**, pero **en cambio revelaron**:
  - La **importancia de las necesidades sociales** en el mundo del trabajo, y el modo en
    que los **grupos laborales** pueden satisfacer esas necesidades **restringiendo la
    producción**.
  - La posibilidad de que existiera una **«organización informal»** basada en la
    **camaradería de los grupos**.
- Esto demostró que **las actividades laborales están influidas por la naturaleza del
  ser humano** y que hay que prestarle atención considerable a este hecho.
- Cuestión subyacente: la **relación entre individuos y grupos**. Surge una nueva teoría:
  los **grupos humanos, igual que los organismos biológicos, trabajan más eficazmente
  cuando sus necesidades son satisfechas**. Implicaciones desastrosas para las
  organizaciones burocráticas, que consideran a los individuos motivados sólo por el
  dinero o por la posibilidad de tener un trabajo.
- Se empieza a **replantear las relaciones interpersonales y el trabajo mismo** para
  crear condiciones de **desarrollo personal** que a la vez ayuden a la organización a
  lograr sus objetivos: una organización donde **ésta y sus integrantes salgan
  mutuamente favorecidos**.

### El contexto cultural y la Escuela de las Relaciones Humanas — [p. 13]

- Los experimentos y conceptos **no ocurrieron en el «vacío» cultural**: época de
  cambios en la sociedad y en los valores. Terminada la **1ª Gran Guerra**, hubo un
  vigoroso **crecimiento de la sindicalización** y revoluciones políticas renovadoras.
  Creció la **resistencia al autoritarismo y a la deshumanización del trabajo**,
  expresada en luchas sociales y en **fenómenos de contraculturas en la organización**,
  que fueron el **principal descubrimiento de E. Mayo**.
- Este planteo y sus nuevos métodos de dirección dieron origen a la corriente que él
  mismo bautizó **«Escuela de las Relaciones Humanas»**. Según ella:
  - La **falta de campo para el desarrollo de la iniciativa** de los miembros, aun en
    los niveles de ejecución, perjudica el efectivo aprovechamiento de su
    **productividad potencial**.
  - Las **líneas de comunicación fijadas esquemáticamente de antemano** llevan a
    **conflictos absurdos**, que no existirían si la comunicación fuera **espontánea y
    libre de restricciones**.
  - Establecer *a priori* **líneas de autoridad al margen de las que espontáneamente
    reconocen los miembros** es la fuente más frecuente de conflictos y se contrapone a
    lograr mayores niveles de eficiencia.

### Barnard, las corrientes sociológicas y los «sistemas abiertos» — [p. 13]

- Pese al **fracaso de no pocas medidas de Mayo**, su mezcla de **ingenuidad y
  paternalismo**, y el brusco retroceso social y político de la **gran crisis de 1929
  («martes negro»)**, nuevas investigaciones, sobre todo las de **Chester Barnard**
  (creador de la **Escuela de los Sistemas Sociales**), retomaron y reforzaron la
  atención a los aspectos **humanos y técnicos** de la organización y al hecho de que
  **ésta depende de un amplio entorno** para conseguir sus fines.
- Surge la necesidad de pensar a las organizaciones como **«sistemas abiertos»** que
  deben mantener una relación apropiada con el entorno para sobrevivir, cuestión que los
  **teóricos clásicos no atendieron** [p. 14].
- Las **corrientes sociológicas** sistematizaron el análisis de aspectos no encuadrados
  en los esquemas de la organización formal, para demostrar su presencia y precisar su
  influencia en el comportamiento organizacional. Priorizaban los procesos que aumentan
  o deterioran la **identificación de los individuos con la organización**, elevan o
  disminuyen su **motivación**, y generan y manejan los **conflictos internos y
  externos**. Para eso incluyeron los **factores sociológicos y sicológicos** en el
  análisis de la productividad y la eficiencia, **al mismo nivel** que los factores
  tecnológicos y los estímulos y compensaciones materiales.

### Elementos básicos del paradigma organicista — [p. 14]

Estas corrientes marcaron el nacimiento de un nuevo paradigma, que los investigadores
del **Instituto Tavistock** llamaron **«organicistas»**, por estos elementos básicos:

- **Asimila las organizaciones a los organismos biológicos.** Ésta es la base de la
  **metáfora orgánica**.
- Las estudia como **sistemas abiertos**, cuyo punto clave es el **hincapié en el
  entorno** en el que existen (los mecanicistas la trataron como un **sistema mecánico
  cerrado**).
- Consecuencia de lo anterior: las define en términos de **subsistemas
  interrelacionados**.
- Postula que en un entorno donde los **cambios tecnológicos y de mercado** están a la
  orden del día y son cada vez más veloces y frecuentes, la organización requiere
  **mayor flexibilidad**.

### Ventajas del organicismo — [p. 14]

Las teorías encuadradas genéricamente en el paradigma organicista mostraron, en la
práctica, ventajas y limitaciones. Ventajas:

- El descubrimiento de la importancia del **entendimiento de las relaciones entre la
  organización y su entorno**.
- La dirección de las organizaciones puede aumentarse generalmente a través de una
  **atención sistemática a las necesidades que deben satisfacerse para que la
  organización sobreviva**.
- Podemos identificar las distintas **«especies» de organización**, sabiendo que en una
  organización siempre tenemos un **abanico de opciones**.
- La virtud de la forma orgánica de las organizaciones en los **procesos innovadores**.

### Limitaciones de la metáfora orgánica — [p. 14]

- Hemos aprendido a ver a las organizaciones y sus entornos de un modo **demasiado
  concreto**, cuando en realidad son el producto de muchas **ideas, visiones, normas y
  creencias**: su **forma y estructura son mucho más endebles** que las de un organismo.
- La organización, a diferencia de los organismos, tiene la **misma oportunidad de
  supervivencia tanto si compite como si colabora**.
- A diferencia de los organismos, las circunstancias en que **un elemento sabotea al
  trabajo en conjunto** son excepcionales y potencialmente peligrosas.
- Los casos en que los elementos de la organización operan con un **grado de armonía
  ideal** son más la excepción que la regla.
- Y por último, debido a lo anterior [p. 15]: **permitir que la metáfora orgánica se
  transforme en una ideología**, como ocurrió con la metáfora de la máquina.

## Teoría de la Contingencia — [p. 15]

### La síntesis: sistemas sociotécnicos y Burns y Stalker — [p. 15]

- La disputa entre las tendencias **«mecanicista» y «orgánica»** llevó a **intentos de
  síntesis** de numerosos teóricos y dirigentes: ninguna posición resolvía por sí sola
  los múltiples y contradictorios problemas, así que se impuso la necesidad de
  **integrar ambas**. ¿Cómo?
  - A veces, **incluyendo en la organización formal los aspectos sicológicos y
    sociológicos** pertinentes, sometidos antes a un análisis profundo y sistematizado.
  - Otras veces, **flexibilizando los rígidos esquemas tradicionales** para adaptarlos a
    las cambiantes exigencias externas e internas.
- Sobre esta **doble atención a los aspectos humanos y técnicos** se apoya la
  comprensión de las organizaciones como **«sistemas sociotécnicos»**: ambos aspectos
  del trabajo son **mutuamente interdependientes**, y alteraciones en uno *siempre*
  tendrán consecuencias sobre el otro. La solución a este tipo de contingencias radica
  en encontrar un medio para **reconvertir las necesidades humanas y la eficiencia
  técnica**.
- Desarrollo inicial: investigadores del **Instituto Tavistock (Londres), comienzos de
  la década del '60**. Destacan **T. Burns y G. M. Stalker**, influidos por las
  corrientes **conductistas** y por el **enfoque de sistemas**, que estudiaron en una
  **veintena de industrias** la relación de las empresas con su medio ambiente y
  concluyeron que existen **dos sistemas netamente diferenciados de administración**:
  - **«Mecanicista»:** define con precisión «los métodos, obligaciones y poderes
    técnicos atribuidos a cada función; la interacción dentro de la administración tiende
    a volverse **vertical**… todo el conocimiento… sólo se encuentra o debería
    encontrarse en el **vértice de la firma**».
  - **«Orgánico»:** «la interacción se realiza tanto **vertical como lateralmente**…» y
    las tareas se realizan no tanto por una definición estricta de métodos y
    obligaciones como por el **conocimiento general de las necesidades y objetivos de la
    empresa**.
  - Lo más notable: «el sistema mecanicista parecía ser apropiado a **empresas
    relativamente estables**… el orgánico parecía exigido por las **condiciones de
    transformación**».
- **Primera relación contingente:** en **empresas estabilizadas** → procedimientos más
  formales, **menor delegación** y control más estrecho; en **empresas dinámicas y
  variables** → **mayor autonomía de decisiones** y supervisión más amplia.

### Lawrence y Lorsch: el concepto fundamental — [p. 15]

- **Paul Lawrence y Jay Lorsch** investigaron industrias de **tres ramas: plásticos,
  alimentos envasados y contenedores**, evaluando cómo influyen sobre la eficiencia las
  **dos direcciones básicas de la estructura: la división departamental y la
  coordinación integradora**; consideraron también los distintos **grados de estabilidad
  y la influencia del ambiente**.
- Fruto de ese estudio, formularon el **concepto fundamental** de la «Teoría de la
  contingencia» o «administración de contingencia»: **«No existe una única manera de
  mejor organizar… las organizaciones necesitan ser sistemáticamente ajustadas a las
  condiciones ambientales»**.
- Por lo tanto, **no rechaza los principios y preceptos de las diversas corrientes
  teóricas, sino que condiciona su aplicación a las circunstancias**, a la contingencia
  (es decir, «a lo que puede suceder»).

### Luthans: la relación contingente «si-entonces» — [p. 16]

- Según **Fred Luthans**, uno de los mentores de la teoría, **no es un enfoque
  asistemático ni librado a la casualidad**.
- La **relación contingente** es una **relación funcional entre dos o más variables**,
  expresable por el par **«si-entonces»**:
  - El condicional **«si»** denota la **variable independiente** (ej.: estado de la
    tecnología, estructura del mercado).
  - El consecuente **«entonces»** señala la **variable dependiente** (ej.: el estilo de
    supervisión a aplicar, el grado de centralización necesario).
- Definición de Luthans: **«La Administración de Contingencia se ocupa de la relación
  entre variables circundantes pertinentes y conceptos y técnicas de administración
  apropiados, que lleven al logro eficaz de objetivos».**
- Ejemplo sencillo del autor:
  - **Si** en la cultura social predomina la tendencia a la libre expresión, y si la
    empresa ocupa personal muy calificado en operaciones de alta tecnología,
  - **Entonces** es recomendable una **supervisión abierta y participativa** para
    alcanzar mayor eficacia.

### Las variables «circundantes»: medio externo e interno — [p. 16]

- **«Circundantes»** = todas las variables que están **fuera de la administración**, que
  la circundan: **el medio**. Incluye:
  - El **medio externo** (clientes, competidores, régimen legal, situación económica,
    etc.): **poco controlable**.
  - El **medio interno** (**más controlable**): básicamente el **sistema de organización
    formal, su estructura y sus procesos**.
- **Ilustración 1 — «Categorías del medio» de la Administración de Contingencia**
  (Luthans): diagrama de anillos concéntricos. En el centro, el **medio interno**
  (sistema de organización formal: de estructuras, de procesos, de tecnología); en el
  anillo intermedio, el **medio externo específico** (clientes, competidores,
  proveedores); en el anillo exterior, el **medio externo general** dividido en cuatro
  sectores: **social** (valores y fuerzas sociales, normas culturales, expectativas de
  individuos, grupos y sociedad), **tecnológico** (técnicas y procesos conocidos, estado
  de la ciencia y la tecnología), **económico** (recursos naturales, sector público y
  privado, política monetaria y fiscal) y **político-legal** (regulaciones y normas del
  Gobierno).
- **Observaciones de la Cátedra al gráfico** [p. 16–17]:
  - En el medio interno, **«procesos»** se refiere a **toma de decisiones, comunicación
    y control** (otros incluyen planeamiento y dirección).
  - Entre los **proveedores**, Luthans incluye a la **fuerza de trabajo**.
  - En opinión de la Cátedra, la **«organización informal» debería incluirse en el medio
    interno**.

### Ejemplos, objetivo de la Administración de Contingencia y la matriz — [p. 17]

- **La mayoría de las veces**, la variable independiente es el **medio** (en cualquiera
  de sus clases) y la dependiente son las **técnicas administrativas**. Pero **a veces
  ocurre lo contrario**. Ejemplo con ambas circunstancias:
  - **Si** la producción es «en cadena» o de «línea de montaje» (variable del medio
    interno: organización tecnológica) → **entonces** la supervisión deberá ser **muy
    centralizada, con tendencia al autoritarismo** (concepto y técnica de administración).
  - Pero también: **si** en esa empresa la Dirección establece un manejo más abierto,
    «democrático», en la supervisión de personal → **entonces** el proceso productivo
    será impulsado a un **mayor desacople de sus etapas**. Acá la dependencia de las
    variables **se invirtió** respecto de la primera.
- También puede ser que **una variable del medio sea la independiente y otra del medio
  la dependiente**:
  - **Si** la situación del mercado está sujeta a cambios muy rápidos e inciertos →
    **entonces** los procesos de comunicación y de decisión (variables del medio
    interno) deberían adecuarse a la velocidad de los cambios para no dejar descolocada
    a la organización frente a los competidores.
- **Objetivo de la Administración de Contingencia:** alcanzar la **mayor efectividad**
  en el manejo de las empresas aplicando los conceptos y técnicas más apropiados **a
  partir del conocimiento de su relación funcional real (no teórica)** con las
  condiciones del ambiente en que actúa. Los **principios** deberán ser sustituidos por
  **«criterios de ajuste»** entre la organización y el ambiente, y las **normas** por
  otros tantos criterios entre la organización, la tecnología y el manejo de personal.
- **La matriz de relaciones contingentes:** sus propulsores simbolizan el acervo de
  relaciones contingentes como una **matriz de doble entrada**: los **«si»** (variables
  independientes) en un eje y los **«entonces»** (variables dependientes) en el otro.
  Las **«celdillas»** se van llenando con las relaciones contingentes que se descubren.
  Reconocen que **muy pocas se han «llenado»** hasta ahora, y que los ejemplos de dos
  dimensiones son ilustrativos: «El desarrollo futuro de la Administración de
  Contingencia debe resolver el problema de la **complejidad multidimensional** de la
  práctica administrativa» (Luthans).
- **Ilustración 2 — Marco conceptual de la Administración de Contingencia** (Luthans)
  [p. 18]: la grilla vacía de doble entrada. En el eje vertical, **ENTONCES** = variables
  de administración (de proceso, cuantitativas, conductuales y de sistemas); en el eje
  horizontal, **SI** = variables circundantes (externas: sociales, técnicas, económicas,
  políticas, legales; internas: de estructura, de procesos, de tecnología).

<details>
<summary>📝 Pregunta de parcial — 2019-05-14 (P1): teoría de la contingencia</summary>

Desarrolle la teoría de la contingencia aplicada a la dirección de las organizaciones.

<details>
<summary>Ver respuesta (del compilado)</summary>

- La teoría de la contingencia establece que **no existe una única manera de dirigir
  una organización, ni una manera correcta para ello**. Las organizaciones necesitan ser
  sistemáticamente ajustadas a las condiciones ambientales.
- Se necesita investigar y plantear un **equilibrio entre las dos teorías (mecanicismo
  y organicismo) y la práctica**.
- De tal manera, **no rechaza los principios y preceptos de las diversas corrientes
  teóricas, sino que condiciona su aplicación a las circunstancias**, a la contingencia.
- Usa las características de la teoría que cree adecuada al momento.

</details>

**Dónde está en el libro:** p. 15–18 (sección «Teoría de la Contingencia») y p. 18–19
(«Valoración y crítica de la Teoría de la Contingencia»).

**Ojo (libro, p. 15–17):** la respuesta del compilado es muy corta para un «desarrolle».
El libro suma: la síntesis mecanicista/orgánica y los **sistemas sociotécnicos**;
**Burns y Stalker** (dos sistemas: mecanicista para empresas estables, orgánico para
condiciones de transformación); **Lawrence y Lorsch** (concepto fundamental); **Luthans**
con la relación **«si-entonces»** (variable independiente/dependiente), su definición,
el **medio externo/interno** y el **objetivo** (criterios de ajuste en lugar de
principios) y la **matriz de doble entrada**. El «equilibrio» que el libro plantea
(p. 18) es entre la experiencia de los administradores prácticos y la ciencia de los
teóricos.

</details>

## Valoración y crítica de la Teoría de la Contingencia — [p. 18]

1. **Reconoce antecedentes aun entre los autores clásicos y neoclásicos**, entre ellos
   **Fayol**: «no hay nada rígido ni absoluto… debe haber cierto margen para las
   cambiantes circunstancias».
2. **Su desarrollo no fue mera especulación** sino producto de **diversas
   investigaciones sobre la realidad**: los estudios del **Instituto Tavistock** en
   **minas de carbón**; los de **A. Gouldner** en una **planta de yeso**; los de la
   socióloga inglesa **Joan Woodward** sobre **100 empresas**; los de **A. Chandler** en
   **cuatro empresas líderes de EE. UU.**; y otros de los sociólogos organizacionales
   **J. C. Emery, J. D. Thompson y Ch. Perrow**. Cada uno aportó el descubrimiento de
   **relaciones funcionales reales** entre factores del ambiente y los diseños
   organizacionales y sistemas administrativos más apropiados para lograr mayor eficacia
   en situaciones concretas.
3. **Busca un equilibrio entre la práctica y la teoría:** entre la experiencia de los
   **administradores prácticos** (que se desconciertan ante los teóricos y los tildan de
   «poco realistas») y la ciencia de los **teóricos** (cuyos avances resisten quienes no
   los entienden o no quieren cambiar sus hábitos). **Luthans:** «En ambos lados hay algo
   de verdad y de error. El problema principal es que ambas partes tienen diferentes
   supuestos». Los teóricos dan por sentada la **universalidad de sus conceptos y
   técnicas**; los practicantes suponen la **universalidad de su estilo individual**,
   aunque cuando aplican conceptos modernos son altamente situacionales. **«El enfoque
   de contingencia salva esta brecha entre la teoría y la práctica»**: los conceptos
   modernos no son erróneos ni irreales, ni los practicantes están por fuerza
   equivocados; lo que pasa es que **muchos conceptos y técnicas no son adecuados a sus
   situaciones particulares**. La Administración de Contingencia **relaciona
   funcionalmente condiciones situacionales dadas con conceptos y técnicas
   administrativos apropiados** para lograr el fin propuesto.
4. **Opinión de la Cátedra:** el «enfoque de contingencias» es un **significativo
   avance** porque reconoce la **particularidad de cada organización** (y de cada
   circunstancia o momento de su vida) **sin dejar de apelar a la validez universal del
   arsenal teórico**, relativizándolo según la situación. Es **menos rígido que la
   mirada teórica pura y más científico que el mero empirismo**; hasta puede
   **enriquecer la teoría al relacionarla dialécticamente con la práctica** [p. 19].
   - **Su mayor limitación:** parece haber tendido, hasta ahora, **más a la búsqueda de
     un repertorio de reglas pragmáticas que a extraer nuevas leyes** que expliquen el
     comportamiento de las organizaciones.
   - Eso no impide que se constituya en una **valiosa herramienta** para la
     estructuración y manejo de las organizaciones. **El riesgo:** que, aplicando las
     relaciones contingentes descubiertas **como si fuesen recetas**, se caiga en un
     **nuevo mecanicismo** ajeno al análisis concreto (cuantitativo y cualitativo) de la
     realidad. Advertencia del propio Luthans: «Los ejemplos de relaciones de
     contingencia enunciados… no deben tomarse como soluciones mecanicistas de complejos
     problemas administrativos».

## Nuevas tendencias — [p. 19]

### Reducción de niveles y horizontalización — [p. 19]

- La introducción de las **tecnologías de información** y el **nuevo contexto mundial**
  repercutieron profundamente en la vida de las organizaciones, en la forma de
  dirigirlas y en sus estructuras. Está a la orden del día la **adaptación de los
  sistemas internos a las variaciones de contexto**.
- **Por un lado, la reducción de niveles** en las estructuras organizativas parece un
  requerimiento ineludible. Obedece a una necesidad **prioritariamente financiera**: el
  costo de las estructuras muy verticales es alto, hay que reducirlo, y para eso se
  **sacrifican niveles** mediante diversas modalidades.
- Simultáneamente se incorporan **nuevas tecnologías de almacenamiento y procesamiento
  electrónico de la información** y se revolucionan los sistemas de comunicación, lo que
  permite **aplanar la pirámide organizacional** y construye **nuevos principios para la
  dirección**:
  - **Descentralización de la toma de decisiones** hacia las gerencias intermedias.
  - **Participación más amplia** de todos los sectores en el proceso de planeamiento.
  - Aumento de las responsabilidades de las **funciones de *staff*** por sobre las
    funciones de línea.
  - **Menor dedicación al dictado de órdenes de rutina** y mayor tiempo a las tareas de
    **análisis y diseño de políticas y sistemas** para implementarlas.
- Estas tendencias marcan el camino de la **horizontalización**, tanto en la
  configuración estructural como en la **distribución del poder** y en las
  **posibilidades de desarrollo de sus miembros**.

### Producción ligera y los nuevos trabajadores — [p. 19]

- **Por el otro lado**, evolución hacia formas organizacionales basadas en la
  **producción ligera**: ínfimo número de niveles jerárquicos, elevado grado de
  **flexibilidad** y presencia de **grupos de trabajo**. La comunicación pasa de
  **vertical a horizontal**.
- Esa transformación marca el paso de una **producción de línea** a una **producción de
  volúmenes elevados y flexibles**, que permite una **descentralización del trabajo** y
  un **ahorro en el tiempo de trabajo**.
- La evolución, originada principalmente en **razones de rentabilidad**, es concomitante
  con los **nuevos trabajadores**, signados por la **preeminencia del conocimiento**
  como cualidad demandada: **técnicos y profesionales** que manejan tecnologías
  complejas, necesitan **independencia** para resolver situaciones con sus capacidades
  específicas y **no están dispuestos a obedecer** lo que dicten rígidamente las
  jerarquías. Si lo hicieran, rendirían mucho menos, y eso no le conviene a las
  empresas. Confluyen las **necesidades de las empresas**, las posibilidades de los
  **avances científicos** y las **nuevas demandas de la cultura**.

### La tecnología «democratiza», el poder y el trabajo en equipo — [p. 20]

- Parecería que la **tecnología democratiza**: pone la información al alcance de
  «cualquier persona», porque los procesos ya no son accesibles sólo para el experto
  sino manejables en ciertos aspectos por todos los empleados.
- Pero esto podría suceder **sólo en teoría, según funcionen los mecanismos internos
  del poder**: «El problema de la horizontalización y la participación es que es un
  **libreto escrito por la organización**, por alguien que tiene poder y que los otros
  deben aceptar» (**A. Petriella**).
- La mayoría de los ejecutivos postula el **trabajo en equipo**, aunque según **P.
  Drucker** «hoy en día se habla mucho del "trabajo en equipo", pero éste es un fenómeno
  que **aún no se ha concretado**. Todavía los ejecutivos creen que son *los jefes*, y la
  mayoría de los que tratan el tema presupone que existe **un solo tipo de equipo** que
  sirve para todo tipo de tareas y de empresas».

### Las «transiciones» según John Naisbitt — [p. 20]

| De: | A: |
|---|---|
| Economía basada en la industria. | Economía basada en la creación y transmisión de la información. |
| Una dirección altamente tecnológica. | Una dirección con orientación hacia la alta tecnología, pero con compensación hacia lo humano. |
| Un sistema económico nacional. | Un sistema económico globalizado. |
| Planeamiento a corto plazo. | Planeamiento a largo plazo. |
| Una estrategia que busca el mantenimiento de la situación. | Una estrategia creativa e innovadora, desde las bases hasta la alta dirigencia. |
| Estructuras jerárquicas estratificadas. | Estructuras con canales de información no formales. |
| Concentración de actividades en grandes centros urbanos. | Emigración hacia nuevos centros de desarrollo. |
