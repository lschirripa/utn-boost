## Generalidades: macroambiente y definición clásica de cultura — [p. 21]

### El macroambiente

- Cada organización existe en un **ambiente sumamente complejo** que ejerce considerable influencia sobre su composición y actividad. Ese entorno total es el **macroambiente**.
- El macroambiente está formado, **como mínimo, por tres sistemas principales: cultural, político y económico**. El libro agrega (coincidiendo con algunos autores) que en ese entorno están también la **tecnología** y el **sistema social**.
- El integrante de una organización moderna **sufre la influencia de cada una de esas fuerzas, reacciona frente a ellas y necesita comprender su naturaleza e importancia** si pretende alcanzar un buen nivel de desempeño en la organización.
- Las organizaciones funcionan hoy en un ambiente cuyo **dinamismo y complejidad crecen a un ritmo sin precedentes**, lo mismo que la multiplicidad de interacciones entre la organización y esos sistemas modificadores, y entre éstos mismos.
- De toda esa red, el capítulo analiza en particular la **interdependencia entre cultura, sociedad y organización**.
- **Ilustración 3 "Sistema Cultural Externo":** un diagrama con un rectángulo grande rotulado *Sistema cultural externo*; adentro, un óvalo *Sistema cultural interno* que contiene al *Sistema Organización*, al que entran flechas de *Factor humano* e *Insumos* y del que sale una flecha de *Productos o servicios*. Debajo, con flechas de doble sentido hacia el sistema organización, los cinco sistemas del macroambiente: *Sistema social*, *Sistema político*, *Sistema económico*, *Tecnología* y *Sistema cultural*.

### Definición clásica de cultura

- **Cultura:** "el conjunto complejo que comprende **conocimientos, creencias, arte, moral, ley, costumbres** y cualesquiera otras **capacidades y hábitos adquiridos por el hombre como miembro de la sociedad**".
- Es un **concepto antropológico**, referido únicamente al Hombre: **no abarca el reino animal** ni otros aspectos del medio natural.
- La denotación más extensa del vocablo "cultura" comprende **todo lo que la especie humana introdujo o creó en el medio ambiente, incluida toda construcción material**.
- Pero en el plano de análisis del libro, "cultura" se refiere particularmente **"al modo en que la sociedad vive, incluyendo las relaciones entre valores, roles y normas de comportamiento"**, y al **conjunto de respuestas incorporadas por la sociedad frente a situaciones determinadas**, que permiten a sus integrantes vivir e interactuar con sus semejantes.

## La cultura de la organización como subcultura de la sociedad — [p. 22]

### De la sociedad a la organización

- Toda organización se crea para **ciertos fines**, que realiza mediante las **interacciones entre sus miembros**, las cuales constituyen su **estructura**.
- Cada persona que interviene es **portadora de una serie de valores y conductas modeladas por lo aprendido en sus grupos de pertenencia** (familia, escuela, amistades, sector social y, en general, el medio ambiente en el que actúa). Sus pautas de conducta son función de la cultura y de la estructura social a la que pertenece, y se reflejan en forma de sistemas similares en cuanto a caracteres, personalidades y creencias.
- Las organizaciones son **sistemas sociales** que existen y actúan en un macroambiente que incluye al sistema cultural: **hay que estudiarlas siempre en relación con éste, nunca como entes aislados**. En ese ambiente se plasman los tipos de organizaciones que mejor se acomodan a sus sistemas de ideas, creencias, valores y actitudes, y a los fines socialmente aceptados.

### Cultura organizacional (definición)

- Cada organización **crea su propia cultura, que es una subcultura respecto de la que reina en su ambiente social**: **patrones de conducta propios de la organización, adquiridos y ajustados al contexto del patrón cultural de la sociedad, más amplio y que lo comprende**.
- Esos patrones de comportamiento representan lo que, dentro de la organización, se considera **"bueno" para los fines de ésta** y, **tácitamente aceptados por sus miembros**, pasan a ser el **sistema de valores** al que éstos —se espera— ajusten sus normas individuales.
- **Robbins y Coulter:** "la cultura organizacional se refiere a un **sistema de significados compartidos** entre sus miembros y que **distingue a una organización de las otras**".
- Esos patrones a veces son **establecidos formalmente** y otras veces **rigen de manera implícita** (se retoma en "Sistemas culturales").

### Características comunes de las culturas organizacionales

- Se **instalan por imitación, interacción y aprendizaje**.
- Son **dinámicas** y suelen experimentar **cambios que no pocas veces escapan al control de la Dirección**.
- Se desarrollan en un marco de **interacciones recíprocas con el contexto**.
- Pueden tener **perfil propio** o **tender a emular a otras culturas organizacionales exitosas**.

### El estilo de la Alta Dirección

- Es un elemento de **importancia decisiva** en la conformación de la cultura de la organización, **aunque no el único**.
- Los rasgos de personalidad de quienes componen la Alta Dirección (frutos de sus propias subculturas) se **proyectan con peso considerable en los mandos intermedios**.
- Pero suelen ser **atenuados o condicionados** por el **contexto económico-social**, el **tipo de tecnología** empleada en la producción de bienes o servicios y los **valores y creencias imperantes en el ambiente externo**.

## Interrelaciones individuo–grupo–empresa: grupos primarios y grupos secundarios — [p. 22–23]

### Grupos primarios

- En toda organización se detectan grupos **no determinados por la estructura formal**, integrados por **pocas personas**, entre las que hay **interacción** y un **cierto interés común** que hace que compongan una **entidad reconocida por ellos y/o por terceros**. Son los **grupos primarios**, que forman parte de la **"organización informal"**.
- Desde hace mucho se acepta de manera unánime su **relevancia en todo el proceso organizacional, incluido el manejo y control** de la organización.
- Tienen una **base afectiva**, resultante de **afinidades** entre sus miembros, que **no necesariamente trabajan en el mismo espacio físico**, aunque es frecuente que surjan en el marco de la pertenencia a un mismo sector.
- Son **pequeños** y su relación es **espontánea, voluntaria, durable** y, además, **se constituye en un fin en sí misma**: **la aparición de objetivos del grupo es, generalmente, posterior a su formación**.
- **No siempre se reúnen todas estas condiciones**: puede haber un grupo primario aun faltando alguna de ellas.
- Son los grupos que **fundamentalmente interesan para analizar la organización en sus aspectos informales**.

### Grupos secundarios

- Sus características son, en general, **opuestas a las de los primarios**.
- Son el **resultado de las relaciones formales establecidas en la estructura** de la organización: **los objetivos y tareas que se les asignan dan origen al grupo**.
- Normalmente son de **mayor tamaño**, a veces muy numerosos, dependiendo del **grado de departamentalización** de la estructura.
- Corresponden a la **organización formal**, lo cual **no impide que dentro de ellos se formen y coexistan grupos primarios**, basados en relaciones más estrechas y personales.

### Contraste rápido

| | Primario | Secundario |
|---|---|---|
| Origen | Organización informal (no determinados por la estructura formal) | Relaciones formales de la estructura (organización formal) |
| Tamaño | Pequeño | Mayor (según grado de departamentalización) |
| Relación | Espontánea, voluntaria, durable, base afectiva; fin en sí misma | Dada por los objetivos y tareas asignadas |
| Objetivos | Aparecen después de formado el grupo | El objetivo/tarea da origen al grupo |

### Los grupos y el control social

- Los grupos son **uno de los principales vehículos de control social**: mediante el grupo el individuo **adquiere metas, actitudes e ideales**. **Coactiva o persuasivamente**, los distintos grupos imponen a sus miembros el cumplimiento de sus pautas de comportamiento.
- Como la vinculación de los grupos primarios es **cara a cara**, la **tecnología** (que establece y condiciona las relaciones del proceso) **determina en muchos casos su formación**.
- Los grupos informales cumplen una **función integradora para el individuo** y son relevantes para la organización porque **influyen y determinan en gran medida el comportamiento de sus integrantes**.
- Pueden **conferir cohesión** a la organización **o ser vehículos de disociación**, según el **clima social imperante** y la **coincidencia entre las medidas que se instrumenten y los fines grupales**.
- Son también **vías de comunicación** e **instrumentos de integración**.

### Conclusión: la organización como sistema social

- De todo lo anterior surge que **la organización puede ser definida como un sistema social**.
- Como tal, es un sistema **complejo, dinámico y abierto**: presenta múltiples interrelaciones, cambia permanentemente e interactúa con el contexto cultural.
- Por eso, entre otras cosas, **puede renovarse estructuralmente cuando afronta una crisis**; pero, si bien cambia, **conserva ciertos rasgos inherentes a su identidad**.

## Pertenencia, implicación, identificación — [p. 23–25]

### Las hipótesis fundamentales

- La cultura comprende valores, conocimientos y percepciones comunes, pero **también y sobre todo hipótesis fundamentales**; este concepto es **el más importante**.
- Las hipótesis representan los **conocimientos de partida para actuar, analizar y decidir**. Los miembros no siempre perciben su sentido: **las consideran verdades primarias**.
- La cultura parte de la idea de que **cualquier actividad humana dentro de un marco organizado no se impone por naturaleza, sino que se deriva de hipótesis**.
- Esas creencias o hipótesis son **compartidas**, comunes a un conjunto de personas: **el hecho de compartir es el criterio de pertenencia a la cultura**.
- Aunque operan inconscientemente, son lo que la empresa estima que **debe transmitirse a los recién llegados** para realizar su integración. Ese momento de transmisión le da a la cultura un aspecto de **patrimonio más sólido**.

### Motivación y satisfacción (relación unidireccional)

- El conjunto de las técnicas de gestión de personal se basa en una **concepción implícita de las relaciones entre empresa y empleado**. Dos de esas cuestiones son la **motivación** y la **satisfacción** del individuo.
- **Motivación:** se supone que es **la empresa** la que, con sus actuaciones y su forma de dirigir, puede desarrollar en el individuo la dinámica del trabajo, interiorizando el impulso hacia el logro de las metas.
- **Satisfacción:** es más bien un **estado ligado a la producción y a la eficacia**; se supone que mejorando las condiciones de trabajo se acrecentará la eficacia global.
- Ambas teorías parten de que motivación y satisfacción son resultado de una **relación unidireccional: la empresa es quien debe promoverlas u otorgarlas**.
- Habitualmente las organizaciones buscan, a través de **valores firmemente sustentados**, que sus integrantes desplieguen conductas que **refuercen la adhesión a sus propósitos estratégicos**. Los sentimientos de los integrantes se manifiestan en **diversos grados: pertenencia, implicación e identificación**.

### i) Pertenencia

- Es una **percepción del sujeto**: el miembro de la organización tiene **clara noción de a qué organización "pertenece"**, sin que ello signifique necesariamente **adhesión, satisfacción, involucración**, etc.
- Es una **relación unívoca**, que puede darse o no, y que puede o no generar posteriormente **crecientes grados de adhesión** que aseguren el concurso del agente, el aporte de su esfuerzo.
- Dos ejemplos del libro:
  - **Por su contrario, la "no pertenencia":** en la película *La deuda interna*, el chiquilín de la Puna jujeña, al que el maestro lleva a conocer la capital de la provincia, vuelve y cuenta lo que vio "cuando estuvimos en la Argentina": no percibe que su pueblito, y él mismo, pertenecen a la Argentina.
  - **El jugador de fútbol profesional** que, siendo hincha apasionado de un club, juega en otro: cuando sale a la cancha sabe que está comprometido con este último, **pertenece (aunque sea transitoriamente) al que lo contrató**.
- Cuando alguien **reconoce realmente la pertenencia** a una organización, percibe a su vez que **la organización le pertenece**.

### ii) Implicación (también llamada "involucración")

- Es una **relación biunívoca**: el empleado **comparte los objetivos de la organización, los siente propios**, porque existe una **coherencia entre ellos y las posibilidades de llevarlos a cabo** (entre lo que se dice y lo que concretamente puede hacerse) y porque percibe que esos objetivos **son útiles para ambos**.
- En esta relación **bidireccional** (hay interacción entre individuo y empresa) se crea una situación de **coherencia, compatibilidad o adecuación** entre ambas partes: el individuo se compromete porque **siente creíbles los objetivos**, los comparte, participa y se involucra.
- Es una conducta **positiva**: asegura una **marcha paralela entre la organización y el empleado**. Pero es **una marcha sólo por un tramo de la vida**.
- **Porter** (Porter, Mowday y Steers, *Vínculos empleado-organización*; citado por Thévenet) define la implicación como:
  - el **convencimiento y aceptación de los objetivos y los valores** de la organización;
  - la **voluntad de actuar en la dirección de los objetivos y las misiones** que la organización ha fijado;
  - un **fuerte deseo de participar en la vida de la organización**.
- Su base es un **claro sistema de objetivos**: **si el objetivo no es creíble, la implicación será nula**. Ejemplo: aumentar el índice de calidad de 90 % a 95 % es aceptable, pero se vuelve inalcanzable si se agrega "en un mes".
- La implicación sería también un **factor que favorece la eficacia**, lo cual **no significa adhesión incondicional ni adoración** del asalariado a su empresa: supone sólo **cierto compromiso con sus valores y mayores oportunidades para él mismo**.
- **Clima de confianza y comunicación:** un clima de confianza basado en un buen programa de comunicaciones contribuye a crear ese compromiso; las comunicaciones **nunca deberían convertirse en manipulaciones**. Además de las razones éticas, **el individuo tarda muy poco en darse cuenta de que es víctima de una manipulación**. **Manipular** es influir en el otro explotando sus habilidades, pero **enrareciéndole el objetivo**.
- Sólo se llega a la implicación partiendo de una **comunidad de objetivos y medios y de confianza mutua**: el individuo **acuerda primero y luego actúa convencido**. Los objetivos ambiciosos son más creíbles y alcanzables cuando se trabaja con **mecanismos de consenso**. La empresa puede asentar o proponer valores, pero **debe llevarlos a cabo con la gente**, y la convencerá de su pertinencia **si la realidad se corresponde con ellos**.

### iii) Identificación

- El individuo siente que **la suerte de la organización es su propia suerte**: lo bueno o malo que le pasa a aquélla es como si le pasara a él mismo.
- Ejemplos: el **hincha de fútbol** que dice "ganamos", "perdimos", aunque no interviene en el juego; el **militante político o religioso** cuando considera que sus creencias se confunden con su propia vida y la compromete totalmente con los fines de su organización.
- **Chris Argyris** (sociólogo norteamericano): este sentimiento sería **malsano en el caso de las empresas**; para que el individuo sea **eficaz en su trabajo necesita tener una buena vida de "no-trabajo"**. Algo así como *ponerse la camiseta de la empresa cuando está en ella y sacársela cuando sale*.
- Sin embargo, las empresas suelen **pedir la identificación** de sus empleados, y los portavoces —y primeras víctimas— suelen ser sus **jefes**. Es una mirada **de corto plazo**: la entrega absoluta es **insostenible en el largo plazo**, porque o bien el agente se vuelve **pasivo, sometido, rutinario**, o **se va** de la organización para vivir con mayor plenitud.
- El libro coincide con Argyris: la identificación **no es sólo malsana para el empleado, sino que a la corta o a la larga lo es para la propia empresa**.

### Contraste rápido

| | Pertenencia | Implicación | Identificación |
|---|---|---|---|
| Tipo de relación | Unívoca | Biunívoca / bidireccional | El sujeto funde su suerte con la de la organización |
| Qué siente el sujeto | Sabe a qué organización pertenece (sin que implique adhesión) | Comparte los objetivos como propios, creíbles y útiles para ambos | La suerte de la organización es la suya |
| Valoración del libro | Neutra; puede o no generar adhesión | Positiva: marcha paralela (por un tramo de la vida) | Malsana (Argyris), para el empleado y para la empresa |

<summary>📝 Pregunta de parcial — 2013-05-07 (P1): pertenencia, identificación e implicación</summary>

Explique y detalle la Pertenencia, la Identificación y la Implicación.

<details>
<summary>Ver respuesta (del compilado)</summary>

- **Pertenencia:** es una percepción del sujeto, el miembro de la organización, que tiene clara noción de a qué organización "pertenece". Es una relación unívoca, que puede darse o no. Cuando alguien reconoce realmente la pertenencia a una organización, percibe, a su vez, que la organización le pertenece.
- **Implicación o involucración:** es una relación biunívoca, donde el empleado comparte los objetivos de la organización, los siente propios, porque existe una coherencia entre ellos y las posibilidades de llevarlos a cabo y porque percibe que esos objetivos son útiles para ambos. Esta conducta es positiva, asegurando una marcha paralela entre la organización y el empleado.
- **Identificación:** el individuo siente que la suerte de la organización es su propia suerte. Este sentimiento sería malsano en el caso de las empresas porque, para que el individuo sea eficaz en su trabajo, necesita tener una buena vida de no-trabajo.

</details>

**Dónde está en el libro:** p. 24–25 (Pertenencia, implicación, identificación).

**Ojo (libro, p. 24–25):** para "detallar" conviene sumar la definición de Porter (convencimiento y aceptación de objetivos y valores, voluntad de actuar, deseo de participar; si el objetivo no es creíble la implicación es nula), los ejemplos de cada grado y que la identificación la pide Argyris como malsana también para la empresa.

</details>

## Niveles culturales que enmarcan la cultura empresarial (subculturas) — [p. 25–26]

### Los tres niveles

- El nivel de **cultura empresarial** sólo concierne al grupo social que se inscribe **dentro de los límites de la empresa**. Pero ésta se desarrolla en el marco de **otros dos niveles**:
  - una **cultura exterior a la empresa, nacional o regional**, constituida por valores, percepciones comunes y maneras parecidas de enfocar la realidad;
  - una **variedad de culturas internas (subculturas)**, que se corresponden en general con los **grupos sociales de los que provienen sus miembros**, **no forzosamente coherentes entre sí**.
- Bajo estas influencias y sobre estas diversidades se construye la cultura de la empresa, que **resulta de la combinación de un conjunto de subculturas**.

### Qué son las subculturas y qué comparten

- Las subculturas son **expresiones de grupos humanos** y, como tales, **se autorregulan** mediante un conjunto de **normas y reglas implícitas**, un **patrimonio de experiencias comunes**, de acciones, de respuestas a los hechos, lo que les permite un **enfoque relativamente unificado de la realidad**. Pueden ser:
  - **Supuestos compartidos:** cuáles son nuestros marcos de referencia comunes, tanto respecto de maneras de pensar cuanto de formas de hacer.
  - **Valores compartidos:** en qué creemos aquí, a qué principios les asignamos mayor importancia.
  - **Significados compartidos:** cómo interpretamos aquí los hechos y las cosas.
  - **Imagen corporativa compartida:** cómo nos vemos y cómo creemos que nos ven los demás.
- Por tanto, la cultura **no es sólo un conjunto de signos folklóricos** que adorna una organización, sino también el **resultado de un proceso de creación, de verificación, incluso de selección de normas y de maneras de hacer**.

### Por qué surgen las subculturas y cómo se relacionan con la dirección

- La existencia de las subculturas **no es programada por la dirección** de la empresa ni es consecuencia de un proyecto empresarial. En cualquier organización se desarrollan **procesos no conducidos ni controlados**, cuya lógica no tiene forzosamente relación directa con las estrategias internas de la empresa.
- La **cultura de los dirigentes**, aunque importante, es **una entre todas las demás subculturas**: la cultura empresarial **no es necesariamente la de sus dirigentes** (aunque la de éstos tiene una influencia poderosa).
- Las subculturas pueden **agrupar a los individuos por razones distintas de las que habitualmente clasifican a los participantes** de una empresa: variables que reagrupan a los asalariados según sus percepciones de la realidad, como la **formación**, la **actitud con respecto al trabajo** o una **historia común**.
- La base de la conformación de la cultura de una organización **no es la negación de las subculturas**, sino la **creación de otros lugares comunes de reconocimiento y de representación a nivel del conjunto**.

## Culturas "fuertes" y culturas "débiles" — [p. 26]

- El criterio es el **grado de homogeneidad en el interior de la organización**: según él, la cultura puede calificarse de "fuerte" o "débil".
- **Cultura fuerte:** las **normas, estándares y guías fijadas por los distintos niveles de Dirección** son **bastante uniformes, conocidos y compartidos por todos** (o por una gran mayoría), fomentando una **orientación común de comportamiento**.
- **Cultura débil:** las **normas de subgrupos, o aun individuales, sobrepasan la influencia de las normas culturales emanadas de la Dirección**. Dicho de otro modo, **predominan las subculturas grupales**.
- Las calificaciones "fuerte" y "débil" **no tienen carga valorativa**: **débil no significa siempre malo**. En algunas situaciones es **deseable facilitar y/o estimular la influencia de las subculturas**, porque permite **diversidad de pensamientos y de acciones**.
- También hay que reconocer que en culturas débiles **no es fácil lograr comportamientos consistentes a lo largo de toda la organización**.
- Es de aplicación el **"enfoque de Contingencias"**: las **variables de carácter tecnológico y social del ambiente interno** pueden determinar, según el caso, la conveniencia de una cultura "fuerte" o "débil".

## Sistemas culturales: qué son y por qué importan — [p. 26]

- La cultura organizacional (llamada también **cultura corporativa**) tiene **diversos componentes** que en conjunto caracterizan la **personalidad, la identidad de una empresa**, y que ayudan a **comprender mejor los restantes subsistemas**, pues proporcionan **patrones de evaluación**.
- Por tanto, la cultura **influye decisivamente en la forma en que funciona la empresa**, ya que **repercute en el comportamiento de sus integrantes**.
- Esos componentes, **básicamente valores y creencias**, se manifiestan a través de **dos sistemas culturales: formales e informales**.

## Sistemas culturales formales — [p. 26–28]

- Las **normas formales**, así como las **políticas trazadas por sus autoridades**, son una **expresión de la cultura oficial**.
- Cinco elementos contribuyen a la **creación de la cultura y a su sostenimiento en el tiempo**: **estructuras, líderes, códigos y políticas, sistemas de recompensa, orientaciones y programas de entrenamiento**.

### 1. Estructura organizacional — [p. 27]

- El ejemplo más común: muchas organizaciones actuales tienen una **estructura burocrática**, es decir, **estricta división de tareas, estandarización de actividades, y una ardua competencia y especialización**.
- Las **grandes organizaciones la requieren para sobrevivir**, por las ventajas que ofrece para quienes manejan y controlan; pero grandes son también sus **desventajas y disfunciones**, por ejemplo:
  - la gente tiende a **obedecer la figura de autoridad, sin importar qué es lo que ésta ordene**;
  - los jefes tienden a **evadir culpas**;
  - la estructura **fragmenta el trabajo y los roles**, dividiéndose tanto que **no ven el resultado final y nadie se hace responsable del producto final** de las acciones.
- Hoy aparecen **nuevos diseños estructurales** tendientes a **remover las normas burocráticas, extender la responsabilidad hacia abajo y dar poder a los individuos en todos los niveles** para que puedan tomar decisiones. Esto requiere un **cambio cultural** que compatibilice la **independencia de los decisores** con **fuertes principios organizacionales que unifiquen valores y orientaciones**.
- **S. Barcos**, en su enfoque de la **"Gerencia Múltiple"** para abordar la creciente complejidad actual, propone que "el Gerente debe usar del poder **dando libertad de actuar, dentro de los principios unificadores** (que no son reglas, sino que sólo establecen límites), **facultando a los individuos para trabajar responsable y eficazmente**". (Se desarrolla en la electiva "Gestión de la Transformación Organizacional".)

### 2. Líderes — [p. 27]

- Los **líderes formales** son un **componente crítico** de la cultura, dado que pueden **crear, mantener o cambiar la cultura**.
- La **orientación inicial** la dan frecuentemente los **fundadores**, si tienen una visión sobre cómo será la nueva organización.
- Pueden **personificar los valores de la cultura**, creando un **rol modelo** para otros que lo observan y lo siguen, y **guiando decisiones a todos los niveles** organizacionales.

### 3. Códigos y políticas — [p. 27]

- Muchas organizaciones guían el comportamiento de sus empleados a través de **valores, misiones, credos, políticas y códigos formales**.
- Los **valores, misiones y credo** son **abstractos y generales**. Los **códigos** son muy variados en contenido y al implementarlos es difícil generalizar sobre su impacto.
- Un código **puede prescribir el comportamiento**, pero si no es seguido por los miembros puede terminar en una **organización "fuera de línea"** (que **dice algo y hace otra cosa**; se amplía en el tema "Ética y moral de las organizaciones").
- Por ello es necesario que los códigos sean **consistentes con el sistema cultural**.

### 4. Sistemas de recompensa — [p. 27]

- Las bases sobre las que se estipulan **remuneraciones e incentivos** evidencian la **cultura de quienes las establecen** y son un **mensaje a todos los miembros**, que interpretan **qué valores se premian**.
- Ejemplo: si se recompensa haber alcanzado un objetivo **sin prestar atención a qué medios se utilizaron**, se impulsarán probablemente **conductas reñidas con la ética**.
- Dado que **la gente tiende a hacer las cosas que tienen una recompensa**, la gerencia debe asegurarse de que los objetivos sean **coherentes con las políticas proclamadas** y de que **no hayan sido cumplidos mediante comportamientos indeseables**.

### 5. Programas de orientación y entrenamiento — [p. 27–28]

- A través de estos programas se comunican los **valores y guías específicas para desenvolverse en la organización**. Se brinda entrenamiento a la gerencia e **indirectamente se comunican los comportamientos valorados** por la organización.
- Deben ser **consistentes con la cultura organizacional**: si no están alineados con ella, pueden **fracasar en su propósito** o incluso **no ser tomados en serio**, sino simplemente como una manera de gozar de un día libre.

## Sistemas culturales informales — [p. 28]

- Suelen ser **elementos inmateriales, producto de la creación espontánea de los miembros**. Ello no quita que puedan ser **incorporados a las normas de la organización, adquiriendo entonces carácter formal**.
- El libro trata cinco: **mística e historias, ritos, tabúes, símbolos de estatus y jergas**.

### 1. Mística e historias

- La gente **inventa historias y construye místicas para darle sentido a sus mundos y vida**.
- Son **anécdotas que recuerdan sucesos importantes** de la vida de la empresa: hechos reales que a veces se magnifican y se convierten en **mitos legendarios**.
- Los protagonistas suelen ser los **fundadores** o ciertos empleados considerados **"héroes"** de la empresa, y la **moraleja** de cada historia **expresa valores de la organización**.

### 2. Rituales o ritos

- Son **gestos y ceremonias instituidos por la costumbre**.
- Pueden tener un aspecto **informal** (saludos de rutina, felicitaciones o festejos en ocasiones determinadas) o haber sido **formalizados** por la empresa (por ejemplo, la presentación e iniciación del nuevo empleado, llamada también **"inducción"**).
- Le dicen a la gente **simbólicamente qué se debe hacer y qué se espera que haga**: es una manera de **afirmar y comunicar de manera tangible la cultura**.

### 3. Tabúes

- Aquello que se considera **prohibido o, al menos, inconveniente**.
- Proceden por lo general del **medio ambiente cultural social**, pero **cada organización crea también sus propios tabúes** (ejemplo: el **tuteo** en ciertos niveles o respecto de ciertas personas).

### 4. Símbolos (de estatus)

- Como los ritos, pueden estar **formalizados** (ejemplo: el **tamaño del escritorio o del despacho según el nivel jerárquico**, el **derecho a estacionar** en la playa de la empresa) o **basarse sólo en la costumbre** (el lugar donde se almuerza, por ejemplo).

### 5. Jerga

- Es el **lenguaje peculiar de la actividad**: términos o significados **acuñados espontáneamente dentro de la propia organización** (o en una parte o sector de ésta).
- Las culturas **desarrollan y usan lenguaje para comunicar valores** a los empleados. Resulta **eficiente y directo** y sirve, dentro del grupo, como **muestra patente de pertenencia**, fomentando a la vez la **solidaridad** del grupo.

## Utilidad del estudio de la cultura de la organización — [p. 29]

Para el profesional que participa o interviene en una organización, el estudio y conocimiento de su cultura le resulta útil porque, entre varias razones:

1. **Fomenta la comprensión:** muchas conductas **adquieren sentido al revelarse los condicionamientos culturales que las impulsan**.
2. **Permite predecir el comportamiento:** los **valores, las creencias y las normas** desempeñan un papel importante en cuanto a determinar **la forma en que las personas actuarán frente a una situación dada**.
3. **Sustituye a la experiencia:** el conocimiento de los factores culturales permite **asimilar más rápidamente su sistema de valores**.
4. **Facilita el cambio:** la comprensión de la dinámica e influencia culturales permite la **flexibilidad y adaptación de la Dirección a las nuevas circunstancias**.
