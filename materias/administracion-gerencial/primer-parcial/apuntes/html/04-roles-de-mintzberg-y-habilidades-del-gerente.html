## Conceptos básicos: gerente, gerencia y el proceso gerencial — [p. 35]

- **Gerente:** es quien tiene a su cargo la **dirección** de toda una empresa, un área, un departamento o una división.
- **Gerencia** (definición que pone el acento en la toma de decisiones): *"la práctica de decidir para otros (los dirigidos) sobre el empleo de todos los recursos, y de obtener que esos otros pongan en vigor esas decisiones"*.

### El proceso gerencial de la escuela clásica y sus dos correcciones

- La **escuela tradicional o "clásica"** de Administración (comienzos del siglo XX) enunciaba entre sus principios centrales el **proceso gerencial**, con tres pasos o funciones principales: **planificar, organizar y controlar**.
- En esa versión la existencia de **objetivos se daba por supuesta y previa**. Pero el gerente difícilmente pueda planificar bien si no tiene idea de los estados futuros que la Dirección quiere alcanzar (hay una relación estrecha entre esos propósitos generales y su propio papel al frente de la administración). Por eso se fue redefiniendo el **primer paso** del proceso gerencial como el de **establecer objetivos**.
- El esquema tradicional tampoco señalaba ningún **"paso específico" para asegurar la ejecución** del trabajo planificado: era consecuencia de una **visión mecanicista**, que daba por supuesta la ejecución sin desvíos de las órdenes superiores.
- Quienes consideran que hace falta un paso para lograr que otros pongan en práctica las ideas y decisiones (poner en marcha el trabajo) caracterizan esa función de distintas maneras. Si planificar, organizar y controlar incluyen en gran parte la **toma de decisiones en el campo económico** (elección del mejor empleo de los recursos escasos para alcanzar los objetivos), entonces hay que incluir una **función específica para lograr la realización, para poner en acción a los dirigidos**: se la puede llamar **dirección, supervisión o motivación**.
- La autoridad que se delega formalmente en alguien para regir un departamento o toda la empresa (caso del Gerente General) **conlleva la necesidad de motivar a los colaboradores**.

---

## Las funciones gerenciales — [p. 35]

Resumiendo los antecedentes anteriores, las principales **funciones gerenciales** son:

1. **Establecer objetivos** para toda la organización o para el sector a su cargo.
2. **Planificar** el trabajo de la organización o del sector a su cargo para que se logren los objetivos.
3. **Obtener los recursos** para ese objeto y **organizar** el trabajo planificado de modo que se realice de la forma más efectiva y eficiente.
4. **Motivar** a los dirigidos a fin de que lleven a cabo las tareas necesarias a ese fin (que son metas-medios para los objetivos del gerente).
5. **Controlar** la ejecución del trabajo, comparando los resultados reales con los esperados.
6. **Introducir las modificaciones** en los planes o en las acciones que sean necesarias cuando los desvíos de éstos o los cambios en el ambiente lo exijan.

---

## Las funciones como sistema; tareas del gerente (Drucker) y leyenda vs. realidad (Mintzberg) — [p. 36]

- El proceso se verifica en **todos los niveles jerárquicos** de la gerencia y en **todos los departamentos**: la mayoría de las funciones y roles del capítulo se aplican a todos los que tienen la responsabilidad de administrar, en sentido amplio. La **Dirección Superior** lo hace para la empresa en su totalidad; los **gerentes (o jefes)**, cada uno para su departamento.
- Las funciones **no se excluyen** unas a otras: están **íntimamente interrelacionadas** (p. ej., el gerente planifica la función de control u organiza la planificación de actividades). Por estar interrelacionadas, las funciones gerenciales **constituyen un sistema**.
- **Tareas** del gerente (expresiones prácticas de sus funciones). Definición de **Peter Drucker**: *"El gerente sólo debe hacer aquello que no pueda delegar a otro"*. Expresada así suena excluyente en extremo y a veces inaplicable, pero **es correcta**. No significa que el gerente deba cumplir todo lo enunciado como rígidos mandamientos cotidianos.
- **Mintzberg:** hay una **leyenda** acerca de lo que hacen (o deben hacer) los gerentes y una **realidad** bastante distinta, mucho más elástica, variada y dinámica. Aunque parezca contradictorio, esa realidad **no desmiente los principios teóricos**: permite entender cómo se manifiestan en la vida diaria de la organización.

## Roles de los gerentes: qué es un rol y el enfoque de Mintzberg — [p. 36]

- **Rol:** *"los patrones de conducta que se esperan de un individuo en una unidad social"*. Es perfectamente aplicable a quien forma parte de la unidad funcional de una organización.
- Ampliando: el papel o rol es **lo que se espera que alguien haga para satisfacer acabadamente los requerimientos de su puesto**.
- **Henry Mintzberg**, basándose en una encuesta muy amplia y rigurosa, expuso que *"existe considerable semejanza en el comportamiento de los administradores en todos los niveles"*. El encadenamiento que describe:
  - todos poseen **autoridad formal** sobre sus unidades;
  - esa autoridad les confiere un **"estatus"** (condición);
  - el estatus hace que tengan **relaciones interpersonales** con colaboradores, colegas y superiores;
  - esas personas, a su vez, les **suministran la información** que necesitan para la **toma de decisiones**;
  - esos aspectos distintos del trabajo los impulsan, en todos los niveles, a asumir una serie de **papeles (funciones) interpersonales, informativos y decisionales**.
- Mintzberg definió los papeles como *"conjuntos orgánicos de comportamientos que se identifican con un puesto"*.
- **Nota de la cátedra (al pie):** es impropio asimilar **"funciones"** con **"papeles"**. Las funciones son **asignadas formalmente a cada puesto**; los papeles son sinónimo de **"roles"** y están más sujetos a las **características personales** de quienes desempeñan los cargos.
- Conviene pararse en una visión más completa que el mero enunciado global (teórico) de funciones y tareas, para descubrir las múltiples facetas de la labor gerencial con su compleja trama de interacciones. El libro lo hace a partir de dos autores: **H. Mintzberg** y **Jean Pierre Sallenave**; expone cada enfoque por separado y después los relaciona para alcanzar una concepción más totalizadora.

---

## Los tres papeles básicos según Sallenave — [p. 36]

Para **Sallenave**, el gerente ha de desarrollar **tres papeles básicos**: **estratega, planeador-organizador y líder-comunicador** [p. 37]:

- **Estratega:** persona cuya acción se encamina a **modificar el medio o las relaciones entre la empresa y su entorno** (lo que en un individuo llamaríamos "comportamiento"). La **estrategia** sería entonces el conjunto de relaciones entre el medio externo y el medio interno, y es **esencialmente política** (determinada en función de los objetivos más generales).
- **Planeador-organizador:** le incumbe **modificar la estructura de acuerdo con la estrategia** para que exista **congruencia** entre ambas y se valoricen mutuamente. A menudo habrá de mantener un cierto grado de **desorden y de aparente irracionalidad**. "Estructura" no es solo la definición de jerarquías y funciones del personal (el organigrama) sino **todo el esquema organizacional**, incluyendo los sistemas de motivación, información y toma de decisiones.
- **Líder y comunicador:** debe **a)** influir en el comportamiento de sus colaboradores; **b)** hacer comprender a sus **públicos** (externos e internos: clientes, banqueros, personal, proveedores, accionistas, etc.) cuál es la **estrategia de la empresa**. Para eso necesita un **equilibrio** adecuado entre su sensibilidad respecto del **logro de los objetivos** y la relativa a las **necesidades de la gente**. (Nota del libro: para este aspecto es útil comprender el **"grid gerencial"** de Blake y Mouton.)

## Las esferas de actuación del gerente según Mintzberg — [p. 37]

- Según **Henry Mintzberg**, el trabajo del gerente puede describirse como la **suma de varios papeles o comportamientos**. Enfoca el tema en **dos planos, sucesivos e interconectados**.
- **Las esferas de actuación** del gerente son **tres**: **interpersonal, informacional y decisional**, y en cada una juega **diversos papeles**:

| Esfera | Cómo la caracteriza el libro | Papeles |
|---|---|---|
| **Interpersonal** | Tres papeles | Figura directiva o representante · Líder · Enlace |
| **Informacional** | Tres papeles; el gerente se constituye en el **foco central de información de la empresa** | Monitor · Difusor (diseminador) · Portavoz (vocero) |
| **Decisional** | Cuatro papeles; la información es la fuente básica para decidir y el encargado de decidir en la unidad es el gerente | Emprendedor · Árbitro · Administrador de recursos · Negociador |

- En total son **10 papeles** (3 + 3 + 4).

---

## Esfera interpersonal: representante, líder, enlace — [p. 37]

Comprende **tres papeles**: figura directiva o representante, líder y enlace.

### 1. Representante (figura directiva)

- Desempeña funciones como **cabeza de su unidad**, incluyendo papeles **simbólicos o ceremoniales**.
- Ante los miembros de la organización, como para los observadores externos, **personifica los aciertos y fracasos** de aquélla.

### 2. Líder

- Este papel es **inherente a su carácter de responsable del trabajo de su gente**. Algunas tareas implican **liderazgo directo**.
- **Coordina, dirige y motiva** a sus colaboradores (el libro remite al capítulo de "Liderazgo" para profundizar).
- Debe **conciliar los objetivos personales de cada uno con los de la organización**.
- Mientras que la **autoridad formal** le da una cantidad de poder, el **liderazgo legitimado** determina en gran medida **la cantidad que puede usar de ese poder**.

### 3. Enlace

- Los administradores *"deben aprender a trabajar dentro o fuera de la organización"* con quienquiera que pueda ayudarles al logro de sus objetivos.
- El gerente **establece contactos fuera de su línea vertical de mando**. Está probado que los gerentes utilizan **tanto tiempo con sus colaboradores como con otros colegas y personas ajenas a sus unidades**.
- Forman **redes de obligaciones recíprocas** (dentro y fuera), forman **coaliciones**, se apoyan en sus relaciones para **lograr cooperación**.
- En sentido más formal, son quienes **conectan a la empresa o a su departamento con el entorno** [p. 38].

## Esfera informacional: monitor, difusor, portavoz — [p. 38]

Desempeña **tres papeles**: monitor, difusor, portavoz. Y se constituye en el **foco central de información de la empresa**.

### 1. Monitor

- Hace una **permanente búsqueda, examen y seguimiento de informaciones del ambiente externo**, ya sea mediante **requerimientos a sus colaboradores o a otros enlaces**.
- Recibe gran cantidad de **información no solicitada**, sobre todo a través de **redes de contactos, tanto formales como extraoficiales, que él mismo ha desarrollado**.

### 2. Difusor (o diseminador)

- El gerente debe **compartir gran parte de esa información**.
- Los **informes que recaba de los contactos externos** pueden ser necesarios **dentro de la organización**.
- En su papel de diseminador debe **distribuir y divulgar la información que sea relevante para sus colaboradores**: la que ellos necesitan para poder **tomar decisiones acertadas** y alcanzar un **eficaz desempeño de sus propias funciones**.

### 3. Portavoz (o vocero)

- Actuando como vocero de su empresa o de su departamento, el gerente **transmite parte de su información a terceros, fuera de su unidad, particularmente a sus superiores**; porque todo gerente debe **informar a las personas influyentes que controlan su unidad**.
- En este papel, igual que los **diplomáticos**, se guían por **lo que conviene a la empresa y a su área**.

## Esfera decisional: emprendedor, árbitro, administrador de recursos, negociador — [p. 38]

- La **información no es un fin en sí misma**: es la **fuente básica para tomar decisiones**, y la persona encargada de tomar las decisiones dentro de la unidad es el **gerente**.
- **Sólo el gerente tiene la información completa y al día** para tomar el conjunto de decisiones que determinará la **estrategia del área**.
- Los papeles son **cuatro**: emprendedor, árbitro, administrador de recursos, negociador.

### 1. Emprendedor

- Es el **estratega** y *creador de negocios por excelencia* (el agregado en bastardilla es de la cátedra).
- Debe ser capaz de **iniciar cambios** cuando su conocimiento de la organización y del ambiente le indique la necesidad de producirlos.
- El gerente de una unidad trata de **mejorarla y adaptarla a las condiciones cambiantes del medio**.
- Está en **constante sondeo en busca de nuevas ideas**; cuando se presenta una realmente buena **inicia un proyecto de desarrollo**, que podrá **supervisar él mismo o delegar** a un colaborador.
- Cada tanto va **chequeando el nivel de avance** de cada proyecto, dándole impulso a los que lo necesiten.

### 2. Árbitro

- No existen organizaciones sin problemas ni conflictos: el gerente debe **manejarlos y resolverlos**, de manera de **mantener la estabilidad interna**.
- Para eso debe ser capaz de **pensar analítica y conceptualmente**, y **prever las implicaciones de las decisiones** que adopte.
- Debe **afrontar las perturbaciones**, respondiendo a las presiones, que a veces son enormes como para ignorarlas. Ejemplos del libro: **una huelga, un enfrentamiento dentro de su unidad, un cliente sumamente importante que va a la quiebra**.
- Cuando los gerentes **hacen caso omiso** a estas perturbaciones, éstas pueden terminar generando situaciones de **crisis**.

### 3. Administrador de recursos — [p. 39]

- La responsabilidad de decidir *"qué se le dará a cada uno dentro de la unidad y de cómo se dividirá el trabajo"* está en manos del gerente.
- Una de las cosas de más valor que asigna es **su propio tiempo**.
- Al **reservarse este poder**, el gerente se asegura que las decisiones estén en **sincronismo con los recursos asignados**.
- Como hay gran cantidad de objetivos y metas (que, más allá de los fines comunes, suelen ser a la vez **complementarios y contrapuestos**), los responsables bajo su mando **compiten por los recursos, tanto materiales como humanos**.
- Los recursos son **siempre limitados**, y él, como organizador de su unidad o empresa, deberá asignarlos logrando un **balanceo de objetivos**.
- *Las definiciones de prioridades que comporta este rol son, casi siempre, la expresión concreta de la verdadera política de un gerente* (agregado de la cátedra).

### 4. Negociador — [p. 39]

- Los estudios indican que los gerentes utilizan **gran cantidad de su tiempo en negociaciones**.
- Para los gerentes, las negociaciones son **una forma de vida**, porque son quienes cuentan con los **conocimientos y las facultades** necesarias para hacerlo y tienen la **autoridad para comprometer los recursos** de la organización o de su unidad.
- Se da tanto en el **ámbito interno** (p. ej., los gerentes departamentales con sus pares) como en el **externo** (p. ej., con el sindicato, con los competidores, con los proveedores).
- Eso también determina **a qué nivel gerencial le corresponde negociar cada situación**: *el presidente o el gerente general de una SA encabeza las negociaciones para evitar una huelga; el capataz discute una queja con el jefe de taller hasta llegar a una solución* (agregado de la cátedra).

Según Mintzberg: ¿cuáles son los roles de la esfera de actuación decisional?

<details>
<summary>Ver respuesta (del compilado)</summary>

La respuesta del compilado recorre las tres esferas antes de llegar a la pedida. Para Mintzberg las esferas de actuación son:

- **Interpersonal** (figura directiva, representante). Como **representante** tiene actividades de ceremonial: el gerente personifica los aciertos y fracasos. Como **líder** es el responsable del trabajo; sus objetivos individuales son los organizacionales. Y como **enlace** forma las coaliciones, redes.
- **Informacional** (siendo el foco central de la información de la empresa). Como **monitor** realiza las búsquedas, exámenes y seguimiento de la información. Como **difusor** divulga la información a los subordinados y como **portavoz** transmite esa información a los terceros.
- **Decisional** (toma de decisiones). Siendo **emprendedor o estratega**, **árbitro** para manejar conflictos, **administrador** asignando el trabajo y sincronizando recursos y, por último, **negociador**.

</details>

**Ojo (libro, p. 37):** sobre el líder, el libro no dice que "sus objetivos individuales son los organizacionales", sino que debe **conciliar los objetivos personales de cada uno con los de la organización**. Y la esfera decisional, que es la pedida, está en una sola línea: desarrollar los cuatro papeles con la teoría de arriba (p. 38–39).

**Dónde está en el libro:** p. 38–39 (sección "Roles de los gerentes", esfera Decisional); las otras dos esferas, p. 37–38.

</details>

## Los 10 papeles: relevancia según la jerarquía e inseparabilidad — [p. 39]

- Mintzberg encuentra estos **10 papeles**, que son los que se espera que cumpla un gerente.
- Estos papeles tienen **distinta relevancia según la jerarquía y las circunstancias**, y son desempeñados **de una u otra forma por los gerentes de todo nivel**.
- **No son fácilmente separables.** De hecho, los papeles interpersonal, informativo y el de toma de decisiones son **casi siempre inseparables**: *un gerente sin contactos de enlace carece de información; como resultado no puede diseminar información ni puede tomar decisiones*.
- Ejemplos de relevancia según el nivel gerencial [p. 40]:
  - el de **Representante** se presenta más frecuentemente en **niveles altos**;
  - el de **Enlace**, en el **nivel medio** (internamente) y **alto** (hacia afuera).

---

## Correspondencia Sallenave–Mintzberg y afinidades entre papeles (Ilustración 7) — [p. 39]

Para visualizar el entramado que forman, el libro examina la **correspondencia** entre los papeles de Sallenave y los de Mintzberg, y las **intra-vinculaciones sistémicas** entre los 10 papeles.

### Tabla de correspondencia

| Sallenave | Mintzberg |
|---|---|
| Estratega | Emprendedor, Negociador, Portavoz, Enlace, Representante |
| Planeador-organizador | Administrador de recursos, Monitor, Árbitro |
| Líder y comunicador | Representante, Líder, Difusor, Portavoz, Árbitro |

### Ilustración 7 — Papeles del gerente según H. Mintzberg — [p. 40]

Tres círculos: **Papeles Interpersonales** (Representante (1), Líder (2)(4), Enlace (3)(5)) y **Papeles Informacionales** (Monitor (3)(6), Difusor (2), Portavoz (1)(3)) arriba, unidos por flechas en ambos sentidos; de los dos sale una flecha hacia el círculo de abajo, **Papeles Decisionales** (Emprendedor (5), Árbitro de conflictos (4), Administrador de recursos (4)(6), Negociador (1)). Los números al lado de cada papel expresan **afinidades** con otros papeles que llevan el mismo número:

- **(1)** El papel de **representante** se suele aprovechar para ser **portavoz** de la firma y, de hecho, **negociador** con otras.
- **(2)** El **líder** también es un **difusor** para sus colaboradores.
- **(3)** En los procesos de **enlace** externos es de hecho un **portavoz**.
- **(4)** Entre las responsabilidades del **líder** está la de **arbitrar** en los conflictos intra-grupales, lo que tiene una indudable influencia en el desempeño del personal y en el clima laboral de su grupo.
- **(5) y (6)** Un gerente **emprendedor** trata permanentemente de establecer **enlaces** con el entorno de la empresa, lo que implica la necesidad de **decisiones para el aprovechamiento eficiente de los recursos** (monitor y administrador de recursos).

## Habilidades que se requieren de los gerentes: conceptuales, técnicas, humanas — [p. 41]

A partir de las teorías expuestas, los gerentes necesitan contar con distintas habilidades para desempeñar las actividades que caracterizan su trabajo. Hay **tres grandes grupos de habilidades gerenciales**:

- **Conceptuales:** implican tener **visión de la complejidad del todo**. Es la **capacidad de abstraer lo esencial** que subyace en un conjunto de situaciones particulares. Por ejemplo, comprender las complejas relaciones existentes entre las unidades a su cargo, o descubrir las direcciones hacia las que tienden los mercados de su empresa.
- **Técnicas:** comprenden el **conocimiento, procedimientos y recursos que se aplican en un determinado campo de especialización**, como ser la ingeniería, el cómputo, la contabilidad, la producción material o de servicios, etc.
- **Humanas:** residen en la **capacidad de interactuar y trabajar bien con otras personas**, ya sea de manera individual o en grupo; **motivar**; **resolver problemas interpersonales**.

---

## Habilidades y nivel de la estructura (Ilustración 8) — [p. 41]

- Los requerimientos de estas habilidades **no son iguales en todos los niveles de la estructura**. La naturaleza de las funciones y de los roles que los gerentes (y en general todo supervisor) deben desempeñar exige **en mayor medida algunas de estas habilidades, y menos de otras**.
- Pero **ninguno está eximido de contar con ellas**, conforme a las características del puesto que ocupe.
- **Caso particular de las habilidades humanas:** hay que considerar las que requiere la **conducción de colaboradores**, pero también las vinculadas a la **relación con pares**. Por eso su importancia **ha venido creciendo en los años recientes**: ya no sólo para los que manejan personal numeroso (por lo general en **niveles inferiores**), sino también para quienes deben aumentar la **motivación y la satisfacción de los funcionarios más altos**, pues no bastan las remuneraciones muy atractivas ni el propio impulso derivado del sentido de responsabilidad y las aspiraciones profesionales que se supone imperan en personas de ese nivel.
- Dicho de otro modo: **cualquier gerente, sin depender de su posición en la organización, debe poseer habilidades humanas.**
- **Ilustración 8 — Habilidades del Gerente y la pirámide organizacional.** A la izquierda, la pirámide de **nivel organizacional** con tres franjas: **Alto** (arriba), **Medio**, **Bajo** (abajo). A la derecha, las **habilidades requeridas** para esos mismos niveles: un cuadrado partido en diagonal donde las **Conceptuales** ocupan la parte de arriba (ancha en el nivel alto y se angosta hacia abajo) y las **Técnicas** la parte de abajo (anchas en el nivel bajo y se angostan hacia arriba); al lado, un bloque entero de **Humanas**, del mismo ancho en los tres niveles. Lectura:
  - **Nivel alto:** predominan las habilidades **conceptuales**; menos técnicas.
  - **Nivel medio:** mezcla intermedia de conceptuales y técnicas.
  - **Nivel bajo:** predominan las habilidades **técnicas**; menos conceptuales.
  - **Habilidades humanas:** importancia **pareja en todos los niveles**.
- El libro aclara que el cuadro expresa la **importancia relativa** de cada grupo, **sin absolutizarla**, y que hay que interpretarlo conforme a la realidad de cada organización y a las reflexiones anteriores.

## Efectividad gerencial según Drucker: las "cuatro C" — [p. 42]

Para **Peter Drucker**, la **efectividad gerencial** es función de los siguientes factores (las **"cuatro C"**):

- **C**oncentración;
- **C**onocimiento de las propias fortalezas;
- **C**apacidad para hacerse entender;
- **C**apacidad para ubicar correctamente a cada colaborador.
